openapi: 3.0.3
info:
  title: SM Connect
  description: Dokumentasi API Backend Distributor Channel menggunakan Laravel 12.
  version: 1.0.0
servers:
  - url: http://api-dev.susantimegah.com/api/distributor-channel
    description: Development Server
  - url: http://localhost:8000/api/distributor-channel
    description: Local Server
paths:
  /v1/external/customer-monthly-orders:
    post:
      summary: Add Customer Monthly Order via External B2B API
      description: Endpoint terproteksi API Key untuk sistem distributor (ERP/DMS) membuat CMO secara otomatis dari luar tanpa perlu double input di Customer Portal.
      tags:
        - External B2B Integration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - card_code
                - distributor_ref_no
                - doc_date
                - attachment
                - lines
              properties:
                card_code:
                  type: string
                  example: "C110003074"
                  description: Kode Customer/Distributor di sistem PT Susanti Megah
                distributor_ref_no:
                  type: string
                  example: "PO-DIST-202608-001"
                  description: Nomor PO / Ref Order Distributor (Idempotency Key)
                doc_date:
                  type: string
                  format: date
                  example: "2026-08-07"
                doc_due_date:
                  type: string
                  format: date
                  example: "2026-08-30"
                eta_date:
                  type: string
                  format: date
                  example: "2026-08-14"
                  description: Tanggal perkiraan tiba (otomatis diset ke doc_date + 7 hari jika kosong)
                po_number:
                  type: string
                  example: "PO-12345"
                comments:
                  type: string
                  example: "Order bulanan minyak via ERP"
                attachment:
                  type: string
                  format: binary
                  description: File dokumen PO/lampiran pendukung (Hanya format .pdf, max 10MB)
                lines:
                  type: array
          multipart/form-data:
            schema:
              type: object
              required:
                - card_code
                - distributor_ref_no
                - doc_date
                - attachment
                - lines
              properties:
                card_code:
                  type: string
                  example: "C110003074"
                distributor_ref_no:
                  type: string
                  example: "PO-DIST-202608-001"
                doc_date:
                  type: string
                  format: date
                  example: "2026-08-07"
                attachment:
                  type: string
                  format: binary
                  description: File dokumen PO/lampiran pendukung (Hanya format .pdf, max 10MB)
                lines:
                  type: string
                  description: Array item order dalam format JSON string (misal '[{"item_code":"B26","quantity":10}]')
                  example: '[{"item_code":"SKU-MINYAK-01","quantity":50,"unit_price":150000}]'
                  items:
                    type: object
                    required:
                      - item_code
                      - quantity
                    properties:
                      item_code:
                        type: string
                        example: "SKU-MINYAK-01"
                      quantity:
                        type: number
                        example: 50
                      unit_price:
                        type: number
                        example: 150000
                      unit_msr:
                        type: string
                        example: "CTN"
      responses:
        '201':
          description: CMO berhasil dibuat.
        '200':
          description: Response Idempotent (Order sudah pernah dibuat sebelumnya).
        '401':
          description: API Key / Bearer token tidak valid.
        '422':
          description: Validasi data gagal (misal SKU tidak ditemukan).
  /v1/external/customer-monthly-orders/distributors:
    get:
      summary: Get allowed customer codes for API Key
      description: Mendapatkan daftar kode customer (card_code) yang diizinkan untuk digunakan oleh API Key pengirim.
      tags:
        - External B2B Integration
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar distributor berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Daftar distributor berhasil diambil."
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        card_code:
                          type: string
                          example: "C110003419"
                        customer_name:
                          type: string
                          example: "SAKTI SETIA SANTOSA, PT."
                        depo:
                          type: string
                          example: "SITUBONDO"
                        address:
                          type: string
                          example: "JL.KERTOPATEN NOMOR 16 SURABAYA"
        '401':
          description: API Key tidak valid atau dinonaktifkan.
  /v1/external/customer-monthly-orders/items:
    get:
      summary: Get allowed items and prices for customer
      description: Mendapatkan daftar barang, satuan, dan harga yang berlaku untuk card_code distributor. Akses dibatasi hanya untuk card_code yang terhubung dengan API Key.
      tags:
        - External B2B Integration
      security:
        - BearerAuth: []
      parameters:
        - name: card_code
          in: query
          required: true
          description: Kode Customer/Distributor (contoh C110003419)
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Pencarian nama barang atau kode barang
          schema:
            type: string
      responses:
        '200':
          description: Daftar barang berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Daftar barang berhasil diambil."
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        item_code:
                          type: string
                          example: "B26"
                        item_name:
                          type: string
                          example: "MINYAK GORENG 1L"
                        sales_uom:
                          type: string
                          example: "Bal"
                        price:
                          type: number
                          example: 150000.00
                        brand:
                          type: string
                          example: "Sania"
        '403':
          description: Akses ditolak karena card_code di luar mapingan API Key.
        '422':
          description: Parameter card_code wajib disertakan.
  /v1/sales-dashboard/upload:
    post:
      summary: Upload Target or CMO Excel/CSV file
      description: Mengunggah file spreadsheet (.xlsx, .xls, .csv) untuk target penjualan atau CMO. Dynamic month columns (e.g. Januari 2026, Februari 2026) akan diparse dan dinormalisasi menjadi baris-baris data per bulan/tahun di tabel lokal.
      tags:
        - Sales Dashboard
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - type
              properties:
                file:
                  type: string
                  format: binary
                  description: File Excel atau CSV
                type:
                  type: string
                  enum: [target, cmo]
                  description: Tipe data yang diunggah
      responses:
        '200':
          description: Berhasil memproses upload data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Berhasil memproses upload data target.
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      processed_rows_count:
                        type: integer
                        example: 24

  /v1/sales-dashboard/raw-data:
    get:
      summary: Get raw sales dashboard records list
      description: Mengambil data target, CMO, PO/SO, dan DO mentah dengan pagination dan filter.
      tags:
        - Sales Dashboard
      security:
        - BearerAuth: []
      parameters:
        - name: customer_code
          in: query
          required: false
          schema:
            type: string
          description: Filter kode customer/distributor
        - name: brand
          in: query
          required: false
          schema:
            type: string
          description: Filter nama brand
        - name: month
          in: query
          required: false
          schema:
            type: integer
          description: Filter bulan (1-12)
        - name: year
          in: query
          required: false
          schema:
            type: integer
          description: Filter tahun
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Pencarian teks
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Data list dashboard berhasil diambil.

  /v1/sales-dashboard/bulk:
    delete:
      summary: Reset target/CMO amounts to 0 (Bulk)
      description: Mereset semua nilai target atau cmo menjadi 0 pada periode (bulan/tahun) tertentu.
      tags:
        - Sales Dashboard
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [target, cmo]
        - name: month
          in: query
          required: true
          schema:
            type: integer
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: customer_code
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Berhasil mereset data.

  /v1/sales-dashboard/sync-so-do:
    post:
      summary: Sync local PO/SO actual amounts and DO actual amounts (from SAP)
      description: Memicu sinkronisasi data actual PO/SO (berdasarkan sales orders lokal) dan DO (berdasarkan pengiriman SAP) untuk bulan/tahun tertentu.
      tags:
        - Sales Dashboard
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - month
                - year
              properties:
                month:
                  type: integer
                  example: 7
                year:
                  type: integer
                  example: 2026
                customer_code:
                  type: string
                  example: C110003074
      responses:
        '200':
          description: Sinkronisasi data actual berhasil.

  /v1/sales-dashboard/sync:
    post:
      summary: Sync CMO, SO, and SAP DO data to sales_dashboard_data
      description: Memicu sinkronisasi manual untuk data CMO, SO (yang sudah disetujui finance), dan DO (dari SAP) berdasarkan Tahun, CardCode, dan Brand. Hasilnya akan disimpan di tabel sales_dashboard_data (menggunakan customer code override sementara C110001252 jika diset).
      tags:
        - Sales Dashboard
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - Tahun
                - CardCode
                - Brand
              properties:
                Tahun:
                  type: string
                  description: Tahun data yang disinkronkan
                  example: "2026"
                CardCode:
                  type: string
                  description: Kode Customer/CardCode sumber
                  example: "C110003419"
                Brand:
                  type: string
                  description: Daftar brand yang dipisahkan koma
                  example: "KAPAL,GARAMI,LAYAR"
      responses:
        '200':
          description: Sinkronisasi data sales dashboard berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Data Sales Dashboard berhasil disinkronkan.
                  data:
                    type: object
                    properties:
                      year:
                        type: integer
                        example: 2026
                      customer_code:
                        type: string
                        example: C110001252
                      cmo_synced:
                        type: integer
                        example: 12
                      so_synced:
                        type: integer
                        example: 8
                      do_synced:
                        type: integer
                        example: 2

  /v1/sales-dashboard/comparison:
    get:
      summary: Get comparison dashboard data (Target vs CMO vs PO/SO vs DO) by Brand and Month
      description: Mengambil data perbandingan agregat target, CMO, PO/SO, dan DO dikelompokkan per brand dan per bulan untuk tahun tertentu.
      tags:
        - Sales Dashboard
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
          description: Tahun data perbandingan
          example: 2026
        - name: month
          in: query
          required: false
          schema:
            type: integer
          description: Filter bulan tertentu (1-12)
        - name: customer_code
          in: query
          required: false
          schema:
            type: string
          description: Filter kode customer
        - name: brand
          in: query
          required: false
          schema:
            type: string
          description: Filter nama brand (misal KAPAL, atau dipisahkan koma)
      responses:
        '200':
          description: Data perbandingan dashboard berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Data perbandingan dashboard berhasil diambil.
                  data:
                    type: object
                    properties:
                      year:
                        type: integer
                        example: 2026
                      totals:
                        type: object
                        properties:
                          target:
                            type: number
                          cmo:
                            type: number
                          so:
                            type: number
                          do:
                            type: number
                      lines:
                        type: array
                        items:
                          type: object
                          properties:
                            month:
                              type: integer
                              example: 1
                            brand:
                              type: string
                              example: "KAPAL"
                            target_amount:
                              type: number
                            cmo_amount:
                              type: number
                            so_amount:
                              type: number
                            do_amount:
                              type: number

  /v1/sales-dashboard/{id}:
    put:
      summary: Update a single sales dashboard record
      description: Memperbarui nilai target_amount, cmo_amount, so_amount, do_amount, customer_name, depo, atau brand secara manual berdasarkan ID.
      tags:
        - Sales Dashboard
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_amount:
                  type: number
                  example: 1250000.00
                cmo_amount:
                  type: number
                  example: 1400000.00
                so_amount:
                  type: number
                  example: 1000000.00
                do_amount:
                  type: number
                  example: 950000.00
                customer_name:
                  type: string
                  example: PT Distributor Utama Baru
                depo:
                  type: string
                  example: Surabaya
                brand:
                  type: string
                  example: GARAMI
      responses:
        '200':
          description: Data dashboard berhasil diperbarui.
    delete:
      summary: Delete a single sales dashboard record
      description: Menghapus satu data record berdasarkan ID.
      tags:
        - Sales Dashboard
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Record berhasil dihapus.

  /v1/sales-returns/do-by-so:
    get:
      summary: Get Delivery Order (DO) lines by Sales Order from SAP
      description: Mendapatkan daftar detail baris Delivery Order (DO) dari SAP berdasarkan kode/nomor Sales Order (SO).
      tags:
        - Sales Return
      security:
        - BearerAuth: []
      parameters:
        - name: so_num
          in: query
          required: true
          schema:
            type: string
          description: SAP DocNum atau ID lokal Sales Order
          example: "260710018"
      responses:
        '200':
          description: Data DO by SO berhasil diambil dari SAP
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Data DO by SO berhasil diambil dari SAP.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Status:
                          type: string
                          example: O
                        DocNum:
                          type: string
                          example: "260710002"
                        DocDate:
                          type: string
                          example: "20260721"
                        BaseLine:
                          type: string
                          example: "0"
                        ItemCode:
                          type: string
                          example: "B26"
                        ItemDescription:
                          type: string
                          example: "KOP 250 M @ 10 KG / BAL"
                        Delivered_Qty:
                          type: string
                          example: "1550.000000"
        '401':
          description: Tidak terautentikasi
        '500':
          description: Error internal server atau API SAP

  /v1/sales-returns:
    get:
      summary: Get all sales return requests
      description: Mendapatkan daftar permohonan retur barang, terfilter berdasarkan hak akses distributor user.
      tags:
        - Sales Return
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [SUBMITTED, APPROVED, REJECTED]
          description: Filter status retur
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Tanggal mulai pengajuan (YYYY-MM-DD)
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Tanggal akhir pengajuan (YYYY-MM-DD)
      responses:
        '200':
          description: Daftar pengajuan retur berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar pengajuan retur berhasil diambil.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SalesReturnDetail'

    post:
      summary: Submit a new sales return request
      description: Mengajukan permohonan retur barang baru (langsung SUBMITTED) dengan melampirkan bukti foto (maksimal 5 foto).
      tags:
        - Sales Return
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                sales_order_id:
                  type: integer
                  example: 142
                reason:
                  type: string
                  example: "Barang rusak saat pengiriman fisik"
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      sales_order_detail_id:
                        type: integer
                        example: 1043
                      quantity:
                        type: number
                        example: 5.0
                      reason:
                        type: string
                        example: "Pecah di dalam kardus"
                      do_num:
                        type: string
                        example: "260710002"
                      do_date:
                        type: string
                        example: "20260721"
                      baseline:
                        type: integer
                        example: 0
                attachments:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
              required:
                - sales_order_id
                - items
      responses:
        '201':
          description: Pengajuan retur berhasil dikirim.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Pengajuan retur berhasil dikirim.
                  data:
                    $ref: '#/components/schemas/SalesReturn'

  /v1/sales-returns/{id}:
    get:
      summary: Get details of a sales return request
      description: Mendapatkan detail lengkap dari satu permohonan retur barang berdasarkan ID.
      tags:
        - Sales Return
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detail pengajuan retur berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Detail pengajuan retur berhasil diambil.
                  data:
                    $ref: '#/components/schemas/SalesReturn'

  /v1/sales-returns/{id}/approve:
    post:
      summary: Approve a sales return request (Admin Sales)
      description: Menyetujui permohonan retur barang. Hanya dapat dilakukan oleh Admin Sales.
      tags:
        - Sales Return
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pengajuan retur berhasil disetujui.

  /v1/sales-returns/{id}/reject:
    post:
      summary: Reject a sales return request (Admin Sales)
      description: Menolak permohonan retur barang. Hanya dapat dilakukan oleh Admin Sales.
      tags:
        - Sales Return
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Kuantitas tidak sesuai fisik"
              required:
                - reason
      responses:
        '200':
          description: Pengajuan retur berhasil ditolak.

  /v1/pi-settings:
    get:
      summary: Get active Proforma Invoice signature configuration
      description: Mendapatkan nama penandatangan, jabatan, dan berkas/URL tanda tangan digital untuk PI.
      tags:
        - PI Settings
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
          description: ID User pemilik tanda tangan.
        - name: document_tag
          in: query
          required: false
          schema:
            type: string
          description: Tag pengelompokan dokumen (misal INVOICE).
      responses:
        '200':
          description: Konfigurasi berhasil diambil.
    post:
      summary: Update Proforma Invoice signature configuration
      description: Memperbarui nama penandatangan dan/atau mengunggah gambar tanda tangan digital.
      tags:
        - PI Settings
      security:
        - BearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - signer_name
                - signer_title
              properties:
                user_id:
                  type: integer
                  description: ID User pemilik tanda tangan.
                  nullable: true
                document_tag:
                  type: string
                  description: Tag pengelompokan dokumen (misal INVOICE).
                  nullable: true
                signer_name:
                  type: string
                  example: Kushan Wijono
                signer_title:
                  type: string
                  example: Branch Manager
                signature_file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Konfigurasi berhasil diperbarui.

  /v1/claims/balance-ledger:
    get:
      summary: Get Claim Balance Ledger Transactions
      description: Mengambil daftar riwayat transaksi saldo reward/klaim (Debit, Kredit, dan Saldo Berjalan) milik customer.
      tags:
        - Balance Ledger
      security:
        - BearerAuth: []
      parameters:
        - name: customer_codes
          in: query
          required: false
          schema:
            type: string
          description: Kode customer (bisa koma-terpisah, misal CUST01,CUST02). Jika distributor, otomatis hanya melihat miliknya.
          example: C110003074
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Tanggal mulai transaksi (YYYY-MM-DD).
          example: "2026-06-01"
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Tanggal akhir transaksi (YYYY-MM-DD).
          example: "2026-06-30"
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [CLAIM, WITHDRAW, CORRECTION]
          description: Filter tipe transaksi ledger.
          example: CLAIM
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 15
          description: Jumlah item per halaman.
          example: 15
      responses:
        '200':
          description: Daftar riwayat transaksi saldo berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
