  /v1/production/orders/sap:
    post:
      summary: Submit Production Order (PDO) to SAP
      description: Mengirim data Production Order (PDO) secara langsung ke API SAP (`http://103.18.133.187:3100/api/addpdo`).
      tags:
        - Production Order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ItemCode
