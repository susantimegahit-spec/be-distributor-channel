        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Tanggal mulai transaksi (YYYY-MM-DD) untuk rentang filter.
          example: "2026-07-01"
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
