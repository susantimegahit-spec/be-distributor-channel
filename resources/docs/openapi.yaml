                        batch_no:
                          type: string
                          example: B-001
                          nullable: true
                        debit:
                          type: number
                          example: 150000.00
                        customer_code:
                          type: string
                          example: C110003074
                        customer_name:
                          type: string
                          example: PT SUSANTI MEGAHIT
                        depo:
                          type: string
                          example: DEPO SURABAYA
                        transaction_date:
                          type: string
                          format: date
                          example: "2026-07-14"

