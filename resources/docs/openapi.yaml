  /v1/claims/balance-ledger/adjustment:
    post:
      summary: Create Manual Balance Adjustment
      description: Membuat penyesuaian/koreksi saldo secara manual (Debit/Kredit) untuk customer.
      tags:
        - Balance Ledger
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_code
                - adjustment_type
                - description
                - type
              properties:
                customer_code:
                  type: string
                  example: C110003074
                adjustment_type:
                  type: string
                  enum: [DEBIT, CREDIT]
                  description: DEBIT untuk menambah saldo, CREDIT untuk memotong saldo.
                  example: DEBIT
                amount:
                  type: number
                  example: 500000.00
                description:
                  type: string
                  example: Koreksi kelebihan klaim
                type:
                  type: string
                  maxLength: 30
                  description: "Tipe transaksi ledger (contoh: CLAIM, TRANSACTION, WITHDRAW, RETURN, CORRECTION, BONUS). Nilai bersifat dinamis dan otomatis dikonversi ke UPPERCASE di backend."
                  example: CORRECTION
                ref_number:
                  type: string
                  description: Nomor referensi kustom (opsional, jika kosong otomatis digenerate ADJ-YYYYMMDD-XXX).
                  example: REF-CUSTOM-123
                start_date:
                  type: string
                  format: date
                  description: Tanggal mulai periode klaim terkait (opsional).
                  example: "2026-07-01"
                end_date:
                  type: string
                  format: date
                  description: Tanggal akhir periode klaim terkait (opsional).
                  example: "2026-07-31"
      responses:
        '201':
          description: Koreksi saldo berhasil dibuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Koreksi saldo berhasil dibuat.
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      customer_code:
                        type: string
                        example: C110003074
                      ref_number:
                        type: string
                        example: ADJ-20260713-001
                      transaction_date:
                        type: string
                        format: date
                        example: "2026-07-13"
                      type:
                        type: string
                        example: CORRECTION
                      debit:
                        type: number
                        example: 500000.00
                      credit:
                        type: number
                        example: 0.00
                      running_balance:
                        type: number
                        example: 1350000.00
                      description:
                        type: string
                        example: Koreksi kelebihan klaim
                      created_by:
                        type: string
                        example: admin

