        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Cari berdasarkan kode produk atau komentar
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Filter berdasarkan kode produk spesifik
      responses:
        '200':
          description: Daftar Bill of Material berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar Bill of Material berhasil diambil.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductionBom'

    post:
      summary: Create a new production BOM
      description: Membuat rancangan Bill of Material (BOM) baru beserta detail komponennya.
      tags:
        - Production BOM
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - qty
                - to_whs
                - details
              properties:
                code:
                  type: string
                  example: "ILP000117"
                  description: Parent Product Code
                qty:
                  type: number
                  example: 1.0
                  description: Base Quantity
                to_whs:
                  type: string
                  example: "WHS01"
                  description: Receipt Warehouse Code
                alternate:
                  type: integer
                  example: 1
                  description: BOM Alternate Version
                comments:
                  type: string
                  example: "BOM Garam JUMBO"
                details:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - code
                      - quantity
                    properties:
                      type:
                        type: string
                        enum: [Item, Resource, "4", "290"]
                        example: "Item"
                      code:
                        type: string
                        example: "RAW001"
                      quantity:
                        type: number
                        example: 0.5
                      warehouse:
                        type: string
                        example: "WHS01"
                      issue_mthd:
                        type: string
                        enum: [B, M]
                        example: "B"
                      comments:
                        type: string
                        example: "Bahan penolong"
      responses:
        '201':
          description: Bill of Material berhasil dibuat.

