<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>PT Susanti Megah - SM Connect Docs</title>

  <!-- Import Google Fonts (Inter) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">

  <!-- Import RapiDoc web component -->
  <script type="module" src="https://unpkg.com/rapidoc/dist/rapidoc-min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: #ffffff; /* White */
      color: #0f172a; /* Slate Dark text */
      overflow: hidden;
    }

    rapi-doc {
      width: 100%;
      height: calc(100vh - 60px);
    }

    /* ============================================================
       Header Bar (Light Theme)
     ============================================================ */
    .header-bar {
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      box-sizing: border-box;
    }

    .header-title-wrapper h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 0.05em;
    }

    .header-title-wrapper span {
      font-size: 11px;
      color: #0284c7; /* Sky Blue Highlight */
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ============================================================
       Header Controls (Expand / Collapse)
     ============================================================ */
    .header-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .control-btn {
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #64748b;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
    }

    .control-btn:hover {
      background-color: #e2e8f0;
      border-color: #94a3b8;
      color: #0f172a;
    }

    .control-btn svg {
      stroke: currentColor;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header-bar">
    <div class="header-title-wrapper">
      <h1>PT SUSANTI MEGAH</h1>
      <span>IT Department - SM Connect API</span>
    </div>
    <div class="header-controls">
      <button class="control-btn" onclick="toggleNavStyle('expanded')" title="Expand Semua Kategori">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        Expand All
      </button>
      <button class="control-btn" onclick="toggleNavStyle('collapsed')" title="Collapse Semua Kategori">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/></svg>
        Collapse All
      </button>
      <a href="/docs/logout" class="control-btn" style="text-decoration:none; color:#dc2626; border-color:#fca5a5; background-color:#fef2f2;" title="Logout dari Dokumentasi">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Logout
      </a>
    </div>
  </div>

  <!-- RapiDoc Component (Light Theme with Collapsible Sidebar) -->
  <rapi-doc
    id="api-docs"
    spec-url="./openapi.yaml"
    theme="light"
    render-style="focused"
    nav-item-style="collapsed"
    on-nav-tag-click="expand-collapse"
    show-header="false"
    allow-search="true"
    allow-try="true"
    allow-spec-download="true"
    regular-font="Inter, sans-serif"
    primary-color="#0284c7"
    bg-color="#ffffff"
    nav-bg-color="#f8fafc"
    nav-accent-color="#0284c7"
    nav-item-spacing="relaxed"
    layout="row"
  > </rapi-doc>

  <script>
    // Fungsi expand/collapse all untuk semua kategori di shadow DOM
    function toggleNavStyle(style) {
      const apiDocs = document.getElementById('api-docs');
      if (!apiDocs || !apiDocs.shadowRoot) return;

      const headers = apiDocs.shadowRoot.querySelectorAll('.nav-bar-tag');
      headers.forEach(header => {
        const next = header.nextElementSibling;
        const isExpanded = header.classList.contains('expanded') || (next && next.classList.contains('nav-bar-path'));
        
        if (style === 'expanded' && !isExpanded) {
          header.click();
        } else if (style === 'collapsed' && isExpanded) {
          header.click();
        }
      });
    }

    window.addEventListener('DOMContentLoaded', function () {
      const apiDocs = document.getElementById('api-docs');

      // Polling untuk menemukan kolom input pencarian bawaan RapiDoc di shadow DOM
      const attachSearchListener = setInterval(function() {
        if (apiDocs && apiDocs.shadowRoot) {
          const searchInput = apiDocs.shadowRoot.querySelector('#nav-bar-search');
          if (searchInput) {
            clearInterval(attachSearchListener);
            
            // Dengarkan input pencarian
            searchInput.addEventListener('input', function(e) {
              const query = e.target.value.trim();
              if (query === '') {
                // Jika pencarian kosong, ciutkan kembali semua kategori agar rapi
                toggleNavStyle('collapsed');
              } else {
                // Jika sedang menyaring, buka kategori agar item pencarian terlihat
              }
            });
          }
        }
      }, 200);

      // Batasi polling agar berhenti setelah 15 detik jika tidak ditemukan
      setTimeout(function() {
        clearInterval(attachSearchListener);
      }, 15000);
    });

  </script>

</body>

</html>
