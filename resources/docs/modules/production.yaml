openapi: 3.0.3
info:
  title: "SMESTA API - Modul Production (BOM, PDO, Issue, Receipt, Change Product)"
  description: |
    Dokumentasi API Modular SMESTA (Bagian dari `resources/docs/openapi.yaml`).
    Edit file ini secara langsung agar ringan di IDE, lalu jalankan `php artisan docs:openapi bundle` untuk menyatukan kembali ke `openapi.yaml`.
  version: 1.0.0
servers:
  - url: https://api-sm-connect.susantimegah.com/api/distributor-channel
    description: Production Server
  - url: http://api-dev.susantimegah.com/api/distributor-channel
    description: Development Server
  - url: http://localhost:8000/api/distributor-channel
    description: Local Server
paths:
  /v1/production/change-products:

    get:
      summary: Daftar Transaksi Change Product
      description: Mengambil seluruh riwayat transaksi Change Product (penggantian item lama ke item baru) beserta status sinkronisasi SAP.
      tags:
        - Production - Change Product
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          description: Pencarian berdasarkan nomor dokumen CP, comments, addon_id, atau item code
          schema:
            type: string
        - name: status
          in: query
          description: Filter status transaksi (DRAFT, COMPLETE, CANCELLED)
          schema:
            type: string
            enum: [DRAFT, COMPLETE, CANCELLED]
        - name: sap_status
          in: query
          description: Filter status sinkronisasi SAP (PENDING, SYNCED, FAILED)
          schema:
            type: string
            enum: [PENDING, SYNCED, FAILED]
        - name: date_from
          in: query
          description: Filter tanggal dokumen mulai (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: Filter tanggal dokumen akhir (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Data transaksi Change Product berhasil diambil.
    post:
      summary: Buat Draft / Simpan & Posting Transaksi Change Product
      description: |
        Menyimpan transaksi Change Product baru. Default berstatus **DRAFT**.
        Jika parameter `post_now: true` dikirimkan, backend akan langsung memproses ke SAP B1 (`POST /api/AddCP`), mengambil nomor GI (Goods Issue) dan GR (Goods Receipt), lalu mengubah status menjadi **COMPLETE**.
      tags:
        - Production - Change Product
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - docDate
                - oldLines
                - newLines
              properties:
                docDate:
                  type: string
                  format: date-time
                  example: "2026-09-01T00:00:00"
                docDueDate:
                  type: string
                  format: date-time
                  example: "2026-09-01T00:00:00"
                comments:
                  type: string
                  example: "Change product 4 item lama menjadi 2 item baru"
                shift:
                  type: string
                  example: "1"
                unit:
                  type: string
                  example: "UNIT-A"
                addonId:
                  type: string
                  example: "ADDON-CP-001"
                userId:
                  type: string
                  example: "105"
                post_now:
                  type: boolean
                  description: Jika true, langsung diposting ke SAP saat disimpan
                  example: false
                oldLines:
                  type: array
                  description: Daftar item lama yang dikeluarkan (Goods Issue)
                  items:
                    type: object
                    required:
                      - itemCode
                      - quantity
                      - fromWhsCode
                    properties:
                      itemCode:
                        type: string
                        example: "OLD-01"
                      quantity:
                        type: number
                        example: 10.0
                      fromWhsCode:
                        type: string
                        example: "PRD01-01"
                      ocrCode:
                        type: string
                        example: "CC-PROD"
                      ocrCode2:
                        type: string
                        example: "DEPT-MFG"
                      ocrCode3:
                        type: string
                        example: "LINE-01"
                newLines:
                  type: array
                  description: Daftar item baru yang dimasukkan (Goods Receipt)
                  items:
                    type: object
                    required:
                      - itemCode
                      - quantity
                      - toWhsCode
                    properties:
                      itemCode:
                        type: string
                        example: "NEW-01"
                      quantity:
                        type: number
                        example: 12.0
                      toWhsCode:
                        type: string
                        example: "FG01"
                      ocrCode:
                        type: string
                        example: "CC-PROD"
                      ocrCode2:
                        type: string
                        example: "DEPT-MFG"
                      ocrCode3:
                        type: string
                        example: "LINE-01"
                      valueAllocationPercent:
                        type: number
                        example: 0
      responses:
        '201':
          description: Transaksi Change Product berhasil disimpan.
        '422':
          description: Validasi payload gagal.
        '500':
          description: Terjadi kesalahan server atau integrasi SAP gagal.

  /v1/production/change-products/{id}:
    get:
      summary: Detail Transaksi Change Product
      description: Mengambil detail satu transaksi Change Product berdasarkan ID, termasuk detail oldLines dan newLines serta nomor GI / GR jika sudah COMPLETE.
      tags:
        - Production - Change Product
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detail transaksi Change Product berhasil diambil.
        '404':
          description: Data tidak ditemukan.
    put:
      summary: Update Draft Transaksi Change Product
      description: Memperbarui data transaksi Change Product. Hanya diizinkan jika status masih **DRAFT**.
      tags:
        - Production - Change Product
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                docDate:
                  type: string
                  format: date-time
                docDueDate:
                  type: string
                  format: date-time
                comments:
                  type: string
                shift:
                  type: string
                unit:
                  type: string
                addonId:
                  type: string
                userId:
                  type: string
                post_now:
                  type: boolean
                oldLines:
                  type: array
                  items:
                    type: object
                    properties:
                      itemCode:
                        type: string
                      quantity:
                        type: number
                      fromWhsCode:
                        type: string
                      ocrCode:
                        type: string
                      ocrCode2:
                        type: string
                      ocrCode3:
                        type: string
                newLines:
                  type: array
                  items:
                    type: object
                    properties:
                      itemCode:
                        type: string
                      quantity:
                        type: number
                      toWhsCode:
                        type: string
                      ocrCode:
                        type: string
                      ocrCode2:
                        type: string
                      ocrCode3:
                        type: string
                      valueAllocationPercent:
                        type: number
      responses:
        '200':
          description: Data Change Product berhasil diperbarui.
        '400':
          description: Data berstatus COMPLETE tidak dapat diubah.
    delete:
      summary: Hapus Draft Transaksi Change Product
      description: Menghapus transaksi Change Product. Hanya diizinkan jika status masih **DRAFT**.
      tags:
        - Production - Change Product
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Transaksi Change Product berhasil dihapus.
        '400':
          description: Data berstatus COMPLETE tidak dapat dihapus.

  /v1/production/change-products/{id}/post:
    post:
      summary: Posting Draft Change Product ke SAP (/api/AddCP)
      description: Mengirim transaksi Change Product berstatus **DRAFT** ke SAP B1. Setelah sukses, nomor GI (Issue Entry) dan GR (Receipt Entry) akan dicatat dan status transaksi berubah menjadi **COMPLETE**.
      tags:
        - Production - Change Product
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Berhasil diposting ke SAP dan status berubah COMPLETE.
        '500':
          description: Gagal diposting ke SAP.

  /v1/production/add-cp:
    post:
      summary: Direct Save & Post Change Product ke SAP (Alias)
      description: Endpoint praktis untuk langsung menyimpan dan mengeksekusi posting Change Product ke SAP dalam satu panggilan.
      tags:
        - Production - Change Product
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - docDate
                - oldLines
                - newLines
              properties:
                docDate:
                  type: string
                  format: date-time
                  example: "2026-09-01T00:00:00"
                docDueDate:
                  type: string
                  format: date-time
                  example: "2026-09-01T00:00:00"
                comments:
                  type: string
                  example: "Change product 4 item lama menjadi 2 item baru"
                shift:
                  type: string
                  example: "1"
                unit:
                  type: string
                  example: "UNIT-A"
                addonId:
                  type: string
                  example: "ADDON-CP-001"
                userId:
                  type: string
                  example: "105"
                oldLines:
                  type: array
                  items:
                    type: object
                    required:
                      - itemCode
                      - quantity
                      - fromWhsCode
                    properties:
                      itemCode:
                        type: string
                        example: "OLD-01"
                      quantity:
                        type: number
                        example: 10.0
                      fromWhsCode:
                        type: string
                        example: "PRD01-01"
                      ocrCode:
                        type: string
                        example: "CC-PROD"
                      ocrCode2:
                        type: string
                        example: "DEPT-MFG"
                      ocrCode3:
                        type: string
                        example: "LINE-01"
                newLines:
                  type: array
                  items:
                    type: object
                    required:
                      - itemCode
                      - quantity
                      - toWhsCode
                    properties:
                      itemCode:
                        type: string
                        example: "NEW-01"
                      quantity:
                        type: number
                        example: 12.0
                      toWhsCode:
                        type: string
                        example: "FG01"
                      ocrCode:
                        type: string
                        example: "CC-PROD"
                      ocrCode2:
                        type: string
                        example: "DEPT-MFG"
                      ocrCode3:
                        type: string
                        example: "LINE-01"
                      valueAllocationPercent:
                        type: number
                        example: 0
      responses:
        '201':
          description: Berhasil diposting ke SAP.
        '500':
          description: Gagal diposting ke SAP.

  /v1/production/boms/import:
    post:
      summary: Import BOMs from Flat JSON Rows Array
      description: Mengimpor data master Bill of Material (BOM) dari format array objek flat Excel (1 baris per komponen) yang dikirim oleh Frontend. Backend secara otomatis mengelompokkan baris berdasarkan 'BOM ID' atau 'Prod ItemCode' ke dalam Header BOM (`production_boms`) dan Detail Komponen (`production_bom_items`).
      tags:
        - Production BOM
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rows
              properties:
                rows:
                  type: array
                  description: Array of flat Excel row objects
                  items:
                    type: object
                    properties:
                      BOM ID:
                        type: string
                        example: "1"
                      Prod ItemCode:
                        type: string
                        example: "A07"
                      Prod ItemName:
                        type: string
                        example: "GARAMI 200 M @ 4 KG/BAL"
                      Alternative BOM:
                        type: integer
                        example: 1
                      BOM Header Qty:
                        type: number
                        example: 1
                      Prod Warehouse:
                        type: string
                        example: "PRD01-05"
                      Line No:
                        type: integer
                        example: 1
                      Component Type:
                        type: string
                        enum: [Item, Resource]
                        example: "Item"
                      Component ItemCode:
                        type: string
                        example: "RAW-SALT-01"
                      Component ItemName:
                        type: string
                        example: "Garam Curah Halus"
                      Component Qty BOM:
                        type: number
                        example: 4.05
                      Component Warehouse:
                        type: string
                        example: "RAW-01"
                      Issue Method:
                        type: string
                        enum: [B, M]
                        example: "B"
      responses:
        '200':
          description: Data BOM berhasil diimpor
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Berhasil memproses 1 BOM (1 dibuat, 0 diperbarui) dengan 7 detail komponen."
                  data:
                    type: object
                    properties:
                      total_boms:
                        type: integer
                        example: 1
                      total_boms_created:
                        type: integer
                        example: 1
                      total_boms_updated:
                        type: integer
                        example: 0
                      total_items_created:
                        type: integer
                        example: 7
        '422':
          description: Payload kosong atau tidak valid
        '500':
          description: Gagal mengimpor data ke database

  /v1/production/boms/upload-excel:
    post:
      summary: Upload & Import BOMs from Excel / CSV File
      description: Mengunggah file spreadsheet Excel (.xlsx, .xls, .csv) untuk diimpor ke dalam master Header BOM dan Detail Komponen.
      tags:
        - Production BOM
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File Excel (.xlsx, .xls, .csv) max 10MB.
      responses:
        '200':
          description: File Excel berhasil diparse dan data BOM berhasil disimpan
        '422':
          description: File tidak valid atau kosong
        '500':
          description: Gagal membaca file atau error database

  /v1/production/resources:
    get:
      summary: Get list of production resources
      description: Mendapatkan daftar semua resource produksi yang disinkronisasi dari SAP.
      tags:
        - Production
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Pencarian berdasarkan kode atau nama resource.
      responses:
        '200':
          description: Daftar resource produksi berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar resource produksi berhasil diambil.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductionResource'
        '401':
          description: Tidak terautentikasi

  /v1/production/resources/sync:
    post:
      summary: Sync production resources from SAP
      description: Sinkronisasi data master resource produksi dari SAP.
      tags:
        - Production
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Data resource produksi berhasil disinkronisasi dari SAP
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Data resource produksi berhasil disinkronisasi dari SAP.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductionResource'
        '401':
          description: Tidak terautentikasi
        '500':
          description: Gagal sinkronisasi data dari SAP

  /v1/production/items:
    get:
      summary: Get list of production items
      description: Mendapatkan daftar semua item produksi yang disinkronisasi dari SAP.
      tags:
        - Production
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Pencarian berdasarkan kode atau nama item.
      responses:
        '200':
          description: Daftar item produksi berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar item produksi berhasil diambil.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductionItem'
        '401':
          description: Tidak terautentikasi

  /v1/production/items/sync:
    post:
      summary: Sync production items from SAP
      description: Sinkronisasi data master item produksi dari SAP.
      tags:
        - Production
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Data item produksi berhasil disinkronisasi dari SAP
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Data item produksi berhasil disinkronisasi dari SAP.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductionItem'
        '401':
          description: Tidak terautentikasi
        '500':
          description: Gagal sinkronisasi data dari SAP

  /v1/production/boms:
    get:
      summary: Get all production BOMs
      description: Mendapatkan daftar Bill of Material (BOM) produksi.
      tags:
        - Production BOM
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Cari berdasarkan kode produk atau komentar
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Filter berdasarkan kode produk spesifik
      responses:
        '200':
          description: Daftar Bill of Material berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar Bill of Material berhasil diambil.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductionBom'

    post:
      summary: Create a new production BOM
      description: Membuat rancangan Bill of Material (BOM) baru beserta detail komponennya.
      tags:
        - Production BOM
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - qty
                - to_whs
                - details
              properties:
                code:
                  type: string
                  example: "ILP000117"
                  description: Parent Product Code
                qty:
                  type: number
                  example: 1.0
                  description: Base Quantity
                to_whs:
                  type: string
                  example: "WHS01"
                  description: Receipt Warehouse Code
                alternate:
                  type: integer
                  example: 1
                  description: BOM Alternate Version
                comments:
                  type: string
                  example: "BOM Garam JUMBO"
                details:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - code
                      - quantity
                    properties:
                      type:
                        type: string
                        enum: [Item, Resource, "4", "290"]
                        example: "Item"
                      code:
                        type: string
                        example: "RAW001"
                      quantity:
                        type: number
                        example: 0.5
                      warehouse:
                        type: string
                        example: "WHS01"
                      issue_mthd:
                        type: string
                        enum: [B, M]
                        example: "B"
                      comments:
                        type: string
                        example: "Bahan penolong"
      responses:
        '201':
          description: Bill of Material berhasil dibuat.

  /v1/production/boms/{id}:
    get:
      summary: Get details of a production BOM
      description: Mendapatkan detail lengkap Bill of Material beserta list komponennya.
      tags:
        - Production BOM
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detail Bill of Material berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Detail Bill of Material berhasil diambil.
                  data:
                    $ref: '#/components/schemas/ProductionBom'

    put:
      summary: Update a production BOM
      description: Memperbarui kuantitas target, gudang, atau memperbarui daftar komponen BOM.
      tags:
        - Production BOM
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                qty:
                  type: number
                  example: 2.0
                to_whs:
                  type: string
                  example: "WHS02"
                comments:
                  type: string
                  example: "Komentar revisi"
                details:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - code
                      - quantity
                    properties:
                      type:
                        type: string
                        enum: [Item, Resource, "4", "290"]
                        example: "Resource"
                      code:
                        type: string
                        example: "RES-001"
                      quantity:
                        type: number
                        example: 1.2
                      issue_mthd:
                        type: string
                        enum: [B, M]
                        example: "M"
      responses:
        '200':
          description: Bill of Material berhasil diperbarui.

    delete:
      summary: Delete a production BOM
      description: Menghapus data Bill of Material beserta detail komponennya.
      tags:
        - Production BOM
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Bill of Material berhasil dihapus.

  /v1/production/orders:
    get:
      summary: Get all production orders
      description: Mendapatkan daftar Production Order.
      tags:
        - Production Order
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Cari berdasarkan no production order, kode produk, atau komentar
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter berdasarkan status (PLANNED, RELEASED, CLOSED, CANCELLED)
        - name: item_code
          in: query
          required: false
          schema:
            type: string
          description: Filter berdasarkan kode produk utama
      responses:
        '200':
          description: Daftar Production Order berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar Production Order berhasil diambil.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductionOrder'

    post:
      summary: Create a new production order
      description: Membuat Production Order baru beserta komponennya.
      tags:
        - Production Order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_code
                - planned_qty
                - warehouse
                - post_date
                - details
              properties:
                prod_order_no:
                  type: string
                  example: "260210422"
                item_code:
                  type: string
                  example: "B26"
                planned_qty:
                  type: number
                  example: 3.0
                warehouse:
                  type: string
                  example: "PRD01-05"
                post_date:
                  type: string
                  format: date
                  example: "2026-02-19"
                due_date:
                  type: string
                  format: date
                  example: "2026-02-19"
                start_date:
                  type: string
                  format: date
                  example: "2026-02-19"
                status:
                  type: string
                  example: "PLANNED"
                type:
                  type: string
                  example: "Special"
                series:
                  type: integer
                  example: 5638
                series_name:
                  type: string
                  description: "Nama Series penomoran dokumen (e.g. SBY26-08)"
                  example: "SBY26-08"
                uom:
                  type: string
                  description: "Satuan Unit of Measure (UoM) produk header"
                  example: "BAL"
