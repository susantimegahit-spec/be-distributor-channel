  /v1/logistic/picklists:
    get:
      summary: List Dokumen Picklist
      description: Mengambil daftar dokumen picklist logistik dengan filter tipe pengiriman, status, dan rentang tanggal.
      tags:
        - Logistic - Picklist
      security:
        - BearerAuth: []
      parameters:
        - name: shipping_type
          in: query
          description: Filter jenis pengiriman (internal, external, pickup)
          schema:
            type: string
            enum: [internal, external, pickup]
        - name: status
          in: query
          description: Filter status picklist (open, weigh_in, inprogress, weigh_out, complete, canceled)
          schema:
            type: string
            enum: [open, weigh_in, inprogress, weigh_out, complete, canceled, OPEN, COMPLETED, CANCELLED]
        - name: search
          in: query
          description: Pencarian nomor picklist, plat nomor, supir, checker, atau nomor SO
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: is_checked
          in: query
