  /v1/logistic/picklists/{id}/add-do:
    post:
      summary: Submit Checklist Checker / Add Delivery Order (DO) ke SAP B1
      description: |
        Endpoint ini digunakan oleh checker gudang untuk mengirimkan hasil pemeriksaan fisik barang, KPI durasi pemeriksaan, tanggal produksi, dan upload foto label kemasan per item.

        **Alur Baru Logistik (Weighing & Multi-Checker Workflow):**
        1. Checker memeriksa fisik barang dan mengirimkan array `Lines` berisi `id` (item ID), `start_time` & `end_time` (KPI), dan array `labels` (berisi `production_date` & `label_photos` kemasan per batch/tanggal produksi).
        2. Pada alur baru ini, pemanggilan endpoint oleh checker **TIDAK langsung membentuk Delivery Order (DO) ke SAP B1**.
        3. **Multi-Checker**: Jika baru sebagian item yang diperiksa (misal checker 1 dari gudang A selesai), status picklist tetap `inprogress`.
        4. Ketika seluruh item pada picklist telah selesai diverifikasi oleh semua checker, status picklist otomatis berubah menjadi `weigh_out`.
        5. Pembuatan Delivery Order (DO) ke SAP B1 (`/api/AddDO`) akan dieksekusi secara otomatis pada tahap Timbang Keluar (`POST /v1/logistic/picklists/{id}/weigh-out`) setelah truk dimuati dan ditimbang serta kapasitas muatan valid (tidak overload).
        *(Catatan sistem: Flag internal `force_sap_do: true` dapat digunakan jika ingin mengeksekusi langsung SAP AddDO).*

        **Signature Checker & Supir terintegrasi di endpoint ini.**
        Tanda tangan Checker dan Supir dapat dikirim bersamaan di request body yang sama — tidak perlu memanggil `POST /signatures` secara terpisah.
        - **JSON (application/json)**: Field `signatures` berisi array objek dengan `signature` berformat Base64 Data URL (`data:image/png;base64,...`).
        - **Multipart/form-data**: File gambar signature dikirim sebagai file upload.
      tags:
        - Logistic - Picklist
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID Picklist
          schema:
            type: integer
      requestBody:
        required: false
        description: |
          Payload opsional. Jika request body dikosongkan (`{}`), sistem akan mengumpulkan data secara otomatis dari dokumen Picklist dan Sales Order terkait.
          Field-field override opsional dapat dikirimkan seperti Series, Noseal, NoPol, Sopir, atau Lines kustom.
          Signature Checker/Supir dapat langsung disertakan di sini (tidak perlu endpoint /signatures terpisah).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDoPayload'
            example:
              Series: 75
              NumAtCard: "PO-CUST-001"
              DocDate: "2026-09-24T00:00:00"
              DocDueDate: "2026-09-24T00:00:00"
              TaxDate: "2026-09-24T00:00:00"
              Comments: "Pengiriman parsial SO tahap 1"
              NoPol: "B 1234 ABC"
              KodeEkspedisi: "JNE"
              NamaEkspedisi: "JNE Trucking"
              Sopir: "Budi Santoso"
              NamaChecker: "ROCHIM/NANANG"
              Noseal: "12345"
              signatures:
                - signer_type: "checker"
                  signer_role_title: "Checker 1 (Gudang)"
                  signer_name: "ROCHIM"
                  signature: "data:image/png;base64,iVBORw0KGgoAAA..."
                  notes: "Barang siap muat"
                - signer_type: "checker"
                  signer_role_title: "Checker 2 (Gudang)"
                  signer_name: "NANANG"
                  signature: "data:image/png;base64,iVBORw0KGgoAAA..."
                - signer_type: "driver"
                  signer_role_title: "Supir"
                  signer_name: "Budi Santoso"
                  signature: "data:image/png;base64,iVBORw0KGgoAAA..."
              workers:
                - item_code: "SKU-LOAD-01"
                  worker_name: "Pak Budi"
                  qty: 500
                - item_code: "SKU-LOAD-02"
                  worker_name: "Pak Slamet"
                  qty: 250
              Lines:
                - id: 10
                  BaseEntry: 1052
                  BaseLine: 0
                  Quantity: 5.0
                  WhsCode: "01"
                  OcrCode: "SBY"
                  OcrCode2: "GRM"
                  OcrCode3: "MKT"
                  is_checked: true
                  checked_qty: 5.0
                  checked_by_checker: "ROCHIM"
                  start_time: "2026-10-14T09:00:00"
                  end_time: "2026-10-14T09:25:00"
                  labels:
                    - production_date: "2026-10-10"
                      label_photos:
                        - "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ..."
                        - "data:image/png;base64,iVBORw0KGgoAAA..."
                    - production_date: "2026-10-11"
                      label_photos:
                        - "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ..."
                - id: 11
                  BaseEntry: 1052
                  BaseLine: 1
                  Quantity: 3.0
                  WhsCode: "01"
                  OcrCode: "SBY"
                  OcrCode2: "GRM"
                  OcrCode3: "MKT"
                  is_checked: false
          multipart/form-data:
            schema:
              type: object
              description: |
                Format alternatif untuk upload file gambar tanda tangan.
                Field non-file (Series, NoPol, dll.) dikirim sebagai string form field.
                Signature dikirim sebagai file upload dengan key seperti `checker_signature`, `driver_signature`, atau `signatures[0][signature]`.
              properties:
                is_draft:
                  type: boolean
                  description: Flag draft. Jika true, DO tidak dikirim ke SAP.
                Series:
                  type: string
                NoPol:
                  type: string
                Sopir:
                  type: string
                NamaChecker:
                  type: string
                Noseal:
                  type: string
                checker_signature:
                  type: string
                  format: binary
                  description: File gambar tanda tangan checker (alternatif dari field signatures[].signature)
                driver_signature:
                  type: string
                  format: binary
                  description: File gambar tanda tangan driver/supir (alternatif dari field signatures[].signature)
      responses:
        '200':
          description: Delivery Order successfully created in SAP and saved to database.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Delivery Order successfully created in SAP (DocNum: 20260088)."
                  data:
                    type: object
                    properties:
                      picklist_id:
                        type: integer
                        example: 1
                      picklist_no:
                        type: string
                        example: "PKL-20260923-0001"
                      delivery_order_no:
                        type: string
                        example: "20260088"
                      doc_entry:
                        type: string
                        example: "1052"
                      doc_num:
                        type: string
                        example: "20260088"
                      is_checked:
                        type: boolean
                        description: Status verifikasi barang pada picklist
                        example: true
                      signatures:
                        type: array
                        description: Daftar tanda tangan yang tersimpan setelah DO berhasil dibuat.
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            signer_type:
                              type: string
                              enum: [checker, driver, supervisor]
                              example: "checker"
                            signer_role_title:
                              type: string
                              example: "Checker 1 (Gudang)"
                            signer_name:
                              type: string
                              example: "ROCHIM"
                            notes:
                              type: string
                              nullable: true
                              example: "Barang siap muat"
                            preview_url:
                              type: string
                              description: URL untuk preview gambar tanda tangan. Dapat digunakan langsung di tag `<img>` tanpa Bearer token.
                              example: "/api/distributor-channel/v1/logistic/picklists/1/signatures/1/preview"
                            signed_at:
                              type: string
                              format: date-time
                              example: "2026-10-08T10:30:00.000000Z"
                      workers:
                        type: array
                        description: Daftar worker pengangkut barang beserta rincian hitungan upah lembur
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            item_code:
                              type: string
                              example: "SKU-LOAD-01"
                            item_name:
                              type: string
                              nullable: true
                              example: "Garam Kasar 50kg"
                            worker_name:
                              type: string
                              nullable: true
                              example: "Pak Budi"
                            qty:
                              type: number
                              example: 500
                            uom:
                              type: string
                              nullable: true
                              example: "KG"
                            rate_type:
                              type: string
                              example: "OVERTIME"
                            rate:
                              type: number
                              example: 1500
                            lembur_fee:
                              type: number
                              description: Total hitungan lembur worker untuk item ini (qty * rate)
                              example: 750000
                      total_lembur:
                        type: number
                        description: Total akumulasi hitungan upah lembur seluruh worker
                        example: 750000
        '400':
          description: Business error atau SAP AddDO failure. Signature tidak tersimpan jika DO gagal.
        '422':
          description: Validasi payload gagal.
        '404':
          description: Picklist tidak ditemukan.

  /v1/logistic/picklists/{id}/signatures:
