  /v1/ekspedisi/loading-rates/upload:
    post:
      summary: Upload File Excel / CSV Master Tarif Ongkos Angkut Kuli
      description: |
        Mengunggah berkas Excel (.xlsx, .xls) atau CSV untuk melakukan import atau update masal master data tarif ongkos angkut kuli.
        Kolom yang didukung pada file:
        - `Kode Item` / `item_code` (Wajib)
        - `Nama Item` / `item_name`
        - `Type Rate` / `rate_type` (REGULAR / OVERTIME)
        - `Biaya` / `rate` (Wajib)
        - `UOM` / `uom`
        - `Keterangan` / `remarks`
      tags:
        - Logistic - Loading Rates
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File Excel (.xlsx, .xls, .csv, max 10MB)
      responses:
        '200':
          description: File berhasil diupload dan diproses.
        '422':
          description: Format file atau validasi baris gagal.

  /v1/ekspedisi/loading-rates/template:
    get:
      summary: Download Format Template Excel Master Tarif Ongkos Angkut Kuli
      description: Mengunduh template berkas spreadsheet (.xlsx) untuk upload master tarif ongkos angkut.
      tags:
        - Logistic - Loading Rates
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Berkas Excel template (.xlsx).
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary



components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
