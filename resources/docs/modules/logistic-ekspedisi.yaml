          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Picklists retrieved successfully.
    post:
      summary: Buat Dokumen Picklist Baru
      description: |
        Membuat dokumen picklist baru untuk armada logistik.
        - Internal: wajib mengisi license_plate, mendukung multiple Sales Orders.
        - External & Pickup: tidak menggunakan armada sendiri, strictly dibatasi hanya 1 Sales Order.
        - Series: nomor penomoran SAP Document Series untuk Delivery Order (DO) yang akan digenerate dari picklist ini (berbeda dengan series Sales Order).
      tags:
        - Logistic - Picklist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shipping_type
                - posting_date
                - due_date
                - items
              properties:
                shipping_type:
                  type: string
                  enum: [internal, external, pickup]
                posting_date:
                  type: string
                  format: date
                due_date:
                  type: string
                  format: date
                delivery_order_no:
                  type: string
                total_weight_limit:
                  type: number
                comments:
                  type: string
                license_plate:
                  type: string
                driver_name:
                  type: string
                checker_name:
                  type: string
                expedition_id:
                  type: string
                  description: Kode ekspedisi dari master SAP ("01" untuk Internal, "02" untuk Ambil Sendiri, atau kode ekspedisi luar)
                  example: "01"
                expedition_name:
                  type: string
                  description: Nama ekspedisi ("Internal", "Ambil Sendiri", dsb)
                  example: "Internal"
                expedition_rate_id:
                  type: integer
                service_type:
                  type: string
                estimated_cost:
                  type: number
                to_whs_code:
                  type: string
                  default: 'VPGMN01'
                  description: Gudang tujuan transfer (hardcoded ke VPGMN01 di backend)
                series:
                  type: integer
                  description: SAP Document Series untuk Delivery Order (DO) yang akan terbentuk dari picklist ini (berbeda dengan series SO)
                  example: 75
                series_name:
                  type: string
                  description: Nama SAP Document Series untuk Delivery Order (DO)
                  example: "DO-SBY"
                seal_number:
                  type: string
                  description: Nomor segel (Noseal) armada / truk
                  example: "SEAL-001"
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - sales_order_id
                      - item_code
                      - pick_qty
                    properties:
                      sales_order_id:
                        type: integer
                      sales_order_detail_id:
                        type: integer
                      item_code:
                        type: string
                      item_name:
                        type: string
                      whs_code:
                        type: string
                      unit_msr:
                        type: string
                      ordered_qty:
                        type: number
                      pick_qty:
                        type: number
                      unit_weight:
                        type: number
                      direct_bin_quantity:
                        type: number
                        description: Input qty jika gudang tidak memiliki bin
                      bin_allocations:
                        type: array
                        description: Daftar alokasi BIN jika gudang asal menggunakan bin management
                        items:
                          type: object
                          properties:
                            value:
                              type: integer
                              description: AbsEntry BIN SAP
                            AbsEntry:
                              type: integer
                            code:
                              type: string
                              description: Bin Code
                            name:
                              type: string
                              description: Bin Description
                            quantity:
                              type: number
                            Quantity:
                              type: number
      responses:
        '201':
          description: Picklist created successfully (Inventory Transfer to SAP VPGMN01 succeeded, it_doc_num & it_doc_entry saved).
        '400':
          description: Business validation error or SAP Inventory Transfer failure.
        '422':
          description: Input validation error.

