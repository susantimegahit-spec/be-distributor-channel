                                quantity:
                                  type: number
                                  format: float
                                  example: 10.0
                                uom:
                                  type: string
                                  example: SAK
                                whs_code:
                                  type: string
                                  example: WHS-01
                                line_total:
                                  type: number
                                  format: float
                                  example: 1000000.0
                      overload_record:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                            example: 5
                          status:
                            type: string
                            example: RESOLVED
                          action_taken:
                            type: string
                            example: Muatan dikurangi 60 SAK di gudang. Sales Order disesuaikan via SAP editso.
                          resolved_at:
                            type: string
                            example: "2026-10-24 09:40:00"
                      sap_result:
