  /v1/logistic/orders/{id}/reschedule:
    post:
      summary: Propose Delivery Reschedule by Logistics
      description: |
        Digunakan oleh tim logistik untuk mengajukan penyesuaian tanggal kirim (`proposed_delivery_date`) dan/atau estimasi tiba (`proposed_eta_date`) apabila armada belum siap atau kapasitas penuh.
        Hanya dapat diajukan jika status SO sudah `ORDER_APPROVED`.
        Akan mengubah `logistic_status` menjadi `RESCHEDULE_REQUESTED` dan mencatat riwayat aktivitas ke monitoring log.
      tags:
        - Logistic - Order Monitoring
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID Sales Order
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proposed_delivery_date
                - notes
              properties:
                proposed_delivery_date:
                  type: string
                  format: date
                  description: Usulan tanggal pengiriman baru dari logistik (YYYY-MM-DD)
                  example: "2026-09-20"
                proposed_eta_date:
                  type: string
                  format: date
                  description: Usulan estimasi barang tiba di distributor (YYYY-MM-DD, opsional)
                  example: "2026-09-23"
                notes:
                  type: string
                  description: Alasan penjadwalan ulang dari logistik
                  example: "Armada wingbox ke area Jawa Tengah sedang jadwal servis rutin, pengiriman diundur 2 hari."
      responses:
        '200':
          description: Delivery reschedule requested successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Delivery reschedule requested successfully.
                  data:
                    $ref: '#/components/schemas/LogisticOrderListItem'
        '404':
          description: Sales Order not found.
        '422':
          description: Unprocessable entity / validation error.

  /v1/logistic/orders/{id}/approve:
    post:
      summary: Approve Delivery Schedule (Logistic Confirmation or Sales Reschedule Approval)
      description: |
        Menangani persetujuan jadwal pengiriman Sales Order:
        1. **Persetujuan Kesiapan Logistik:** Jika `logistic_status = PENDING` dan SO `ORDER_APPROVED`, tim logistik mengonfirmasi kesiapan armada/jadwal -> status berubah ke `APPROVED`.
        2. **Persetujuan Reschedule Admin Sales:** Jika `logistic_status = RESCHEDULE_REQUESTED`, Admin Sales menyetujui tanggal baru usulan logistik -> status berubah ke `RESCHEDULE_APPROVED`, dan sistem otomatis memperbarui `req_due_date`, `doc_due_date`, serta `eta_date` pada Sales Order.
      tags:
        - Logistic - Order Monitoring
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID Sales Order
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                due_date:
                  type: string
                  format: date
                  description: Tanggal pengiriman baru (opsional)
                  example: "2026-09-22"
                eta_date:
                  type: string
                  format: date
                  description: Estimasi tanggal tiba baru (opsional)
                  example: "2026-09-25"
                notes:
                  type: string
                  description: Catatan persetujuan
                  example: "Armada siap, jadwal pengiriman disetujui."
      responses:
        '200':
          description: Order delivery schedule approved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logistics delivery schedule confirmed and approved successfully.
                  data:
                    $ref: '#/components/schemas/LogisticOrderListItem'
        '404':
          description: Sales Order not found.
        '422':
          description: Unprocessable entity / validation error.

  /v1/logistic/orders/{id}/inventory-transfer:
    post:
      summary: Process Inventory Transfer (IT) to SAP for Approved Order
      description: |
        Melakukan eksekusi pemindahan stok barang (Inventory Transfer / addIT) ke SAP B1 untuk Sales Order yang sudah disetujui jadwalnya (`logistic_status = APPROVED` atau `RESCHEDULE_APPROVED`):
        - Mengirimkan data dokumen ke SAP B1 endpoint `/api/addIT` (AddonId: 2).
        - Memperbarui nomor dokumen SAP IT (`sap_it_doc_num`, `sap_it_doc_entry`), status IT (`sap_it_status = SUCCESS`), gudang tujuan (`to_whs_code`), serta data armada (`nopol`, `nama_supir`).
        - Mencatat riwayat aktivitas pemantauan logistik dengan action `LOGISTIC_INVENTORY_TRANSFER`.
        - Bersifat atomik: jika SAP addIT gagal atau mengembalikan ErrorCode, API mengembalikan HTTP 400 beserta pesan error dari SAP dan perubahan data IT tidak disimpan.
      tags:
        - Logistic - Order Monitoring
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID Sales Order
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to_whs_code:
                  type: string
                  description: Kode gudang tujuan transfer SAP (default "VPGMN01")
                  example: "VPGMN01"
                nopol:
                  type: string
                  description: Nomor Polisi armada kendaraan (opsional)
                  example: "L 9999 XX"
                nama_supir:
                  type: string
                  description: Nama driver / pengemudi (opsional)
                  example: "Pak Driver"
                berat_bruto:
                  type: number
                  format: float
                  description: Berat kotor muatan kendaraan dalam kg (opsional)
                  example: 15000.00
                berat_tara:
                  type: number
                  format: float
                  description: Berat kosong kendaraan dalam kg (opsional)
                  example: 5000.00
                notes:
                  type: string
                  description: Catatan pengiriman / transfer IT (opsional)
                  example: "Armada siap jalan, transfer stok logistik diproses ke SAP."
      responses:
        '200':
          description: Inventory Transfer (IT) processed successfully to SAP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Inventory Transfer (IT) processed successfully to SAP.
                  data:
                    $ref: '#/components/schemas/LogisticOrderListItem'
        '400':
          description: Failed to process Inventory Transfer to SAP or already processed or schedule not yet approved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "SAP Inventory Transfer Error [-1]: Insufficient stock in warehouse FG01"
        '404':
          description: Sales Order not found.
        '422':
          description: Unprocessable entity / validation error.

