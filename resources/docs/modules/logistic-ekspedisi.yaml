  /v1/logistic/picklists/{id}/status:
    patch:
      summary: Update Status Dokumen Picklist
      description: Mengubah status picklist (open, weigh_in, inprogress, weigh_out, complete, canceled).
      tags:
        - Logistic - Picklist
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [open, weigh_in, inprogress, weigh_out, complete, canceled, OPEN, COMPLETED, CANCELLED]
      responses:
        '200':
          description: Picklist status updated successfully.
        '400':
          description: Invalid transition or picklist is not OPEN.
        '404':
          description: Picklist not found.

  /v1/logistic/picklists/{id}/weigh-in:
    post:
      summary: Submit Timbang Masuk / Kosong (Tare Weighing)
      description: |
        Mencatat hasil penimbangan truk dalam kondisi kosong (Tare Weight) sebelum masuk gudang untuk diperiksa dan dimuat barang oleh checker.
        Status picklist otomatis berubah dari `open` menjadi `weigh_in`.
        Setelah proses ini, dokumen timbang dicap di pos timbangan dan diserahkan ke sopir untuk diberikan kepada checker gudang.
      tags:
        - Logistic - Picklist
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID Picklist
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - weight
              properties:
                weight:
                  type: number
                  description: Berat kosong kendaraan (Tare Weight) dalam KG
                  example: 8500.00
                ticket_no:
                  type: string
                  description: Nomor tiket jembatan timbangan fisik
                  example: "TMB-IN-20261014-0012"
                operator_name:
                  type: string
                  description: Nama petugas operator jembatan timbang
                  example: "Bambang Supriyadi"
                weighed_at:
                  type: string
                  format: date-time
                  description: Waktu penimbangan (jika kosong, default waktu saat ini)
                  example: "2026-10-14T08:45:00"
                notes:
                  type: string
                  description: Catatan kondisi kendaraan saat timbang masuk
                  example: "Truk colt diesel kondisi kosong, tangki solar 50%"
                license_plate:
                  type: string
                  description: Konfirmasi nomor polisi kendaraan
                  example: "L 9123 AB"
                driver_name:
                  type: string
                  description: Konfirmasi nama supir
                  example: "SLAMET"
      responses:
        '200':
          description: Timbang masuk berhasil dicatat. Status picklist berubah menjadi weigh_in.
        '400':
          description: Picklist sudah dibatalkan atau status tidak valid.
        '422':
          description: Nilai berat tidak valid (harus > 0).
        '404':
          description: Picklist tidak ditemukan.

  /v1/logistic/picklists/{id}/weigh-out:
    post:
      summary: Submit Timbang Keluar / Isi (Gross Weighing) & Pembuatan DO SAP B1
      description: |
        Mencatat hasil penimbangan truk yang sudah dimuati barang (Gross Weight) setelah seluruh checker menyelesaikan proses checklist.
        Sistem menghitung Berat Bersih: `Net Weight = Gross Weight - Tare Weight`.
        - **Validasi Overload**: Jika muatan melebihi batas kapasitas armada (`total_weight_limit`), respon memberikan peringatan overload, Delivery Order (DO) **TIDAK dibuat**, status picklist berubah menjadi `overload`, dan rincian kelebihan beban dicatat ke tabel temporary `picklist_overloads`.
        - **Muatan Sesuai**: Jika muatan sesuai toleransi armada, sistem otomatis mengeksekusi pembuatan Delivery Order (DO) ke SAP B1 (`/api/AddDO`). Status picklist berubah menjadi `complete`.
      tags:
        - Logistic - Picklist
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID Picklist
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - weight
              properties:
                weight:
                  type: number
                  description: Berat kotor kendaraan + muatan (Gross Weight) dalam KG
                  example: 18500.00
                ticket_no:
                  type: string
                  description: Nomor tiket timbangan keluar
                  example: "TMB-OUT-20261014-0045"
                operator_name:
                  type: string
                  description: Nama petugas operator timbang keluar
                  example: "Bambang Supriyadi"
                weighed_at:
                  type: string
                  format: date-time
                  description: Waktu penimbangan keluar
                  example: "2026-10-14T10:30:00"
                notes:
                  type: string
                  description: Catatan kondisi muatan dan nomor segel
                  example: "Muatan penuh, segel terpasang"
      responses:
        '200':
          description: Timbang keluar berhasil dan muatan sesuai. Delivery Order berhasil dibuat di SAP B1 (status complete).
        '422':
          description: Peringatan kelebihan muatan (Overload). Status berubah menjadi overload dan dicatat ke tabel temporary picklist_overloads.
        '400':
          description: Truk belum timbang masuk atau pemeriksaan checker belum selesai.
        '404':
          description: Picklist tidak ditemukan.

  /v1/logistic/picklists/{id}/weigh-out/reject:
    post:
      summary: Reject / Cancel Timbang Keluar karena Overload
      description: |
        Menolak / membatalkan timbang keluar karena muatan melebihi batas kapasitas armada (Overload).
        Status picklist diubah menjadi `overload` dan data kelebihan beban beserta snapshot barang disimpan ke tabel temporary `picklist_overloads` untuk proses penyesuaian muatan di gudang.
      tags:
        - Logistic - Picklist
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID Picklist
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                weight:
                  type: number
                  description: Berat kotor timbangan keluar (KG)
                  example: 21000.00
                ticket_no:
                  type: string
                  description: Nomor tiket timbang keluar
                  example: "TMB-OUT-REJECT-001"
                operator_name:
                  type: string
                  description: Nama operator timbangan
                  example: "Petugas Timbangan"
                rejection_reason:
                  type: string
                  description: Alasan penolakan overload
                  example: "Muatan melebihi kapasitas armada truk sebesar 3,000 KG."
                notes:
                  type: string
                  description: Catatan tambahan
                weighed_at:
                  type: string
                  format: date-time
                  description: Waktu penimbangan
      responses:
        '200':
          description: Timbang keluar berhasil ditolak karena overload. Status picklist berubah menjadi overload.
        '400':
          description: Data timbang masuk belum tercatat atau status picklist tidak valid.
        '404':
          description: Picklist tidak ditemukan.

