openapi: 3.0.3
info:
  title: "SMESTA API - Modul Logistic & Ekspedisi (Picklist, DO, Weighing, Kendaraan, Rates)"
  description: |
    Dokumentasi API Modular SMESTA (Bagian dari `resources/docs/openapi.yaml`).
    Edit file ini secara langsung agar ringan di IDE, lalu jalankan `php artisan docs:openapi bundle` untuk menyatukan kembali ke `openapi.yaml`.
  version: 1.0.0
servers:
  - url: https://api-sm-connect.susantimegah.com/api/distributor-channel
    description: Production Server
  - url: http://api-dev.susantimegah.com/api/distributor-channel
    description: Development Server
  - url: http://localhost:8000/api/distributor-channel
    description: Local Server
paths:
  /v1/ekspedisi/wilayah/provinces:
    get:
      summary: Get list of all provinces
      description: Mendapatkan daftar semua provinsi di Indonesia.
      tags:
        - Ekspedisi Wilayah
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar provinsi berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar provinsi berhasil diambil.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Province'
        '401':
          description: Tidak terautentikasi

  /v1/ekspedisi/wilayah/regencies:
    get:
      summary: Get list of regencies
      description: Mendapatkan daftar kabupaten/kota di Indonesia, dapat difilter berdasarkan ID provinsi.
      tags:
        - Ekspedisi Wilayah
      security:
        - BearerAuth: []
      parameters:
        - name: province_id
          in: query
          required: false
          schema:
            type: integer
          description: ID Provinsi
      responses:
        '200':
          description: Daftar kabupaten/kota berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar kabupaten/kota berhasil diambil.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Regency'
        '401':
          description: Tidak terautentikasi

  /v1/ekspedisi/wilayah/districts:
    get:
      summary: Get list of districts
      description: Mendapatkan daftar kecamatan di Indonesia, dapat difilter berdasarkan ID kabupaten/kota.
      tags:
        - Ekspedisi Wilayah
      security:
        - BearerAuth: []
      parameters:
        - name: regency_id
          in: query
          required: false
          schema:
            type: integer
          description: ID Kabupaten/Kota
      responses:
        '200':
          description: Daftar kecamatan berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar kecamatan berhasil diambil.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/District'
        '401':
          description: Tidak terautentikasi

  /v1/ekspedisi/wilayah/villages:
    get:
      summary: Get list of villages
      description: Mendapatkan daftar desa/kelurahan di Indonesia, dapat difilter berdasarkan ID kecamatan.
      tags:
        - Ekspedisi Wilayah
      security:
        - BearerAuth: []
      parameters:
        - name: district_id
          in: query
          required: false
          schema:
            type: integer
          description: ID Kecamatan
      responses:
        '200':
          description: Daftar desa/kelurahan berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar desa/kelurahan berhasil diambil.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Village'
        '401':
          description: Tidak terautentikasi

  /v1/ekspedisi/nama-ekspedisi:
    get:
      summary: Get List of Expedition Names from SAP
      description: Mengambil daftar nama ekspedisi langsung dari API SAP B1 (/api/getNamaEkspedisi). Jika kosong/dummy, mengembalikan "Data not found."
      tags:
        - Ekspedisi - SAP Master Data
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Filter pencarian kode atau nama ekspedisi
      responses:
        '200':
          description: Daftar nama ekspedisi berhasil diambil dari SAP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Expedition list retrieved successfully from SAP.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Code:
                          type: string
                          example: "01"
                        U_NamaEkspedisi:
                          type: string
                          example: Internal
                        U_VendorEkspedisi:
                          type: string
                          example: Internal
        '401':
          description: Unauthenticated
    post:
      summary: Get List of Expedition Names from SAP (POST)
      description: Mengambil daftar nama ekspedisi langsung dari API SAP B1 (/api/getNamaEkspedisi) via method POST.
      tags:
        - Ekspedisi - SAP Master Data
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Expedition list retrieved successfully from SAP.

  /v1/ekspedisi/nama-checker:
    get:
      summary: Get List of Warehouse Checkers from SAP
      description: Mengambil daftar nama checker gudang langsung dari API SAP B1 (/api/getNamaChecker). Jika kosong/dummy, mengembalikan "Data not found."
      tags:
        - Ekspedisi - SAP Master Data
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Filter pencarian kode atau nama checker
      responses:
        '200':
          description: Daftar nama checker berhasil diambil dari SAP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Checker list retrieved successfully from SAP.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        TableID:
                          type: string
                          example: "ODLN"
                        AliasID:
                          type: string
                          example: "NamaChecker"
                        FieldDescription:
                          type: string
                          example: "Nama Checker"
                        IndexID:
                          type: string
                          example: "0"
                        ValueCode:
                          type: string
                          example: "BELUM ADA"
                        Description:
                          type: string
                          example: "BELUM ADA"
                        Code:
                          type: string
                          example: "BELUM ADA"
                        Name:
                          type: string
                          example: "BELUM ADA"
        '401':
          description: Unauthenticated
    post:
      summary: Get List of Warehouse Checkers from SAP (POST)
      description: Mengambil daftar nama checker gudang langsung dari API SAP B1 (/api/getNamaChecker) via method POST.
      tags:
        - Ekspedisi - SAP Master Data
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: string
                  description: Filter pencarian kode atau nama checker
      responses:
        '200':
          description: Checker list retrieved successfully from SAP.

  /v1/ekspedisi/kendaraan:
    get:
      summary: Get List of Vehicles from SAP
      description: Mengambil daftar master kendaraan/armada beserta kapasitas tonase dan kubikasi dari API SAP B1 (/api/getKendaraan). Jika kosong/dummy, mengembalikan "Data not found."
      tags:
        - Ekspedisi - SAP Master Data
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Filter pencarian nopol atau merk kendaraan
      responses:
        '200':
          description: Daftar kendaraan berhasil diambil dari SAP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Vehicle list retrieved successfully from SAP.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Nopol:
                          type: string
                          example: L9870CE
                        U_Merk:
                          type: string
                          example: HINO DUTRO
                        U_KapasitasKg:
                          type: string
                          example: "6000.000000"
                        U_KapasitasM3:
                          type: string
                          example: "13.600000"
        '401':
          description: Unauthenticated
    post:
      summary: Get List of Vehicles from SAP (POST)
      description: Mengambil daftar master kendaraan dari API SAP B1 (/api/getKendaraan) via method POST.
      tags:
        - Ekspedisi - SAP Master Data
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Vehicle list retrieved successfully from SAP.

  /v1/ekspedisi/sopir:
    get:
      summary: Get List of Drivers from SAP
      description: Mengambil daftar supir/driver beserta cabang operasional dari API SAP B1 (/api/getSopir). Jika kosong/dummy, mengembalikan "Data not found."
      tags:
        - Ekspedisi - SAP Master Data
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Filter pencarian nama sopir
        - name: cabang
          in: query
          required: false
          schema:
            type: string
          description: Filter kode cabang (misal SBY)
      responses:
        '200':
          description: Daftar sopir berhasil diambil dari SAP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Driver list retrieved successfully from SAP.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Name:
                          type: string
                          example: TEGUH
                        U_Cabang:
                          type: string
                          example: SBY
        '401':
          description: Unauthenticated
    post:
      summary: Get List of Drivers from SAP (POST)
      description: Mengambil daftar supir dari API SAP B1 (/api/getSopir) via method POST.
      tags:
        - Ekspedisi - SAP Master Data
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Driver list retrieved successfully from SAP.

  /v1/ekspedisi/expeditions/upload:
    post:
      summary: Upload master expeditions file (Excel/CSV)
      description: Mengunggah file spreadsheet (.xlsx, .xls, .csv) untuk mengimpor atau memperbarui data master ekspedisi secara massal (bulk).
      tags:
        - Master Ekspedisi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File Excel (.xlsx, .xls) atau CSV
      responses:
        '200':
          description: File master ekspedisi berhasil diupload dan diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: File master ekspedisi berhasil diupload dan diproses.
                  data:
                    type: object
                    properties:
                      processed_count:
                        type: integer
                        example: 10
                      created_count:
                        type: integer
                        example: 8
                      updated_count:
                        type: integer
                        example: 2
                      errors:
                        type: array
                        items:
                          type: string
        '422':
          description: Format file atau validasi tidak sesuai
        '401':
          description: Tidak terautentikasi

  /v1/ekspedisi/rates/upload:
    post:
      summary: Upload master expedition rates file (Excel/CSV)
      description: Mengunggah file spreadsheet (.xlsx, .xls, .csv) untuk mengimpor data tarif ekspedisi secara massal (bulk) dan membuat Batch ID secara otomatis.
      tags:
        - Master Tarif Ekspedisi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File Excel (.xlsx, .xls) atau CSV
      responses:
        '200':
          description: File tarif ekspedisi berhasil diupload dan diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: File tarif ekspedisi berhasil diupload dan diproses.
                  data:
                    type: object
                    properties:
                      upload_batch_id:
                        type: string
                        example: BATCH-RATE-20260723-001
                      processed_count:
                        type: integer
                        example: 50
                      created_count:
                        type: integer
                        example: 50
                      errors:
                        type: array
                        items:
                          type: string
        '422':
          description: Format file atau validasi tidak sesuai
        '401':
          description: Tidak terautentikasi

  /v1/ekspedisi/expeditions:
    get:
      summary: Get paginated list of expeditions
      description: Mendapatkan daftar master ekspedisi dengan pagination dan filter pencarian.
      tags:
        - Master Ekspedisi
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Filter pencarian berdasarkan kode, nama, kota, atau PIC
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
          description: Filter status ekspedisi
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 15
          description: Jumlah data per halaman
      responses:
        '200':
          description: Daftar master ekspedisi berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar master ekspedisi berhasil diambil.
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Expedition'
        '401':
          description: Tidak terautentikasi

    post:
      summary: Create new expedition master
      description: Menambahkan data master ekspedisi baru.
      tags:
        - Master Ekspedisi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expedition_name
              properties:
                expedition_code:
                  type: string
                  nullable: true
                  description: Kode ekspedisi. Jika kosong, akan otomatis di-generate oleh backend (contoh EXP0001, EXP0002)
                  example: EXP0001
                expedition_name:
                  type: string
                  example: PT Jalur Nugraha Ekakurir
                address:
                  type: string
                  example: Jl. Raya Bandara Juanda No. 12
                city:
                  type: string
                  example: Sidoarjo
                province:
                  type: string
                  example: Jawa Timur
                postal_code:
                  type: string
                  example: 61253
                pic_name:
                  type: string
                  example: Budi Santoso
                pic_phone:
                  type: string
                  example: 081234567890
                email:
                  type: string
                  example: budi@jne.co.id
                npwp:
                  type: string
                  example: 01.234.567.8-012.000
                vehicle_type:
                  type: string
                  example: Box Medium
                transport_mode:
                  type: string
                  example: Darat
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  example: ACTIVE
      responses:
        '201':
          description: Master ekspedisi berhasil ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Master ekspedisi berhasil ditambahkan.
                  data:
                    $ref: '#/components/schemas/Expedition'
        '422':
          description: Error validasi input
        '401':
          description: Tidak terautentikasi

  /v1/ekspedisi/expeditions/{id}:
    get:
      summary: Get detailed expedition master
      description: Mendapatkan detail data master ekspedisi berdasarkan ID.
      tags:
        - Master Ekspedisi
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID Ekspedisi
      responses:
        '200':
          description: Detail master ekspedisi berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Detail master ekspedisi berhasil diambil.
                  data:
                    $ref: '#/components/schemas/Expedition'
        '404':
          description: Data ekspedisi tidak ditemukan
        '401':
          description: Tidak terautentikasi

    put:
      summary: Update expedition master
      description: Memperbarui data master ekspedisi berdasarkan ID.
      tags:
        - Master Ekspedisi
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID Ekspedisi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expedition_code:
                  type: string
                  example: JNE
                expedition_name:
                  type: string
                  example: PT Jalur Nugraha Ekakurir
                address:
                  type: string
                  example: Jl. Raya Bandara Juanda No. 12
                city:
                  type: string
                  example: Sidoarjo
                province:
                  type: string
                  example: Jawa Timur
                postal_code:
                  type: string
                  example: 61253
                pic_name:
                  type: string
                  example: Budi Santoso
                pic_phone:
                  type: string
                  example: 081234567890
                email:
                  type: string
                  example: budi@jne.co.id
                npwp:
                  type: string
                  example: 01.234.567.8-012.000
                vehicle_type:
                  type: string
                  example: Box Medium
                transport_mode:
                  type: string
                  example: Darat
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  example: ACTIVE
      responses:
        '200':
          description: Master ekspedisi berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Master ekspedisi berhasil diperbarui.
                  data:
                    $ref: '#/components/schemas/Expedition'
        '404':
          description: Data ekspedisi tidak ditemukan
        '422':
          description: Error validasi input
        '401':
          description: Tidak terautentikasi

    delete:
      summary: Delete expedition master
      description: Menghapus data master ekspedisi berdasarkan ID.
      tags:
        - Master Ekspedisi
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID Ekspedisi
      responses:
        '200':
          description: Master ekspedisi berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Master ekspedisi berhasil dihapus.
        '404':
          description: Data ekspedisi tidak ditemukan
        '401':
          description: Tidak terautentikasi

  /v1/ekspedisi/rates/rank:
    get:
      summary: Get ranked expedition rates list (Supports destination_id or card_code)
      description: |
        Mendapatkan daftar rekomendasi perankingan tarif ekspedisi teraktif terurut dari harga termurah berdasarkan asal, tujuan, dan berat barang:
        - Parameter tujuan (`destination`, `destination_id`, `card_code`) dapat diisi dengan:
          1. **Card Code:** Kode distributor / customer (contoh: `C210000285` atau `c210000285`). Sistem otomatis mencari seluruh shipto customer tersebut.
          2. **ShipTo ID:** ID numerik spesifik dari tabel `customer_shiptos` (contoh: `12`). Sistem juga otomatis mencocokkan tarif customer yang sama.
          3. **ShipTo Code / Address ID SAP:** Contoh `SHIPTO-SOLO-01` atau alias nama gudang.
        - Parameter asal (`origin`, `origin_id`, `whs_code`, `warehouse_id`) dapat berupa kode gudang (contoh: `FG04`) atau ID numerik gudang.
        - Mendukung method `GET` dan `POST`.
      tags:
        - Master Tarif Ekspedisi
      security:
        - BearerAuth: []
      parameters:
        - name: origin
          in: query
          required: false
          schema:
            type: string
          description: Kode gudang asal (whs_code, contoh FG04) atau ID gudang. Alias `origin_id`, `warehouse_id`, `whs_code`.
        - name: destination
          in: query
          required: false
          schema:
            type: string
          description: Kode customer tujuan (card_code, contoh C210000285) atau ID Shipto tujuan.
        - name: destination_id
          in: query
          required: false
          schema:
            type: string
          description: ID Shipto tujuan atau Card Code customer. Alias untuk `destination`.
        - name: card_code
          in: query
          required: false
          schema:
            type: string
          description: Card Code customer distributor. Alias untuk `destination`.
        - name: weight
          in: query
          required: false
          schema:
            type: number
          description: Berat barang dalam KG atau tonase (contoh 500). Alias `tonnage`, `qty`.
        - name: service_type
          in: query
          required: false
          schema:
            type: string
          description: Jenis layanan/tarif (misalnya REGULER, TONASE, RIT, dll)
        - name: transport_mode
          in: query
          required: false
          schema:
            type: string
          description: Moda pengiriman/transportasi (DARAT, LAUT, UDARA). Mendukung multiple value dipisahkan koma.
      responses:
        '200':
          description: Expedition rates ranking retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Expedition rates ranking retrieved successfully.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpeditionRate'
        '422':
          description: Validasi gagal (parameter wajib belum dikirim)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
    post:
      summary: Get ranked expedition rates list via POST (Supports destination_id or card_code)
      description: Sama dengan GET `/v1/ekspedisi/rates/rank`, namun menerima parameter dalam request body JSON.
      tags:
        - Master Tarif Ekspedisi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - origin
              properties:
                origin:
                  type: string
                  example: "FG04"
                destination:
                  type: string
                  example: "C210000285"
                destination_id:
                  type: string
                  example: "C210000285"
                card_code:
                  type: string
                  example: "C210000285"
                weight:
                  type: number
                  example: 1000
                service_type:
                  type: string
                  example: "REGULER"
                transport_mode:
                  type: string
                  example: "DARAT"
      responses:
        '200':
          description: Expedition rates ranking retrieved successfully
          content:
            application/json:
              schema:
