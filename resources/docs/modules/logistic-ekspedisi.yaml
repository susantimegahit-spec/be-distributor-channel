  /v1/logistic/picklists/{id}/items/{itemId}/start-time:
    post:
      summary: Catat Waktu Mulai Pemeriksaan Item (Start Time KPI)
      description: |
        Mencatat timestamp waktu mulai (`start_time`) pemeriksaan barang oleh checker pada item picklist tertentu secara instan.
        Endpoint ini dibuat khusus agar checker dapat langsung mencatat waktu awal saat tombol "Start" diklik pada aplikasi, sehingga jika aplikasi di-minimize, ditutup sementara, atau koneksi terputus, waktu mulai pemeriksaan tidak hilang dan tercatat akurat di server.
        - Jika field `start_time` tidak dikirim di request body, sistem otomatis menggunakan waktu server saat ini (`now()`).
        - Jika item sudah memiliki `start_time` dan parameter `overwrite` tidak bernilai `true`, server mempertahankan `start_time` pertama agar durasi KPI tidak ter-reset saat aplikasi dibuka kembali.
        - Status picklist yang sebelumnya `open` atau `weigh_in` otomatis berubah menjadi `inprogress`.
      tags:
        - Logistic - Picklist
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID Picklist
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          description: ID Picklist Item (picklist_items.id) atau Sales Order Detail ID
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                start_time:
                  type: string
                  format: date-time
                  description: Timestamp waktu mulai pemeriksaan (opsional, default waktu server saat ini)
                  example: "2026-10-21T08:45:00"
                checker_name:
                  type: string
                  description: Nama checker yang melakukan pemeriksaan (opsional)
                  example: "NANANG"
                overwrite:
                  type: boolean
                  description: Paksa update waktu mulai jika item sudah memiliki start_time sebelumnya (default false)
                  example: false
      responses:
        '200':
          description: Start time berhasil dicatat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Start time recorded successfully."
                  data:
                    type: object
                    properties:
                      picklist_id:
                        type: integer
                        example: 10
                      picklist_no:
                        type: string
                        example: "PKL-202610-001"
                      picklist_status:
                        type: string
                        example: "inprogress"
                      item_id:
                        type: integer
                        example: 25
                      sales_order_id:
                        type: integer
                        example: 101
                      item_code:
                        type: string
                        example: "FG-001"
                      item_name:
                        type: string
                        example: "Garam Halus 250gr"
                      whs_code:
                        type: string
                        example: "WHS-FG"
                      uom:
                        type: string
                        example: "SAK"
                      start_time:
                        type: string
                        format: date-time
                        example: "2026-10-21 08:45:00"
                      checked_by_checker:
                        type: string
                        example: "NANANG"
                      is_checked:
                        type: boolean
                        example: false
        '400':
          description: Picklist sudah berstatus COMPLETED atau CANCELLED.
        '404':
          description: Picklist atau item tidak ditemukan.

  /v1/logistic/picklists/{id}/save-draft:
    post:
      summary: Simpan Progres Draft Checklist & Tanda Tangan Picklist (Multi-Checker)
      description: |
        Menyimpan progres checklist fisik dan bukti tanda tangan untuk picklist tertentu dalam mode draft (misal untuk alur multi-checker di gudang berbeda).
        Endpoint ini TIDAK mengirimkan transaksi Delivery Order (DO) ke SAP B1.
        Status picklist otomatis diperbarui menjadi `IN_PROGRESS`.
        Nama checker yang dikirimkan otomatis digabungkan dengan checker sebelumnya (misal "ROCHIM/NANANG"), dan tanda tangan dari masing-masing checker disimpan secara akumulatif.
      tags:
        - Logistic - Picklist
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID Picklist
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                NamaChecker:
                  type: string
                  description: Nama checker yang sedang memeriksa barang
                  example: "ROCHIM"
                Sopir:
                  type: string
                  description: Nama supir armada
                  example: "SUPOYO"
                NoPol:
                  type: string
                  description: Nomor polisi kendaraan
                  example: "L9870CE"
                Comments:
                  type: string
                  description: Catatan pemeriksaan opsional
                  example: "Pemeriksaan tahap 1 gudang A selesai"
                signatures:
                  type: array
                  description: Tanda tangan digital checker dan/atau supir
                  items:
                    type: object
                    required:
                      - signer_type
                      - signer_name
                      - signature
                    properties:
                      signer_type:
                        type: string
                        enum: [checker, driver, supervisor]
                        example: "checker"
                      signer_role_title:
                        type: string
                        example: "Checker Gudang A"
                      signer_name:
                        type: string
                        example: "ROCHIM"
                      signature:
                        type: string
                        example: "data:image/svg+xml;utf8,<svg>...</svg>"
                Lines:
                  type: array
                  description: Data baris dokumen yang diverifikasi
                  items:
                    type: object
                    required:
                      - BaseEntry
                      - BaseLine
                      - Quantity
                    properties:
                      id:
                        type: integer
                        description: ID baris item picklist (picklist_items.id).
                        example: 10
                      BaseEntry:
                        type: integer
                        description: DocEntry dari Sales Order SAP
                        example: 1052
                      BaseLine:
                        type: integer
                        description: Nomor baris/LineNum dari Sales Order (indeks dimulai dari 0)
                        example: 0
                      Quantity:
                        type: number
                        description: Kuantitas barang yang diverifikasi
                        example: 5.0
                      checked_qty:
                        type: number
                        description: Kuantitas barang yang telah diverifikasi fisik oleh checker
                        example: 5.0
                      checked_by_checker:
                        type: string
                        description: Nama staf checker yang memverifikasi item ini
                        example: "ROCHIM"
                      start_time:
                        type: string
                        format: date-time
                        description: Waktu mulai pemeriksaan oleh checker (KPI)
                        example: "2026-10-14T09:00:00"
                      end_time:
                        type: string
                        format: date-time
                        description: Waktu selesai pemeriksaan oleh checker (KPI)
                        example: "2026-10-14T09:25:00"
                      labels:
                        type: array
                        description: |
                          Daftar label kemasan produk beserta tanggal produksi untuk item ini.
                          Satu baris item dapat memiliki lebih dari satu batch/tanggal produksi dan foto label.
                        items:
                          type: object
                          properties:
                            production_date:
                              type: string
                              format: date
                              description: Tanggal produksi barang fisik pada label kemasan produk
                              example: "2026-10-10"
                            label_photos:
                              type: array
                              description: Daftar foto label kemasan untuk tanggal produksi ini. Mendukung Base64 Data URI atau URL.
                              items:
                                type: string
                                example: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ..."
                      WhsCode:
                        type: string
                        description: Kode gudang
                        example: "01"
                      OcrCode:
                        type: string
                        description: Kode cabang (Cost Center 1)
                        example: "SBY"
                      OcrCode2:
                        type: string
                        description: Kode unit (Cost Center 2)
                        example: "GRM"
                      OcrCode3:
                        type: string
                        description: Kode departemen (Cost Center 3)
                        example: "MKT"
                      is_checked:
                        type: boolean
                        description: |
                          Status centang item ini oleh checker. Digunakan saat `is_draft: true` untuk menandai item mana saja yang sudah diverifikasi.
                          Jika tidak dikirim, default false. Item yang belum is_checked tidak dikirim ke SAP saat finalisasi DO.
                        example: true
      responses:
        '200':
          description: Draft picklist progress successfully saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Draft picklist progress successfully saved."
                  data:
                    type: object
                    properties:
                      picklist_id:
                        type: integer
                        example: 1
                      picklist_no:
                        type: string
                        example: "PKL-20261009-0001"
                      status:
                        type: string
                        example: "IN_PROGRESS"
                      checker_name:
                        type: string
                        example: "ROCHIM/NANANG"
                      driver_name:
                        type: string
                        example: "SUPOYO"
                      total_items:
                        type: integer
                        example: 2
                      checked_items:
                        type: integer
                        example: 1
                      is_fully_checked:
                        type: boolean
                        example: false
                      updated_items:
                        type: integer
                        example: 1
        '400':
          description: Validation or business error.
        '404':
          description: Picklist not found.

  /v1/logistic/picklists/add-do:
    post:
      summary: Direct Add Delivery Order (DO) ke SAP B1 (Batch Atomic JSON Array)
      description: |
        Mengirim payload request Delivery Order secara langsung ke SAP Business One (/api/AddDO).
        Mendukung pembuatan satu atau banyak dokumen DO sekaligus (batch) berbasis Sales Order dalam satu transaksi atomik database SAP (StartTransaction dan EndTransaction).
        Jika salah satu dokumen gagal dibuat, seluruh dokumen dalam antrean request otomatis dibatalkan (Rollback / gagal satu, gagal semua).
        CardCode tidak wajib diisi karena sistem otomatis membaca CardCode, sales person, dan kontak dari Sales Order asal (BaseEntry).
        ItemCode, harga satuan, UoM/satuan, dan kode pajak tidak perlu dikirim karena otomatis mewarisi Sales Order.
        Setelah berhasil, nomor DO (DocNum dan DocEntry) disimpan ke kolom database Sales Order dan Picklist terkait.
      tags:
        - Logistic - Picklist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: JSON Array berisi kumpulan objek header DO dan barisnya (atau objek tunggal)
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - Series
                  - Lines
                properties:
                  picklist_id:
                    type: integer
                    description: Opsional. ID Picklist terkait jika membuat DO dari dokumen picklist
                    example: 10
                  is_draft:
                    type: boolean
                    description: Flag simpan draft alur multi-checker / multi-gudang. Jika true, checklist dan tanda tangan disimpan tanpa mengirim DO ke SAP B1.
                    example: false
                  Series:
                    type: integer
                    description: Nomor Series DO di SAP
                    example: 75
                  DocDate:
                    type: string
                    format: date-time
                    description: Tanggal dokumen
                    example: "2026-09-24T00:00:00"
                  DocDueDate:
                    type: string
                    format: date-time
                    description: Tanggal jatuh tempo pengiriman
                    example: "2026-09-24T00:00:00"
                  TaxDate:
                    type: string
                    format: date-time
                    description: Tanggal pajak
                    example: "2026-09-24T00:00:00"
                  NumAtCard:
                    type: string
                    description: Nomor referensi / PO customer
                    example: "PO-CUST-001"
                  Comments:
                    type: string
                    description: Catatan pengiriman
                    example: "Pengiriman parsial SO tahap 1"
                  NoPol:
                    type: string
                    description: Nomor polisi armada kendaraan
                    example: "B 1234 ABC"
                  KodeEkspedisi:
                    type: string
                    description: Kode ekspedisi
                    example: "JNE"
                  NamaEkspedisi:
                    type: string
                    description: Nama vendor ekspedisi
                    example: "JNE Trucking"
                  Sopir:
                    type: string
                    description: Nama supir
                    example: "Budi Santoso"
                  NamaChecker:
                    type: string
                    description: Nama staf checker. Mendukung multi-checker dengan pemisah garis miring (misal "ROCHIM/NANANG")
                    example: "ROCHIM/NANANG"
                  AddonId:
                    type: integer
                    description: Otomatis di-hardcode bernilai 2
                    example: 2
                  UserId:
                    type: string
                    description: ID pengguna dari user login
                    example: "1"
                  Noseal:
                    type: string
                    description: Nomor segel pengiriman (seal number)
                    example: "12345"
                  CardCode:
                    type: string
                    description: Opsional. Otomatis membaca dari SO (BaseEntry)
                    example: "C20000"
                  Lines:
                    type: array
                    description: Minimal data baris pengiriman
                    items:
                      type: object
                      required:
                        - BaseEntry
                        - BaseLine
                        - Quantity
                      properties:
                        id:
                          type: integer
                          description: Opsional. ID baris picklist item (picklist_items.id)
                          example: 101
                        sales_order_id:
                          type: integer
                          description: ID Sales Order sumber untuk item baris ini
                          example: 1
                        sales_order_detail_id:
                          type: integer
                          description: Opsional. ID baris item Sales Order detail
                          example: 10
                        checked_qty:
                          type: number
                          description: Jumlah kuantitas yang diverifikasi checker
                          example: 5.0
                        is_checked:
                          type: boolean
                          description: Status checklist verifikasi item
                          example: true
                        checked_by_checker:
                          type: string
                          description: Nama checker yang memeriksa item
                          example: "ROCHIM"
                        start_time:
                          type: string
                          format: date-time
                          description: Waktu mulai pemeriksaan checker (KPI)
                          example: "2026-10-14T09:00:00"
                        end_time:
                          type: string
                          format: date-time
                          description: Waktu selesai pemeriksaan checker (KPI)
                          example: "2026-10-14T09:25:00"
                        labels:
                          type: array
                          description: |
                            Daftar label kemasan produk beserta tanggal produksi untuk item ini.
                            Satu baris item dapat memiliki lebih dari satu batch/tanggal produksi dan foto label.
                          items:
                            type: object
                            properties:
                              production_date:
                                type: string
                                format: date
                                description: Tanggal produksi barang fisik pada label kemasan produk
                                example: "2026-10-10"
                              label_photos:
                                type: array
                                description: Daftar foto label kemasan untuk tanggal produksi ini. Mendukung Base64 Data URI atau URL.
                                items:
                                  type: string
                                  example: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ..."
                        BaseEntry:
                          type: integer
                          description: DocEntry dari Sales Order
                          example: 1052
                        BaseLine:
                          type: integer
                          description: Nomor baris/LineNum dari Sales Order (indeks dimulai dari 0)
                          example: 0
                        Quantity:
                          type: number
                          description: Jumlah barang yang dikirim (tidak boleh melebihi sisa open quantity di SO)
                          example: 5.0
                        WhsCode:
                          type: string
                          description: Opsional. Gudang pengiriman jika berbeda dari SO
                          example: "01"
                        OcrCode:
                          type: string
                          description: Kode cabang (Cost Center 1)
                          example: "SBY"
                        OcrCode2:
                          type: string
                          description: Kode unit (Cost Center 2)
                          example: "GRM"
                        OcrCode3:
                          type: string
                          description: Kode departemen (Cost Center 3)
                          example: "MKT"
            example:
              - Series: 75
                DocDate: "2026-09-24T00:00:00"
                DocDueDate: "2026-09-24T00:00:00"
                TaxDate: "2026-09-24T00:00:00"
                NumAtCard: "PO-CUST-001"
                Comments: "Pengiriman parsial SO tahap 1"
                NoPol: "B 1234 ABC"
                KodeEkspedisi: "JNE"
                NamaEkspedisi: "JNE Trucking"
                Sopir: "Budi Santoso"
                NamaChecker: "ROCHIM/NANANG"
                AddonId: 2
                UserId: "1"
                Noseal: "12345"
                Lines:
                  - sales_order_id: 1
                    BaseEntry: 1052
                    BaseLine: 0
                    Quantity: 5.0
                    WhsCode: "01"
                    OcrCode: "SBY"
                    OcrCode2: "GRM"
                    OcrCode3: "MKT"
                  - sales_order_id: 1
                    BaseEntry: 1052
                    BaseLine: 1
                    Quantity: 2.0
                    WhsCode: "01"
                    OcrCode: "SBY"
                    OcrCode2: "GRM"
                    OcrCode3: "MKT"
              - Series: 75
                DocDate: "2026-09-24T00:00:00"
                DocDueDate: "2026-09-25T00:00:00"
                TaxDate: "2026-09-24T00:00:00"
                NumAtCard: "PO-CUST-002"
                Comments: "Pengiriman SO cabang timur"
                NoPol: "B 5678 XYZ"
                KodeEkspedisi: "INTERNAL"
                NamaEkspedisi: "Armada Sendiri"
                Sopir: "Santoso"
                NamaChecker: "Andi"
                AddonId: 2
                UserId: "1"
                Lines:
                  - sales_order_id: 2
                    BaseEntry: 1053
                    BaseLine: 0
                    Quantity: 10.0
                    WhsCode: "02"
                    OcrCode: "SBY"
                    OcrCode2: "GRM"
                    OcrCode3: "MKT"
      responses:
        '200':
          description: Delivery Order successfully created in SAP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Delivery Order successfully created in SAP."
                  data:
                    type: object
                    properties:
                      delivery_order_no:
                        type: string
                        example: "20260088"
                      doc_entry:
                        type: string
                        example: "1052"
                      doc_num:
                        type: string
                        example: "20260088"
                      documents:
                        type: array
                        items:
                          type: object
                          properties:
                            doc_entry:
                              type: string
                              example: "1052"
                            doc_num:
                              type: string
                              example: "20260088"
                            sales_order_id:
                              type: integer
                              example: 1
                            order_no:
                              type: string
                              example: "SO-PKL-001"
                            picklist_id:
                              type: integer
                              example: 10
                            picklist_no:
                              type: string
                              example: "PKL-202609-0001"
        '400':
          description: Business error or SAP AddDO failure.

  /v1/logistic/picklists/save-draft:
    post:
      summary: Direct Simpan Progres Draft Checklist & Tanda Tangan Picklist
      description: |
        Menyimpan progres checklist dan tanda tangan serah terima picklist tanpa mengirim dokumen ke SAP B1.
        Mengharuskan `picklist_id` pada request body.
        Status picklist otomatis berubah menjadi `IN_PROGRESS`.
      tags:
        - Logistic - Picklist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - picklist_id
              properties:
                picklist_id:
                  type: integer
                  description: ID Picklist yang akan disimpan draft progresnya
                  example: 1
                NamaChecker:
                  type: string
                  description: Nama checker
                  example: "ROCHIM"
                Sopir:
                  type: string
                  example: "SUPOYO"
                NoPol:
                  type: string
                  example: "L9870CE"
                Comments:
                  type: string
                  example: "Draft progres checker 1"
                signatures:
                  type: array
                  items:
                    type: object
                    properties:
                      signer_type:
                        type: string
                        enum: [checker, driver, supervisor]
                        example: "checker"
                      signer_role_title:
                        type: string
                        example: "Checker Gudang A"
                      signer_name:
                        type: string
                        example: "ROCHIM"
                      signature:
                        type: string
                        example: "data:image/svg+xml;utf8,<svg>...</svg>"
                Lines:
                  type: array
                  description: Data baris dokumen yang diverifikasi
                  items:
                    type: object
                    required:
                      - BaseEntry
                      - BaseLine
                      - Quantity
                    properties:
                      id:
                        type: integer
                        description: ID baris picklist item (picklist_items.id)
                        example: 10
                      BaseEntry:
                        type: integer
                        description: DocEntry dari Sales Order SAP
                        example: 1052
                      BaseLine:
                        type: integer
                        description: Nomor baris/LineNum dari Sales Order (indeks dimulai dari 0)
                        example: 0
                      Quantity:
                        type: number
                        description: Kuantitas barang yang diverifikasi
                        example: 5.0
                      checked_qty:
                        type: number
                        description: Kuantitas yang diverifikasi checker
                        example: 5.0
                      checked_by_checker:
                        type: string
                        description: Nama checker yang memeriksa item
                        example: "ROCHIM"
                      start_time:
                        type: string
                        format: date-time
                        description: Waktu mulai pemeriksaan checker (KPI)
                        example: "2026-10-14T09:00:00"
                      end_time:
                        type: string
                        format: date-time
                        description: Waktu selesai pemeriksaan checker (KPI)
                        example: "2026-10-14T09:25:00"
                      labels:
                        type: array
                        description: |
                          Daftar label kemasan produk beserta tanggal produksi untuk item ini.
                          Satu baris item dapat memiliki lebih dari satu batch/tanggal produksi dan foto label.
                        items:
                          type: object
                          properties:
                            production_date:
                              type: string
                              format: date
                              description: Tanggal produksi barang fisik pada label kemasan produk
                              example: "2026-10-10"
                            label_photos:
                              type: array
                              description: Daftar foto label kemasan untuk tanggal produksi ini. Mendukung Base64 Data URI atau URL.
                              items:
                                type: string
                                example: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ..."
                      WhsCode:
                        type: string
                        description: Kode gudang
                        example: "01"
                      OcrCode:
                        type: string
                        description: Kode cabang (Cost Center 1)
                        example: "SBY"
                      OcrCode2:
                        type: string
                        description: Kode unit (Cost Center 2)
                        example: "GRM"
                      OcrCode3:
                        type: string
                        description: Kode departemen (Cost Center 3)
                        example: "MKT"
      responses:
        '200':
          description: Draft picklist progress successfully saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Draft picklist progress successfully saved."
                  data:
                    type: object
                    properties:
                      picklist_id:
                        type: integer
                        example: 1
                      picklist_no:
                        type: string
                        example: "PKL-20261009-0001"
                      status:
                        type: string
                        example: "IN_PROGRESS"
                      checker_name:
                        type: string
                        example: "ROCHIM"
                      driver_name:
                        type: string
                        example: "SUPOYO"
                      total_items:
                        type: integer
                        example: 2
                      checked_items:
                        type: integer
                        example: 1
                      is_fully_checked:
                        type: boolean
                        example: false
        '400':
          description: Validation or business error.

  /v1/ekspedisi/loading-rate-types:
    get:
      summary: Daftar Jenis Perhitungan Tarif Angkut Kuli
      description: Mengambil daftar jenis perhitungan tarif ongkos angkut (seperti REGULAR dan OVERTIME).
      tags:
        - Logistic - Loading Rates
      security:
        - BearerAuth: []
      parameters:
        - name: is_active
          in: query
          description: Filter status aktif
          schema:
            type: boolean
        - name: search
          in: query
          description: Pencarian berdasarkan kode, nama, atau deskripsi
          schema:
            type: string
      responses:
        '200':
          description: Daftar jenis perhitungan berhasil diambil.
    post:
      summary: Tambah Jenis Perhitungan Tarif Angkut Kuli Baru
      description: Menambahkan jenis perhitungan tarif baru (misal REGULAR atau OVERTIME).
      tags:
        - Logistic - Loading Rates
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name
              properties:
                code:
                  type: string
                  example: "REGULAR"
                name:
                  type: string
                  example: "Regular"
                description:
                  type: string
                  example: "Ongkos angkut jam kerja reguler"
                start_time:
                  type: string
                  description: Jam mulai berlaku (format HH:mm atau HH:mm:ss)
                  example: "08:00:00"
                end_time:
                  type: string
                  description: Jam selesai berlaku (format HH:mm atau HH:mm:ss, misal lembur sampai 02:00)
                  example: "16:30:00"
                is_active:
                  type: boolean
                  example: true
      responses:
        '201':
          description: Jenis perhitungan berhasil ditambahkan.

  /v1/ekspedisi/loading-rate-types/{id}:
    get:
      summary: Detail Jenis Perhitungan Tarif Angkut Kuli
