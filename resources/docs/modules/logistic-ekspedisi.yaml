  /v1/ekspedisi/loading-rates:
    get:
      summary: Daftar Master Tarif Ongkos Angkut Kuli
      description: Mengambil daftar tarif ongkos angkut per item barang untuk kuli muat (regular maupun lembur).
      tags:
        - Logistic - Loading Rates
      security:
        - BearerAuth: []
      parameters:
        - name: item_code
          in: query
          description: Filter kode item
          schema:
            type: string
        - name: rate_type
          in: query
          description: Filter jenis perhitungan (REGULAR / OVERTIME)
          schema:
            type: string
        - name: status
          in: query
          description: Filter status (ACTIVE / INACTIVE)
          schema:
            type: string
        - name: search
          in: query
          description: Pencarian nama item atau kode item
          schema:
            type: string
        - name: per_page
          in: query
          description: Jumlah baris per halaman atau "all"
          schema:
            type: string
            example: "15"
      responses:
        '200':
          description: Daftar tarif angkut berhasil diambil.
    post:
      summary: Tambah Master Tarif Ongkos Angkut Kuli
      description: Menambahkan tarif ongkos angkut untuk item barang dan tipe rate tertentu.
      tags:
        - Logistic - Loading Rates
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_code
                - rate
              properties:
                item_code:
                  type: string
                  example: "SKU-LOAD-01"
                item_name:
                  type: string
                  example: "Garam Kasar 50kg"
                rate_type:
                  type: string
                  enum: [REGULAR, OVERTIME]
                  example: "REGULAR"
                rate:
                  type: number
                  description: Biaya ongkos angkut per satuan
                  example: 1500
                uom:
                  type: string
                  description: Unit of Measure (Uom)
                  example: "SAK"
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  example: "ACTIVE"
                remarks:
                  type: string
                  example: "Tarif reguler bongkar muat kuli"
      responses:
        '201':
          description: Tarif angkut kuli berhasil ditambahkan.

  /v1/ekspedisi/loading-rates/{id}:
    get:
      summary: Detail Master Tarif Ongkos Angkut Kuli
