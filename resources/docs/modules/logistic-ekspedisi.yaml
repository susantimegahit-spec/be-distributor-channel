  /v1/ekspedisi/leadtimes:
    get:
      summary: Daftar Master Leadtime Pengiriman (CRUD)
      description: Mengambil daftar benchmark durasi/lead time pengiriman antar gudang asal ke tujuan/kota distributor. Mendukung filter pencarian rute, kode gudang asal, kota tujuan, moda transportasi, status, dan pagination.
      tags:
        - Ekspedisi - Master Leadtime
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          description: Pencarian nama gudang asal, kode gudang, kota asal, nama tujuan, kode tujuan, atau catatan
          schema:
            type: string
        - name: origin_warehouse_code
          in: query
          description: Filter kode gudang asal (contoh WHS-SUB, WHS-JKT)
          schema:
            type: string
        - name: destination_city
          in: query
          description: Filter nama kota/kabupaten tujuan (contoh SEMARANG, BANDUNG)
          schema:
            type: string
        - name: destination_code
          in: query
          description: Filter kode tujuan spesifik
          schema:
            type: string
        - name: transport_mode
          in: query
          description: Filter moda transportasi (LAND, SEA, AIR)
          schema:
            type: string
            enum: [LAND, SEA, AIR]
        - name: status
          in: query
          description: Filter status master leadtime (ACTIVE, INACTIVE)
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
        - name: per_page
          in: query
          description: Jumlah baris data per halaman (default 15)
          schema:
            type: integer
            default: 15
        - name: page
          in: query
          description: Halaman data yang diminta
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Master lead times retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Master lead times retrieved successfully.
                  data:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MasterLeadtimeItem'
                      total:
                        type: integer
                        example: 45
        '401':
          description: Unauthenticated access.
    post:
      summary: Tambah Master Leadtime Rute Baru
      description: Menambahkan rute dan benchmark estimasi lead time pengiriman baru dari gudang asal ke titik/kota tujuan.
      tags:
        - Ekspedisi - Master Leadtime
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - destination_name
                - avg_lead_time_days
              properties:
                warehouse_origin_id:
                  type: integer
                  description: ID master warehouse origin (opsional)
                  example: 1
                origin_warehouse_code:
                  type: string
                  description: Kode gudang asal pengiriman (contoh WHS-SUB)
                  example: "WHS-SUB"
                origin_warehouse_name:
                  type: string
                  description: Nama gudang asal pengiriman
                  example: "Gudang Utama Surabaya Waru"
                origin_city:
                  type: string
                  description: Kota gudang asal
                  example: "SURABAYA"
                destination_id:
                  type: integer
                  description: ID entitas tujuan / customer shipto
                  example: 12
                destination_regency_id:
                  type: integer
                  description: ID master kabupaten/kota tujuan
                  example: 3578
                destination_code:
                  type: string
                  description: Kode titik tujuan / CardCode / shipto
                  example: "DEST-BDG"
                destination_name:
                  type: string
                  description: Nama tujuan pengiriman
                  example: "Gudang Distributor Bandung"
                destination_city:
                  type: string
                  description: Kota/kabupaten tujuan
                  example: "BANDUNG"
                destination_province:
                  type: string
                  description: Provinsi tujuan
                  example: "JAWA BARAT"
                avg_lead_time_days:
                  type: number
                  format: float
                  description: Rata-rata durasi lead time pengiriman dalam hari
                  example: 2.50
                min_lead_time_days:
                  type: number
                  format: float
                  description: Minimal durasi lead time dalam hari
                  example: 2.00
                max_lead_time_days:
                  type: number
                  format: float
                  description: Maksimal durasi lead time dalam hari
                  example: 3.00
                lead_time_unit:
                  type: string
                  enum: [DAYS, HOURS]
                  default: DAYS
                  example: "DAYS"
                transport_mode:
                  type: string
                  enum: [LAND, SEA, AIR]
                  default: LAND
                  example: "LAND"
                distance_km:
                  type: number
                  format: float
                  description: Jarak rute dalam kilometer
                  example: 680.00
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  default: ACTIVE
                  example: "ACTIVE"
                remarks:
                  type: string
                  description: Catatan tambahan rute operasional
                  example: "Truk Fuso reguler via tol Trans Jawa"
      responses:
