  /v1/logistic/picklists/{id}/attachments:
    post:
      summary: Upload Foto Dokumentasi Barang Masuk & Barang Keluar (Multi-file ke AWS S3)
      description: |
        Endpoint terpadu (1 API) untuk mengunggah multi-foto **Barang Masuk** (`barang_masuk`) dan **Barang Keluar** (`barang_keluar`) pada suatu Picklist.
        Semua file otomatis disimpan ke AWS S3 (dengan fallback penyimpanan lokal) dan dapat diunggah via:
        1. **Multipart Form-Data**: menggunakan field key `barang_masuk[]` dan `barang_keluar[]`.
        2. **JSON Payload**: menggunakan array string/objek berformat Base64 Data URL (`data:image/jpeg;base64,...`).
      tags:
        - Logistic - Picklist
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID Picklist
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                barang_masuk:
                  type: array
                  description: Multi-upload berkas foto barang masuk
                  items:
                    type: string
                    format: binary
                barang_keluar:
                  type: array
                  description: Multi-upload berkas foto barang keluar
                  items:
                    type: string
                    format: binary
                notes:
                  type: string
                  description: Catatan tambahan opsional
          application/json:
            schema:
              type: object
              properties:
                barang_masuk:
                  type: array
                  description: Multi-foto barang masuk dalam format Base64 atau objek file
                  items:
                    type: object
                    required:
                      - file
                    properties:
                      file:
                        type: string
                        description: Data URL Base64 (`data:image/jpeg;base64,...`) atau raw base64
                      file_name:
                        type: string
                        example: "kondisi_truk_masuk.jpg"
                      caption:
                        type: string
                        example: "Muatan saat baru tiba di gudang"
                barang_keluar:
                  type: array
                  description: Multi-foto barang keluar dalam format Base64 atau objek file
                  items:
                    type: object
                    required:
                      - file
                    properties:
                      file:
                        type: string
                        description: Data URL Base64 (`data:image/jpeg;base64,...`) atau raw base64
                      file_name:
                        type: string
                        example: "kondisi_truk_keluar.jpg"
                      caption:
                        type: string
                        example: "Muatan selesai disegel siap berangkat"
      responses:
        '200':
          description: Foto berhasil diunggah dan disimpan ke AWS S3.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Goods attachments saved successfully"
                  data:
                    type: object
                    properties:
                      barang_masuk:
                        type: array
                        items:
                          type: object
                      barang_keluar:
                        type: array
                        items:
                          type: object
        '404':
          description: Picklist tidak ditemukan.
        '422':
          description: Validasi berkas gagal.

  /v1/logistic/picklists/{id}/goods-attachments/{attachmentId}/preview:
    get:
      summary: Direct Public Preview Foto Barang Masuk / Keluar
