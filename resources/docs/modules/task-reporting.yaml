    post:
      summary: Tambah Karyawan Baru (Create Employee)
      description: Menambahkan data karyawan baru ke tabel HRIS corporate (hris_employees). Otomatis men-generate NIK unik dan alamat email kantor jika dikosongkan, serta mendukung penugasan langsung melalui ID atau kode departemen dan posisi.
      tags:
        - Task Management - Master Data
        - Task Management - Employees
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
              properties:
                full_name:
                  type: string
                  description: Nama lengkap karyawan
                  example: "Ahmad Fauzi"
                nik:
                  type: string
                  description: NIK karyawan (otomatis dibuat format unik EMP-YYYYMMDD-XXXX jika kosong)
                  example: "EMP-2026-0042"
                email_office:
                  type: string
                  format: email
                  description: Email kantor (otomatis dibuat dari nama jika kosong)
                  example: "ahmad.fauzi@susantimegah.com"
                nickname:
                  type: string
                  description: Nama panggilan karyawan
                  example: "Fauzi"
                phone_number:
                  type: string
                  example: "081234567890"
                telegram_chat_id:
                  type: string
                  example: "123456789"
                dept_code:
                  type: string
                  description: Kode departemen (misal IT, HRD, FIN, SCM). Alternatif dari department_id.
                  example: "IT"
                department_id:
                  type: integer
                  description: ID departemen HRIS
                  example: 1
                position_code:
                  type: string
                  description: Kode posisi (misal STAFF, DEV, MANAGER). Alternatif dari position_id.
                  example: "STAFF"
                position_id:
                  type: integer
                  description: ID posisi HRIS
                  example: 1
                division_id:
                  type: integer
                  nullable: true
                  example: null
                user_id:
                  type: integer
                  nullable: true
                  description: ID akun login users jika ingin ditautkan langsung
                  example: null
                employment_status:
                  type: string
                  enum: [PERMANENT, CONTRACT, PROBATION, INTERNSHIP, RESIGNED]
                  default: PERMANENT
                  example: "PERMANENT"
                join_date:
                  type: string
                  format: date
                  description: Tanggal bergabung (YYYY-MM-DD, default hari ini)
                  example: "2026-10-01"
                resign_date:
                  type: string
                  format: date
                  nullable: true
                  example: null
                is_active:
                  type: boolean
                  default: true
                  example: true
                avatar_url:
                  type: string
                  nullable: true
                  example: null
      responses:
        '201':
          description: Karyawan berhasil dibuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Employee created successfully
                  data:
                    $ref: '#/components/schemas/HrisEmployee'
