                    items:
                      $ref: '#/components/schemas/CronJobLog'

  /v1/reporting/tasks/sync:
    post:
      summary: Sync ClickUp Tasks via n8n Webhook
      description: Menerima data task tunggal atau batch dari n8n webhook untuk disimpan/diupdate (upsert) ke tabel `reporting_tasks`.
      tags:
        - Reporting & Analytics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ReportingTaskInput'
                - type: array
                  items:
                    $ref: '#/components/schemas/ReportingTaskInput'
                - type: object
                  properties:
                    tasks:
                      type: array
                      items:
                        $ref: '#/components/schemas/ReportingTaskInput'
      responses:
        '200':
          description: Data task ClickUp berhasil disinkronkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Data task ClickUp berhasil disinkronkan ke database reporting.
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 10
                      success:
                        type: integer
                        example: 10
                      failed:
                        type: integer
                        example: 0

  /v1/reporting/tasks:
    get:
      summary: Get List of Reporting Tasks
      description: Mengambil daftar task ClickUp yang tersimpan di database lokal untuk keperluan Data Studio / Looker Studio atau dashboard reporting.
      tags:
        - Reporting & Analytics
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Pencarian nama task, task ID, atau assignee
        - in: query
          name: space_id
          schema:
            type: string
          description: Filter ClickUp Space ID
        - in: query
          name: status
          schema:
            type: string
          description: Filter status task (e.g. to do, in progress, complete)
        - in: query
          name: assignee
          schema:
            type: string
          description: Filter assignee
        - in: query
          name: priority
          schema:
            type: string
          description: Filter priority (e.g. urgent, high, normal, low)
        - in: query
          name: all
          schema:
            type: boolean
          description: Set true untuk mengambil semua baris tanpa paginasi (cocok untuk export Data Studio)
      responses:
        '200':
          description: Daftar reporting tasks berhasil diambil.

  /v1/reporting/tasks/all:
    get:
      summary: Get ALL Reporting Tasks (Optimized for Apigee & Google Looker Studio)
      description: Mengambil seluruh data task ClickUp dari tabel `reporting_tasks` tanpa paginasi untuk kebutuhan konsumsi Apigee API Gateway dan Google Looker Studio. Mendukung filter space_id, status, assignee, priority, dan rentang tanggal.
      tags:
        - Reporting & Analytics
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Pencarian nama task, task ID, space ID, atau assignee
        - in: query
          name: space_id
          schema:
            type: string
          description: Filter ClickUp Space ID
        - in: query
          name: status
          schema:
            type: string
          description: Filter status task (e.g. to do, in progress, complete)
        - in: query
          name: assignee
          schema:
            type: string
          description: Filter assignee
        - in: query
          name: priority
          schema:
            type: string
          description: Filter priority (e.g. urgent, high, normal, low)
        - in: query
          name: start_date_from
          schema:
            type: string
            format: date
          description: Filter tanggal mulai dari (YYYY-MM-DD)
        - in: query
          name: due_date_to
          schema:
            type: string
            format: date
          description: Filter tanggal jatuh tempo sampai (YYYY-MM-DD)
      responses:
        '200':
          description: Seluruh data reporting tasks berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Seluruh data reporting tasks berhasil diambil."
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportingTask'
        '401':
          description: Unauthorized - API Key / Token tidak valid.

  /v1/reporting/tasks/summary:
    get:
      summary: Get Reporting Tasks Metric Summary
      description: Mengambil ringkasan metrik statistik tasks (jumlah berdasarkan status, priority, assignee, overdue) untuk visualisasi dashboard.
      tags:
        - Reporting & Analytics
      responses:
        '200':
          description: Summary metrik berhasil diambil.

  /v1/reporting/dashboard:
    get:
      summary: Get Dashboard KPIs, Charts, and Filter Options for Frontend
      description: Mengambil seluruh metrik KPI (total, in progress, completed, overdue, due soon, completion rate), data grafik (distribusi status, priority, assignee, list/folder, due date timeline), opsi dropdown filter, dan waktu sinkronisasi terakhir.
      tags:
        - Reporting & Analytics
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Pencarian task name, task ID, assignee, dll.
        - in: query
          name: space_id
          schema:
            type: string
        - in: query
          name: folder_name
          schema:
            type: string
        - in: query
          name: list_name
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: assignee
          schema:
            type: string
        - in: query
          name: priority
          schema:
            type: string
        - in: query
          name: start_date_from
          schema:
            type: string
            format: date
        - in: query
          name: due_date_to
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Data dashboard monitoring ClickUp berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Data dashboard monitoring ClickUp berhasil diambil.
                  data:
                    type: object
                    properties:
                      kpis:
                        type: object
                        properties:
                          total_tasks:
                            type: integer
                            example: 120
                          in_progress:
                            type: integer
                            example: 45
                          completed:
                            type: integer
                            example: 60
                          overdue:
                            type: integer
                            example: 8
                          due_soon:
                            type: integer
                            example: 7
                          completion_rate:
                            type: number
                            example: 50.0
                      charts:
                        type: object
                      filter_options:
                        type: object
                      last_synced_at:
                        type: string
                        example: "2026-08-22 09:15:00"

  /v1/reporting/filters:
    get:
      summary: Get All Distinct Filter Options for Frontend Select Dropdowns
      description: Mengambil seluruh opsi filter dropdown sekaligus (spaces, folders, lists, assignees, statuses, priorities, task_types, timelines).
      tags:
        - Reporting & Analytics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Seluruh opsi filter berhasil diambil.

  /v1/reporting/filters/spaces:
    get:
      summary: Get Distinct Spaces for Dropdown
      description: Mengambil daftar unik ClickUp Spaces beserta total tasks.
      tags:
        - Reporting & Analytics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar Space berhasil diambil.

  /v1/reporting/filters/folders:
    get:
      summary: Get Distinct Folders for Dropdown
      description: Mengambil daftar unik Folder (mendukung filter opsional `?space_id=`).
      tags:
        - Reporting & Analytics
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: space_id
          schema:
            type: string
          description: Filter folders berdasarkan Space ID
      responses:
        '200':
          description: Daftar Folder berhasil diambil.

  /v1/reporting/filters/lists:
    get:
      summary: Get Distinct Lists for Dropdown
      description: Mengambil daftar unik Lists (mendukung filter opsional `?space_id=` dan `?folder_name=`).
      tags:
        - Reporting & Analytics
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: space_id
          schema:
            type: string
        - in: query
          name: folder_name
          schema:
            type: string
      responses:
        '200':
          description: Daftar List berhasil diambil.

  /v1/reporting/filters/assignees:
    get:
      summary: Get Distinct Assignees for Dropdown
      description: Mengambil daftar unik individual Assignee beserta total tasks.
      tags:
        - Reporting & Analytics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar Assignee berhasil diambil.

  /v1/reporting/filters/statuses:
    get:
      summary: Get Distinct Statuses for Dropdown
      description: Mengambil daftar unik Status task beserta kategori (open, in_progress, completed) dan total tasks.
      tags:
        - Reporting & Analytics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar Status berhasil diambil.

  /v1/reporting/filters/priorities:
    get:
      summary: Get Distinct Priorities for Dropdown
      description: Mengambil daftar unik Priority task beserta urutan, badge color (#ef4444, #f97316, dll), dan total tasks.
      tags:
        - Reporting & Analytics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar Priority berhasil diambil.

  /v1/reporting/filters/task-types:
    get:
      summary: Get Distinct Task Types for Dropdown
      description: Mengambil daftar unik Task Types beserta total tasks.
      tags:
        - Reporting & Analytics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar Task Type berhasil diambil.


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
