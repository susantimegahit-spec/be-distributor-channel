openapi: 3.0.3
info:
  title: "SMESTA API - Modul Task Management, Reporting & Scheduler"
  description: |
    Dokumentasi API Modular SMESTA (Bagian dari `resources/docs/openapi.yaml`).
    Edit file ini secara langsung agar ringan di IDE, lalu jalankan `php artisan docs:openapi bundle` untuk menyatukan kembali ke `openapi.yaml`.
  version: 1.0.0
servers:
  - url: https://api-sm-connect.susantimegah.com/api/distributor-channel
    description: Production Server
  - url: http://api-dev.susantimegah.com/api/distributor-channel
    description: Development Server
  - url: http://localhost:8000/api/distributor-channel
    description: Local Server
paths:
  /task-management/dashboard/summary:
    get:
      summary: Ringkasan Dashboard Task Management (Analytics, KPI & Distribusi)
      description: Mengambil ringkasan analitik komprehensif untuk dashboard Task Management, mencakup overview KPI, distribusi status, prioritas SLA, space/departemen, beban kerja tim (team workload), top urgent tasks, dan aktivitas terbaru.
      tags:
        - Task Management - Dashboard
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: query
          description: Filter berdasarkan ID Workspace
          schema:
            type: integer
        - name: space_id
          in: query
          description: Filter berdasarkan ID Space (Departemen, misal IT, HRD)
          schema:
            type: string
        - name: department_id
          in: query
          description: Filter berdasarkan Kode Departemen
          schema:
            type: string
        - name: folder_id
          in: query
          description: Filter berdasarkan ID Folder
          schema:
            type: integer
        - name: list_id
          in: query
          description: Filter berdasarkan ID List
          schema:
            type: integer
        - name: employee_id
          in: query
          description: Filter berdasarkan ID Karyawan Assignee
          schema:
            type: integer
        - name: date_from
          in: query
          description: Filter tanggal awal pembuatan (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: Filter batas akhir tenggat waktu (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Dashboard summary berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Dashboard summary retrieved successfully
                  data:
                    type: object
                    properties:
                      overview:
                        type: object
                        properties:
                          total_tasks:
                            type: integer
                            example: 42
                          to_do:
                            type: integer
                            example: 12
                          in_progress:
                            type: integer
                            example: 15
                          in_review:
                            type: integer
                            example: 5
                          done:
                            type: integer
                            example: 10
                          cancelled:
                            type: integer
                            example: 0
                          overdue:
                            type: integer
                            example: 3
                          due_today:
                            type: integer
                            example: 4
                          completion_rate:
                            type: number
                            format: float
                            example: 23.8
                          total_estimated_hours:
                            type: number
                            format: float
                            example: 160.0
                          total_tracked_hours:
                            type: number
                            format: float
                            example: 38.5
                      status_distribution:
                        type: array
                        items:
                          type: object
                          properties:
                            status_id:
                              type: integer
                              example: 1
                            status_name:
                              type: string
                              example: To Do
                            status_category:
                              type: string
                              example: TO_DO
                            color_hex:
                              type: string
                              example: "#94A3B8"
                            total_tasks:
                              type: integer
                              example: 12
                            percentage:
                              type: number
                              format: float
                              example: 28.6
                      priority_distribution:
                        type: array
                        items:
                          type: object
                          properties:
                            priority_id:
                              type: integer
                              example: 1
                            priority_code:
                              type: string
                              example: URGENT
                            priority_name:
                              type: string
                              example: Urgent
                            color_hex:
                              type: string
                              example: "#EF4444"
                            target_sla_hours:
                              type: integer
                              example: 4
                            total_tasks:
                              type: integer
                              example: 5
                            percentage:
                              type: number
                              format: float
                              example: 11.9
                      space_distribution:
                        type: array
                        items:
                          type: object
                          properties:
                            space_id:
                              type: string
                              example: IT
                            space_name:
                              type: string
                              example: Information Technology
                            space_slug:
                              type: string
                              example: it-department
                            department_id:
                              type: string
                              example: IT
                            color_hex:
                              type: string
                              example: "#4F46E5"
                            icon_name:
                              type: string
                              example: folder
                            total_tasks:
                              type: integer
                              example: 20
                            completed_tasks:
                              type: integer
                              example: 8
                            in_progress_tasks:
                              type: integer
                              example: 9
                            overdue_tasks:
                              type: integer
                              example: 3
                            completion_rate:
                              type: number
                              format: float
                              example: 40.0
                      team_workload:
                        type: array
                        items:
                          type: object
                          properties:
                            employee_id:
                              type: integer
                              example: 1
                            full_name:
                              type: string
                              example: John Doe
                            nik:
                              type: string
                              example: EMP-001
                            avatar_url:
                              type: string
                              nullable: true
                              example: null
                            department_name:
                              type: string
                              example: Information Technology
                            total_tasks:
                              type: integer
                              example: 10
                            completed_tasks:
                              type: integer
                              example: 4
                            pending_tasks:
                              type: integer
                              example: 6
                            overdue_tasks:
                              type: integer
                              example: 1
                            total_tracked_hours:
                              type: number
                              format: float
                              example: 18.5
                      urgent_tasks:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 101
                            task_code:
                              type: string
                              example: TSK-IT-2026-00001
                            title:
                              type: string
                              example: Fix Server Incident
                            space_id:
                              type: string
                              example: IT
                            space_name:
                              type: string
                              example: Information Technology
                            priority_name:
                              type: string
                              example: Urgent
                            priority_color:
                              type: string
                              example: "#EF4444"
                            status_name:
                              type: string
                              example: In Progress
                            status_color:
                              type: string
                              example: "#3B82F6"
                            due_date:
                              type: string
                              example: "2026-10-01 18:00"
                            is_overdue:
                              type: boolean
                              example: true
                            progress_percentage:
                              type: integer
                              example: 50
                            assignees:
                              type: array
                              items:
                                type: object
                                properties:
                                  employee_id:
                                    type: integer
                                    example: 1
                                  full_name:
                                    type: string
                                    example: John Doe
                                  avatar_url:
                                    type: string
                                    nullable: true
                                    example: null
                      recent_activities:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 55
                            task_id:
                              type: integer
                              example: 101
                            task_code:
                              type: string
                              example: TSK-IT-2026-00001
                            task_title:
                              type: string
                              example: Fix Server Incident
                            action_type:
                              type: string
                              example: STATUS_CHANGED
                            field_name:
                              type: string
                              nullable: true
                              example: status_id
                            performer_name:
                              type: string
                              example: John Doe
                            created_at:
                              type: string
                              example: "2026-10-01 10:30:00"

  /v1/task-management/dashboard/summary:
    get:
      summary: Ringkasan Dashboard Task Management (v1 Alias)
      description: Alias versi v1 untuk endpoint /task-management/dashboard/summary.
      tags:
        - Task Management - Dashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dashboard summary berhasil diambil.

  /task-management/dashboard/team-view:
    get:
      summary: Team View - Monitor Tugas, Kapasitas & Progress per Karyawan
      description: |
        Menyajikan data Team View untuk memonitor beban kerja karyawan secara visual (seperti kartu Kanban / ClickUp Team View).
        Menampilkan ringkasan metrik (Total tasks, Not done, Done, Overdue, % Completion Rate, % Progress), multi-segment bar distribusi status (Ready, In Progress, Review, dll.), dan daftar tugas pada masing-masing status untuk mendukung visual workload balancing & drag-and-drop.
      tags:
        - Task Management - Dashboard
        - Task Management - Team View
      security:
        - BearerAuth: []
      parameters:
        - name: space_id
          in: query
          description: Filter ID Space / Departemen (misal IT, HRD, FIN)
          schema:
            type: string
            example: "IT"
        - name: department_id
          in: query
          description: Filter Kode atau ID Departemen
          schema:
            type: string
        - name: employee_id
          in: query
          description: Filter Karyawan spesifik
          schema:
            type: integer
        - name: search
          in: query
          description: Pencarian nama, NIK, atau email karyawan
          schema:
            type: string
        - name: include_tasks
          in: query
          description: Sertakan rincian objek tugas pada masing-masing status (default true)
          schema:
            type: boolean
            default: true
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Data Team View berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Team view data retrieved successfully
                  data:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          total_members:
                            type: integer
                            example: 5
                          total_tasks:
                            type: integer
                            example: 24
                          total_not_done:
                            type: integer
                            example: 16
                          total_done:
                            type: integer
                            example: 8
                          total_overdue:
                            type: integer
                            example: 2
                          overall_completion_rate:
                            type: number
                            format: float
                            example: 33.3
                          total_estimated_hours:
                            type: number
                            format: float
                            example: 48.0
                          total_tracked_hours:
                            type: number
                            format: float
                            example: 12.5
                      team:
                        type: array
                        items:
                          type: object
                          properties:
                            employee_id:
                              type: integer
                              example: 4
                            full_name:
                              type: string
                              example: "Claudia Maria"
                            nickname:
                              type: string
                              example: "Claudia"
                            nik:
                              type: string
                              example: "EMP-2026-0042"
                            avatar_url:
                              type: string
                              nullable: true
                              example: null
                            department:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1
                                dept_code:
                                  type: string
                                  example: "IT"
                                dept_name:
                                  type: string
                                  example: "Information Technology"
                            position:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1
                                position_code:
                                  type: string
                                  example: "STAFF"
                                position_name:
                                  type: string
                                  example: "Staff"
                            metrics:
                              type: object
                              properties:
                                total_tasks:
                                  type: integer
                                  example: 24
                                not_done_tasks:
                                  type: integer
                                  example: 16
                                done_tasks:
                                  type: integer
                                  example: 8
                                overdue_tasks:
                                  type: integer
                                  example: 2
                                completion_rate:
                                  type: number
                                  format: float
                                  example: 33.3
                                progress_percentage:
                                  type: number
                                  format: float
                                  example: 35.0
                                total_estimated_hours:
                                  type: number
                                  format: float
                                  example: 48.0
                                total_tracked_hours:
                                  type: number
                                  format: float
                                  example: 12.5
                            status_distribution:
                              type: array
                              items:
                                type: object
                                properties:
                                  status_id:
                                    type: integer
                                    example: 1
                                  status_name:
                                    type: string
                                    example: "Ready"
                                  status_category:
                                    type: string
                                    example: "TO_DO"
                                  color_hex:
                                    type: string
                                    example: "#22C55E"
                                  total_tasks:
                                    type: integer
                                    example: 8
                                  percentage:
                                    type: number
                                    format: float
                                    example: 33.3
                                  tasks:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          type: integer
                                          example: 101
                                        task_code:
                                          type: string
                                          example: "TSK-IT-2026-00001"
                                        title:
                                          type: string
                                          example: "Setup Infrastructure"
                                        priority:
                                          type: object
                                          properties:
                                            id:
                                              type: integer
                                              example: 1
                                            priority_name:
                                              type: string
                                              example: "Normal"
                                            color_hex:
                                              type: string
                                              example: "#3B82F6"
                                        due_date:
                                          type: string
                                          example: "2026-10-10 17:00"
                                        is_overdue:
                                          type: boolean
                                          example: false
                                        progress_percentage:
                                          type: integer
                                          example: 25

  /task-management/dashboard/team-view/{employeeId}:
    get:
      summary: Detail Card Team View untuk Satu Karyawan
      tags:
        - Task Management - Dashboard
        - Task Management - Team View
      security:
        - BearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Card Team View karyawan berhasil diambil.

  /task-management/team-view:
    get:
      summary: Team View (Direct Alias)
      tags:
        - Task Management - Team View
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Data Team View berhasil diambil.

  /task-management/tasks/{id}/reassign:
    post:
      summary: Reassign Tugas Antar Karyawan (Drag and Drop Support)
      description: Memindahkan atau memperbarui penugasan task dari satu karyawan ke karyawan lain (misalnya saat mendrag task antar kartu karyawan di Team View).
      tags:
        - Task Management - Tasks
        - Task Management - Team View
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID Tugas
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from_employee_id:
                  type: integer
                  description: ID karyawan asal yang akan dilepas dari task
                  example: 4
                to_employee_id:
                  type: integer
                  description: ID karyawan tujuan yang akan ditugaskan
                  example: 5
                assignee_ids:
                  type: array
                  items:
                    type: integer
                  description: Alternatif langsung menetapkan daftar ID seluruh assignee baru
                  example: [5]
      responses:
        '200':
          description: Tugas berhasil dipindahkan / di-reassign.
        '404':
          description: Tugas tidak ditemukan.

  /task-management/tasks:
    get:
      summary: Daftar Tugas (Tasks) & Filter Hirarki
      description: Mengambil daftar tugas dengan dukungan filter space_id, folder_id, list_id, assignee_id, status_id, status_category, search, dan pagination.
      tags:
        - Task Management - Tasks
      security:
        - BearerAuth: []
      parameters:
        - name: space_id
          in: query
          description: ID Space departemen
          schema:
            type: integer
        - name: folder_id
          in: query
          description: ID Folder project
          schema:
            type: integer
        - name: list_id
          in: query
          description: ID List
          schema:
            type: integer
        - name: assignee_id
          in: query
          description: ID Karyawan HRIS (hris_employees.id)
          schema:
            type: integer
        - name: status_id
          in: query
          description: ID status tugas
          schema:
            type: integer
        - name: status_category
          in: query
          description: Kategori status
          schema:
            type: string
            enum: [TO_DO, IN_PROGRESS, REVIEW, DONE, CANCELLED]
        - name: search
          in: query
          description: Pencarian teks judul, deskripsi, atau kode tugas
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Data list tugas berhasil diambil.
    post:
      summary: Buat Tugas Baru (Create Task / Subtask)
      description: Membuat tugas baru atau subtask dengan auto-generator task_code (format TSK-DEPT-YYYY-NNNNN) dan penugasan karyawan.
      tags:
        - Task Management - Tasks
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - space_id
                - list_id
                - title
              properties:
                space_id:
                  type: integer
                  example: 1
                list_id:
                  type: integer
                  example: 1
                folder_id:
                  type: integer
                  nullable: true
                  example: 1
                parent_task_id:
                  type: integer
                  nullable: true
                  description: Diisi ID parent task jika membuat subtask
                  example: null
                title:
                  type: string
                  example: "Implementasi Skema DB Corporate Task Management"
                description:
                  type: string
                  example: "Migrasi master data HRIS dan tabel ClickUp-like ke skema corporate"
                status_id:
                  type: integer
                  nullable: true
                  example: 1
                priority_id:
                  type: integer
                  nullable: true
                  example: 2
                task_type_id:
                  type: integer
                  nullable: true
                  example: 1
                due_date:
                  type: string
                  format: date-time
                  example: "2026-09-25 17:00:00"
                estimated_hours:
                  type: number
                  example: 8.5
                assignee_ids:
                  type: array
                  items:
                    type: integer
                  example: [1, 2]
      responses:
        '201':
          description: Tugas berhasil dibuat.

  /task-management/tasks/{id}:
    get:
      summary: Detail Lengkap Tugas (Task Detail)
      description: Mengambil detail tugas beserta checklists, assignees, subtasks, tags, attachments, comments, dan riwayat activity logs.
      tags:
        - Task Management - Tasks
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detail tugas berhasil diambil.
        '404':
          description: Tugas tidak ditemukan.
    put:
      summary: Perbarui Tugas (Update Task)
      description: Memperbarui data tugas dan otomatis mencatat perubahan pada activity logs audit trail.
      tags:
        - Task Management - Tasks
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                priority_id:
                  type: integer
                due_date:
                  type: string
                  format: date-time
                progress_percentage:
                  type: integer
                  minimum: 0
                  maximum: 100
                assignee_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Tugas berhasil diperbarui.
    delete:
      summary: Hapus Tugas (Soft Delete Task)
      tags:
        - Task Management - Tasks
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tugas berhasil dihapus.

  /task-management/tasks/{id}/status:
    post:
      summary: Transisi Status Tugas (Update Task Status)
      description: Mengubah status tugas, otomatis mengupdate progress / waktu selesai jika status tutup, dan mencatat histori log aktivitas.
      tags:
        - Task Management - Tasks
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status_id
              properties:
                status_id:
                  type: integer
                  example: 4
      responses:
        '200':
          description: Status tugas berhasil diubah.

  /task-management/tasks/metrics:
    get:
      summary: Metrik Ringkasan Tugas (Task Analytics & KPI)
      description: Agregasi jumlah total tugas, To Do, In Progress, Review, Done, Overdue, dan Completion Rate %.
      tags:
        - Task Management - Tasks
      security:
        - BearerAuth: []
      parameters:
        - name: space_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Metrik berhasil diambil.

  /task-management/workspaces:
    get:
      summary: Daftar Workspace Korporat
      tags:
        - Task Management - Hierarchy
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar workspace berhasil diambil.

  /task-management/spaces:
    get:
      summary: Daftar Space Departemen / Divisi
      tags:
        - Task Management - Hierarchy
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Daftar spaces berhasil diambil.
    post:
      summary: Buat Space Departemen Baru
      tags:
        - Task Management - Hierarchy
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - workspace_id
                - space_name
              properties:
                workspace_id:
                  type: integer
                department_id:
                  type: integer
                  nullable: true
                space_name:
                  type: string
                color_hex:
                  type: string
                  default: "#4F46E5"
                icon_name:
                  type: string
                  default: "folder"
                is_private:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Space berhasil dibuat.

  /task-management/folders:
    get:
      summary: Daftar Folder Project di Space
      tags:
        - Task Management - Hierarchy
      security:
        - BearerAuth: []
      parameters:
        - name: space_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Daftar folder berhasil diambil.
    post:
      summary: Buat Folder Project Baru
      tags:
        - Task Management - Hierarchy
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - space_id
                - folder_name
              properties:
                space_id:
                  type: integer
                folder_name:
                  type: string
                description:
                  type: string
                color_hex:
                  type: string
      responses:
        '201':
