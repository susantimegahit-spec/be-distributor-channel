  /v1/sales-orders/dashboard:
    get:
      summary: Get Sales Order Dashboard Summary
      description: Mendapatkan data ringkasan dashboard penjualan bulanan, volume, status order, tren harian, produk terlaris, dan distributor terbaik (hanya admin). Jika login sebagai distributor, otomatis difilter khusus untuk distributor tersebut.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sukses mendapatkan data statistik dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Statistik dashboard sales order berhasil diambil."
                  data:
                    type: object
                    properties:
                      sales_summary:
                        type: object
                        properties:
                          total_revenue_this_month:
                            type: number
                            example: 1500000.00
                          total_volume_kg_this_month:
                            type: number
                            example: 1000.5
                          total_orders_this_month:
                            type: integer
                            example: 15
                      order_statuses:
                        type: object
                        properties:
                          DRAFT:
                            type: integer
                            example: 0
                          CREATED:
                            type: integer
                            example: 2
                          WAITING_APPROVAL:
                            type: integer
                            example: 1
                          APPROVED:
                            type: integer
                            example: 5
                          DELIVERY:
                            type: integer
                            example: 3
                          ARRIVED:
                            type: integer
                            example: 20
                          REJECTED:
                            type: integer
                            example: 1
                          FAILED:
                            type: integer
                            example: 0
                      daily_sales_trend:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              example: "2026-07-06"
                            count:
                              type: integer
                              example: 3
                            total:
                              type: number
                              example: 300000.00
                      top_products:
                        type: array
                        items:
                          type: object
                          properties:
                            item_code:
                              type: string
                              example: "E65"
                            item_name:
                              type: string
                              example: "TOP 250 M @ 10 KG / BAL"
                            total_qty:
                              type: number
                              example: 50.0000
                      top_distributors:
                        type: array
                        description: Hanya dikembalikan jika diakses oleh Admin.
                        items:
                          type: object
                          properties:
                            distributor_id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: "PT XYZ"
                            total_spent:
                              type: number
                              example: 150000.00
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sales-orders/check-eta:
    get:
      summary: Cek sales order berdasarkan tanggal ETA
      description: Mendapatkan daftar sales order dengan kondisi tanggal ETA lebih cepat dari tanggal request ETA yang dikirimkan.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: customer_code
          in: query
          required: false
          schema:
            type: string
          description: Kode customer (CardCode) untuk memfilter data. Jika kosong, data semua customer akan diambil.
          example: C110003074
        - name: eta_date_request
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Tanggal batas request ETA (YYYY-MM-DD). Data SO yang memiliki eta_date < eta_date_request akan diambil.
          example: "2026-03-06"
      responses:
        '200':
          description: Daftar sales order berdasarkan cek ETA berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderListResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

