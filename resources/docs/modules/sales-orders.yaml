      summary: List all sales orders
      description: Mendapatkan daftar semua sales order. Jika diakses oleh user distributor, hanya menampilkan sales order miliknya.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter berdasarkan status order
        - name: card_code
          in: query
          required: false
          schema:
            type: string
          description: Filter berdasarkan kode customer (CardCode)
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
