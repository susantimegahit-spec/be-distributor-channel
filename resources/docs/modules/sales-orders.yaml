        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create Sales Order Draft or Direct Submit
      description: Membuat draft sales order baru. Jika parameter 'action' diisi 'submit', Sales Order akan langsung dibuat dan dikirim ke OM.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderDraftUpdateRequest'
      responses:
        '200':
          description: Sales order berhasil dibuat (sebagai draft atau langsung terkirim)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '403':
          description: Hak akses ditolak (hanya untuk distributor)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validasi input gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sales-orders/{id}:
    get:
      summary: Get sales order detail
      description: Mendapatkan detail satu sales order beserta detail itemnya berdasarkan ID.
