          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update Sales Order or Process Workflow Action
      description: Memperbarui draft sales order atau menjalankan aksi alur persetujuan (submit, approve, reject) tergantung pada parameter request body.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSalesOrderRequest'
      responses:
        '200':
          description: Draft sales order berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '404':
          description: Sales order tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validasi gagal atau status bukan DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete draft sales order
      description: Menghapus draft sales order (hanya diperbolehkan jika status order masih DRAFT).
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order
      responses:
        '200':
          description: Draft sales order berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '404':
          description: Sales order tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Gagal menghapus karena status bukan DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sales-orders/{id}/post-sap:
    post:
      summary: Post sales order to SAP
      description: Mengintegrasikan/mengirim data sales order yang disetujui ke SAP Business One.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order yang ingin dikirim ke SAP
      responses:
        '200':
          description: Sales order berhasil dikirim ke SAP
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Sales order berhasil dikirim ke SAP.
                  data:
                    type: object
                    properties:
                      ErrorCode:
                        type: integer
                        example: 0
                      Message:
                        type: string
                        example: Sales Order added successfully
                      Result:
                        type: array
                        items:
                          type: object
                          properties:
                            DocEntry:
                              type: integer
                              example: 9999
                            DocNum:
                              type: string
                              example: SO9999
        '400':
          description: Gagal mengintegrasikan sales order ke SAP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sales-orders/{id}/sync-sap:
    post:
      summary: Sync SAP status of a specific sales order
      description: Mensinkronisasikan status pengiriman (Delivery) dan pembayaran dari SAP Business One ke database lokal.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order yang ingin disinkronisasi
      responses:
        '200':
          description: SAP status synchronized successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: SAP status synchronized successfully.
                  data:
                    $ref: '#/components/schemas/SalesOrder'
        '400':
          description: Gagal sinkronisasi status SAP (misal data SO tidak ditemukan di SAP, atau belum terintegrasi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sales-orders/{id}/arrive:
    post:
      summary: Mark sales order as arrived (order completed)
      description: Mengubah status sales order dari DELIVERY menjadi ARRIVED secara manual oleh distributor (pesanan selesai).
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order yang ingin diubah statusnya menjadi ARRIVED
      responses:
        '200':
          description: Order status marked as arrived successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Order status marked as arrived successfully.
                  data:
                    $ref: '#/components/schemas/SalesOrder'
        '400':
          description: Gagal mengubah status (misal status order bukan DELIVERY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sales-orders/{id}/cancel:
    post:
      summary: Cancel Sales Order (sync to SAP B1)
      description: Membatalkan Sales Order yang sudah di-approve finance (memiliki sap_doc_num) dan belum berstatus DELIVERY/ARRIVED. Mengirim request CancelSO ke SAP dan mengubah status lokal menjadi CANCELLED.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order yang ingin dibatalkan
      responses:
        '200':
          description: Sales Order berhasil dibatalkan dan disinkronisasikan ke SAP B1.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Sales Order berhasil dibatalkan dan disinkronisasikan ke SAP.
                  data:
                    $ref: '#/components/schemas/SalesOrder'
        '400':
          description: Pembatalan gagal karena melanggar aturan bisnis atau error dari API SAP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sales-orders/sync-all:
    post:
      summary: Batch sync all pending Sales Orders status from SAP
      description: Mensinkronisasikan status pengiriman (Delivery) dan pembayaran dari SAP Business One secara masal untuk semua Sales Order dari 1 bulan ke belakang yang sudah memiliki sap_doc_num dan belum berstatus Closed.
      tags:
        - Sales Orders
      responses:
        '200':
          description: Batch status synchronization completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Batch status synchronization completed.
                  data:
                    type: object
                    properties:
                      updated_count:
                        type: integer
                        example: 5
        '400':
          description: Gagal melakukan sinkronisasi batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sales-orders/{id}/submit:
    post:
      summary: Submit sales order to OM
      description: Mengirim draft sales order ke level persetujuan selanjutnya (OM). Mengubah status menjadi WAITING_OM.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order
      responses:
        '200':
          description: Sales order berhasil disubmit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '400':
          description: Gagal memproses persetujuan (status tidak sesuai atau validasi gagal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sales-orders/{id}/approve:
    post:
      summary: Approve sales order
      description: Menyetujui sales order ke level persetujuan berikutnya. Bisa ditambahkan catatan (notes) opsional.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  example: "Disetujui"
      responses:
        '200':
          description: Sales order berhasil disetujui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '400':
          description: Gagal memproses persetujuan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sales-orders/{id}/reject:
    post:
      summary: Reject sales order
      description: Menolak sales order dan mengembalikannya ke Distributor (DRAFT). Memerlukan alasan penolakan (notes).
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - notes
              properties:
                notes:
                  type: string
                  example: "Harga/jumlah tidak sesuai"
      responses:
        '200':
          description: Sales order berhasil ditolak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '400':
          description: Gagal memproses penolakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sales-orders/{id}/save-discounts:
    post:
      summary: Save discounts (Admin Sales)
      description: Mengisi diskon untuk item-item dalam sales order. Hanya bisa diakses oleh Admin Sales saat status order WAITING_ADMIN_SALES.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_discount:
                  type: string
                  example: "260310699"
                lines:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: integer
                        description: ID line item detail
                        example: 1
                      disc_1:
                        type: number
                        example: 5.0
                      disc_2:
                        type: number
                        example: 2.5
                      disc_3:
                        type: number
                        example: 0
                      price_after_disc:
                        type: number
                        example: 118275
      responses:
        '200':
          description: Diskon berhasil disimpan dan status diteruskan ke Finance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '400':
          description: Gagal menyimpan diskon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sales-orders/{id}/email-action:
    get:
      summary: Email quick action (ASM)
      description: Endpoint publik bertanda tangan (signed URL) untuk persetujuan cepat oleh ASM dari email. Menerima query parameter action (approve/reject) dan memproses persetujuan langsung atau menampilkan formulir penolakan HTML.
      tags:
        - Sales Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [approve, reject]
          description: Aksi persetujuan (approve atau reject)
        - name: user_id
          in: query
          required: true
          schema:
            type: integer
          description: ID User ASM yang menyetujui
        - name: signature
          in: query
          required: true
          schema:
            type: string
          description: Hash tanda tangan URL Laravel
        - name: expires
          in: query
          required: true
          schema:
            type: integer
          description: Timestamp kedaluwarsa tautan
      responses:
        '200':
          description: Mengembalikan halaman HTML berisi status persetujuan sukses atau form penolakan
          content:
            text/html:
              schema:
                type: string
        '401':
          description: Tautan kedaluwarsa atau signature tidak valid
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Sales order tidak ditemukan
          content:
            text/html:
              schema:
                type: string

  /v1/sales-orders/{id}/email-reject:
    post:
      summary: Email quick reject submit (ASM)
      description: Endpoint publik bertanda tangan (signed URL) untuk submit alasan penolakan (notes) dari form email ASM.
      tags:
        - Sales Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - user_id
                - notes
              properties:
                user_id:
                  type: integer
                  description: ID User ASM
                notes:
                  type: string
                  description: Alasan penolakan
      responses:
        '200':
          description: Mengembalikan halaman HTML berisi status penolakan sukses
          content:
            text/html:
              schema:
                type: string
        '401':
          description: Tautan kedaluwarsa atau signature tidak valid
          content:
            text/html:
              schema:
                type: string

