  /v1/master-approvals/by-owner:
    get:
      summary: Get Owner / My Document Approval List from SAP
      description: |
        Mengambil daftar dokumen yang diajukan oleh pembuat dokumen (Originator/Owner) beserta status persetujuan dari SAP Business One (`/api/GetListByOwnerId`).
        Urutan alur approval: `Pending -> Approved -> Generated`.
        - `Pending`: Status SAP `W`.
        - `Approved`: Status SAP `Y` DAN (`DocEntry == 0` atau null atau kosong) (disetujui, belum generate dokumen final definitif di SAP).
        - `Generated`: Status SAP `Y` DAN `DocEntry > 0` (dokumen transaksi final definitif telah berhasil digenerate di SAP).
      tags:
        - SAP - Master Approval
      security:
        - BearerAuth: []
      parameters:
        - name: CustomQuery
          in: query
          description: ID Originator query SAP (opsional, otomatis menggunakan originator user login jika tidak diisi)
          schema:
            type: integer
            example: 62
        - name: UserId
          in: query
          description: User ID SAP (opsional)
          schema:
            type: string
            example: "3"
        - name: ObjectCode
          in: query
          description: Object code dokumen SAP (opsional, contoh 1470000113)
          schema:
            type: string
            example: "1470000113"
        - name: From
          in: query
          description: Tanggal mulai (YYYYMMDD atau YYYY-MM-DD, opsional)
          schema:
            type: string
            example: "20251201"
        - name: To
          in: query
          description: Tanggal akhir (YYYYMMDD atau YYYY-MM-DD, opsional)
          schema:
            type: string
            example: "20261231"
        - name: Status
          in: query
          description: Filter status persetujuan (W, Y, N, C, G, Pending, Approved, Generated, dsb)
          schema:
            type: string
            example: "Y"
        - name: page
          in: query
          description: Nomor halaman data (opsional, pagination)
          schema:
            type: integer
            default: 1
            example: 1
        - name: per_page
          in: query
          description: Jumlah data per halaman (opsional, pagination)
          schema:
            type: integer
            default: 15
            example: 10
        - name: refresh
          in: query
          description: Set true untuk force refresh mengambil data terbaru dari SAP
          schema:
            type: boolean
            default: false
            example: false
      responses:
        '200':
          description: Owner document approval list retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Owner document approval list retrieved successfully.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        WddCode:
                          type: string
                          example: "7689"
                        DocEntry:
                          type: string
                          example: "5339"
                        DraftEntry:
                          type: string
                          example: "679"
                        DraftNum:
                          type: string
                          example: "260140084"
                        DocNum:
                          type: string
                          example: "260140087"
                        ObjType:
                          type: string
                          example: "1470000113"
                        DocDate:
                          type: string
                          example: "20260810"
                        CurrStep:
                          type: string
                          example: "4"
                        Status:
                          type: string
                          example: "Generated"
                        raw_status:
                          type: string
                          example: "G"
                        StatusCode:
                          type: string
                          example: "G"
                        StatusDescription:
                          type: string
                          example: "Generated"
                        Name:
                          type: string
                          description: Nama tahapan persetujuan dari getstages
                          example: "Production Mng. SBY"
                        Remarks:
                          type: string
                          description: Keterangan tahapan persetujuan dari getstages
                          example: "Production Manager Surabaya"
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 5
                      per_page:
                        type: integer
                        example: 10
                      total:
                        type: integer
                        example: 48
                      from:
                        type: integer
                        example: 1
                      to:
                        type: integer
                        example: 10
    post:
      summary: Get Owner / My Document Approval List from SAP (POST Method)
      description: Mengambil daftar dokumen yang diajukan oleh pembuat dokumen (Originator/Owner) melalui POST request payload.
      tags:
        - SAP - Master Approval
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                CustomQuery:
                  type: integer
                  example: 62
                UserId:
                  type: string
                  example: "3"
                ObjectCode:
                  type: string
                  example: "1470000113"
                From:
                  type: string
                  example: "20251201"
                To:
                  type: string
                  example: "20261231"
                Status:
                  type: string
                  description: Filter status persetujuan (W, Y, N, C, G, Pending, Approved, Generated, dsb)
                  example: "Y"
                page:
                  type: integer
                  example: 1
                per_page:
                  type: integer
                  example: 10
                refresh:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Owner document approval list retrieved successfully.

  /v1/master-approvals/detail-by-object:
    get:
      summary: Get Document Approval Detail by Object Code from SAP
      description: |
        Mengambil detail dokumen transaksi persetujuan dari SAP Business One (`/api/GetDetailByObjectCode`) berdasarkan DocEntry dan ObjectCode.
        Parameter `Status` mendukung pencarian draft (`"W"`) maupun approved/final (`"Y"`), dengan fitur auto-fallback ke draft (`"W"`) jika status tidak dikirim.
        Jika data kosong atau tidak ditemukan di SAP, backend mengembalikan `{"success": false, "message": "Data not found."}` tanpa field `data`.
      tags:
        - SAP - Master Approval
      security:
        - BearerAuth: []
      parameters:
        - name: CustomQuery
          in: query
          required: true
          description: DocEntry dokumen transaksi
          schema:
            type: integer
            example: 180
        - name: ObjectCode
          in: query
          required: false
          description: Object code tipe dokumen SAP (opsional)
          schema:
            type: string
            example: "1470000113"
        - name: Status
          in: query
          required: false
          description: Status persetujuan dokumen SAP (contoh "Y", "W", "N", "C", "G", atau "APPROVED", "PENDING", "GENERATED", dll.)
          schema:
            type: string
            example: "Y"
        - name: page
          in: query
          description: Nomor halaman pagination untuk baris item transaksi (opsional)
          schema:
            type: integer
            default: 1
            example: 1
        - name: per_page
          in: query
          description: Jumlah baris item transaksi per halaman (opsional)
          schema:
            type: integer
            default: 15
            example: 10
        - name: refresh
          in: query
          description: Force refresh cache SAP
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Document approval detail retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Document approval detail retrieved successfully.
                  data:
                    type: object
                    properties:
                      header:
                        type: object
                        nullable: true
                        properties:
                          Series:
                            type: string
                            example: "6486"
                          SeriesName:
                            type: string
                            example: "GSK26-01"
                          DocEntry:
                            type: string
                            example: "180"
                          DocNum:
                            type: string
                            example: "260140032"
                          DocDate:
                            type: string
                            example: "20260112"
                          TaxDate:
                            type: string
                            example: "20260112"
                          U_Shift:
                            type: string
                            example: ""
                          U_Unit:
                            type: string
                            example: ""
                          JrnlMemo:
                            type: string
                            example: ""
                          Comments:
                            type: string
                            example: "UNTUK FITTING PIPING OUTDOOR UNIT 2 GRESIK"
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            DocEntry:
                              type: string
                              example: "180"
                            LineNum:
                              type: string
                              example: "0"
                            ItemCode:
                              type: string
                              example: "JS000013"
                            ItemName:
                              type: string
                              example: "BOLT NUT M20X90MM SS304"
                            Quantity:
                              type: string
                              example: "120.000000"
                            WhsCode:
                              type: string
                              example: "SPR04"
                            WhsName:
                              type: string
                              example: "GUDANG SPAREPART - GRESIK"
                            Uom:
                              type: string
                              example: "PCS"
                            OcrCode:
                              type: string
                              example: "GSK"
                            OcrCode2:
                              type: string
                              example: "GRM"
                            OcrCode3:
                              type: string
                              example: "PRO"
    post:
      summary: Get Document Approval Detail by Object Code from SAP (POST Method)
      description: Mengambil detail dokumen transaksi persetujuan dari SAP Business One melalui POST request payload.
      tags:
        - SAP - Master Approval
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - CustomQuery
              properties:
                CustomQuery:
                  type: integer
                  example: 180
                ObjectCode:
                  type: string
                  example: "1470000113"
                Status:
                  type: string
                  description: Status persetujuan dokumen SAP (contoh "Y", "W", "N", "C", atau "APPROVED")
                  example: "Y"
                page:
                  type: integer
                  example: 1
                per_page:
                  type: integer
                  example: 15
                refresh:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Document approval detail retrieved successfully.

  /v1/dashboard-layouts/me:
    get:
      summary: Mengambil Layout Dashboard Pengguna Aktif
      description: |
        Mengambil konfigurasi tata letak widget dashboard berdasarkan role pengguna yang sedang login.
        Jika role pengguna belum memiliki konfigurasi kustom, backend mengembalikan konfigurasi default kosong dengan HTTP 200 (bukan 404).
      tags:
        - Dashboard - Builder
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Konfigurasi layout dashboard berhasil diambil atau default layout kosong.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Dashboard layout retrieved successfully"
                  data:
                    type: object
                    properties:
                      role_id:
                        type: integer
                        example: 5
                      version:
                        type: integer
                        example: 3
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            row:
                              type: integer
                              example: 1
                            columns:
                              type: integer
                              example: 3
                      widgets:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: "customer-orders"
                            sort:
                              type: integer
                              example: 1
                            row:
                              type: integer
                              example: 1
                            column:
                              type: integer
                              example: 1
                            span:
                              type: integer
                              example: 1
                            properties:
                              type: object
                              nullable: true
                              example: null
                      updated_at:
                        type: string
                        format: date-time
                        nullable: true
                        example: "2026-09-25T10:30:00+07:00"
        '401':
          description: Unauthenticated.

  /v1/dashboard-layouts/roles/{roleId}:
    get:
      summary: Mengambil Layout Dashboard Berdasarkan Role
      description: |
        Mengambil konfigurasi tata letak widget dashboard untuk suatu role tertentu.
        Hanya dapat diakses oleh Administrator.
      tags:
        - Dashboard - Builder
      security:
        - BearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          description: ID role sistem
          schema:
            type: integer
          example: 5
      responses:
        '200':
          description: Konfigurasi layout dashboard role berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Dashboard layout retrieved successfully"
                  data:
                    type: object
        '403':
          description: Akses ditolak. Hanya administrator yang dapat mengakses.
        '404':
          description: Role ID tidak ditemukan.

    put:
      summary: Menyimpan / Update Layout Dashboard Berdasarkan Role (Upsert & Optimistic Locking)
      description: |
        Menyimpan atau memperbarui konfigurasi baris, kolom, dan widget dashboard untuk role tertentu.
        Mendukung optimistic locking melalui field version. Jika version request tidak cocok dengan versi di database, mengembalikan HTTP 409 Conflict.
        Hanya dapat diakses oleh Administrator.
      tags:
        - Dashboard - Builder
      security:
        - BearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          description: ID role sistem
          schema:
            type: integer
          example: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - rows
                - widgets
              properties:
                version:
                  type: integer
                  description: Versi konfigurasi terakhir yang diketahui frontend
                  example: 3
                rows:
                  type: array
                  description: Pengaturan baris dan jumlah kolom (1-3 kolom per baris, 1-10 baris)
                  items:
                    type: object
                    required:
                      - row
                      - columns
                    properties:
                      row:
                        type: integer
                        example: 1
                      columns:
                        type: integer
                        example: 3
                widgets:
                  type: array
                  description: Daftar penempatan widget pada baris dan kolom
                  items:
                    type: object
                    required:
                      - id
                      - sort
                      - row
                      - column
                      - span
                    properties:
                      id:
                        type: string
                        example: "customer-orders"
                      sort:
                        type: integer
                        example: 1
                      row:
                        type: integer
                        example: 1
                      column:
                        type: integer
                        example: 1
                      span:
                        type: integer
                        example: 1
                      properties:
                        type: object
                        nullable: true
                        example: null
            example:
              version: 3
              rows:
                - row: 1
                  columns: 3
                - row: 2
                  columns: 2
              widgets:
                - id: "customer-orders"
                  sort: 1
                  row: 1
                  column: 1
                  span: 1
                - id: "order-ready"
                  sort: 2
                  row: 2
                  column: 1
                  span: 2
      responses:
        '200':
          description: Dashboard layout berhasil disimpan dan versi baru dihasilkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Dashboard layout saved successfully"
                  data:
                    type: object
        '403':
          description: Akses ditolak.
        '409':
          description: Version conflict. Telah diperbarui oleh pengguna lain.
        '422':
          description: Validasi layout gagal (melebihi span kolom, baris tidak urut, dsb).

    delete:
      summary: Mereset / Menghapus Layout Dashboard Role
      description: |
        Menghapus konfigurasi kustom layout dashboard untuk role tertentu sehingga kembali ke kondisi default.
        Hanya dapat diakses oleh Administrator.
      tags:
        - Dashboard - Builder
      security:
        - BearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          description: ID role sistem
          schema:
            type: integer
          example: 5
      responses:
        '200':
          description: Dashboard layout berhasil direset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Dashboard layout reset successfully"
                  data:
                    type: string
                    nullable: true
        '403':
          description: Akses ditolak.
        '404':
          description: Role ID tidak ditemukan.


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
