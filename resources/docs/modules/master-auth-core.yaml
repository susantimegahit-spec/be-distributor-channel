              type: object
              required:
                - WhsCode
              properties:
                CustomQuery:
                  type: string
                  example: "'B12.B','B26'"
                  description: String query kode item dengan kutip tunggal (contoh "'B12.B','B26'") atau array item_codes
                item_codes:
                  type: array
                  items:
                    type: string
                  example: ["B12.B", "B26"]
                  description: Alternatif input berupa array kode item (backend otomatis memformat ke CustomQuery)
                WhsCode:
                  type: string
                  example: "'FG01'"
                  description: Kode gudang SAP (contoh "'FG01'" atau "FG01", backend otomatis membungkus tanda petik untuk SAP)
      responses:
        '200':
          description: Data stok item di gudang berhasil diambil dari SAP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Data stok item di gudang berhasil diambil dari SAP.
                  data:
                    type: object
                    properties:
                      whs_code:
                        type: string
                        example: "'FG01'"
                      custom_query:
                        type: string
                        example: "'B12.B','B26'"
                      total_items:
                        type: integer
                        example: 2
                      items:
                        type: array
                        items:
                          type: object

