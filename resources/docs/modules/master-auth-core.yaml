openapi: 3.0.3
info:
  title: "SMESTA API - Modul Auth, Users, Roles, Master Data, Warehouse & Approval"
  description: |
    Dokumentasi API Modular SMESTA (Bagian dari `resources/docs/openapi.yaml`).
    Edit file ini secara langsung agar ringan di IDE, lalu jalankan `php artisan docs:openapi bundle` untuk menyatukan kembali ke `openapi.yaml`.
  version: 1.0.0
servers:
  - url: https://api-sm-connect.susantimegah.com/api/distributor-channel
    description: Production Server
  - url: http://api-dev.susantimegah.com/api/distributor-channel
    description: Development Server
  - url: http://localhost:8000/api/distributor-channel
    description: Local Server
paths:
  /v1/notifications/telegram/test:
    post:
      summary: Kirim Test Notifikasi Telegram Bot
      description: Mengirim pesan notifikasi pengujian langsung ke channel atau akun Telegram yang telah dikonfigurasi.
      tags:
        - Notifications
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Test Notifikasi Telegram
                  description: Judul notifikasi
                message:
                  type: string
                  example: Halo! Ini adalah notifikasi pengujian Telegram Bot dari API SMESTA.
                  description: Isi pesan notifikasi
                level:
                  type: string
                  enum: [info, success, warning, error, danger, critical]
                  example: info
                  description: Level alert notifikasi
                chat_id:
                  type: string
                  example: "123456789"
                  description: Target chat ID khusus (opsional, jika tidak diisi akan menggunakan TELEGRAM_CHAT_ID)
      responses:
        '200':
          description: Notifikasi Telegram berhasil dikirim.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Notifikasi Telegram berhasil dikirim.
                  data:
                    type: object
        '400':
          description: Bot belum dikonfigurasi atau pengiriman gagal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  status_code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: TELEGRAM_BOT_TOKEN belum dikonfigurasi di .env
  /v1/notifications/telegram/connect-link:
    get:
      summary: Buat Link 1-Klik Hubungkan Telegram
      description: Menghasilkan link deep-linking unik (t.me/bot?start=...) yang ketika dibuka dan ditekan Start oleh pengguna di Telegram, akan otomatis mendaftarkan Chat ID pengguna ke database.
      tags:
        - Notifications
      security:
        - BearerAuth: []
      parameters:
        - name: label
          in: query
          required: false
          schema:
            type: string
          description: Label nama penerima (misal "HP Budi (Teknisi 1)" atau "Grup").
      responses:
        '200':
          description: Link koneksi berhasil dibuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Link koneksi Telegram berhasil dibuat.
                  data:
                    type: object
                    properties:
                      bot_username:
                        type: string
                        example: smesta_notif_bot
                      token:
                        type: string
                        example: conn_aBcDeFg123456
                      connect_url:
                        type: string
                        example: https://t.me/smesta_notif_bot?start=conn_aBcDeFg123456
                      expires_in_minutes:
                        type: integer
                        example: 30
  /v1/notifications/telegram/recipients:
    get:
      summary: Daftar Penerima Telegram Akun Saya
      description: Mengambil seluruh Chat ID Telegram (pribadi maupun grup) yang terhubung ke akun yang sedang login.
      tags:
        - Notifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar penerima Telegram berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Daftar penerima Telegram berhasil diambil.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        user_id:
                          type: integer
                          example: 5
                        telegram_chat_id:
                          type: string
                          example: "8892855927"
                        recipient_name:
                          type: string
                          example: Budi (Teknisi 1)
                        chat_type:
                          type: string
                          example: private
                        is_active:
                          type: boolean
                          example: true
    post:
      summary: Daftarkan Chat ID Telegram ke Akun
      description: Menambahkan Chat ID Telegram (pribadi atau grup) ke akun pengguna saat ini agar bisa menerima notifikasi.
      tags:
        - Notifications
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - telegram_chat_id
              properties:
                telegram_chat_id:
                  type: string
                  example: "8892855927"
                  description: Chat ID dari bot (user pribadi atau grup)
                recipient_name:
                  type: string
                  example: Budi (Teknisi 1)
                  description: Label nama pemegang atau nama grup
                chat_type:
                  type: string
                  enum: [private, group, supergroup, channel]
                  example: private
                is_active:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Penerima Telegram berhasil didaftarkan.
  /v1/notifications/telegram/recipients/{id}:
    delete:
      summary: Hapus Penerima Telegram
      description: Menghapus Chat ID Telegram yang terdaftar dari akun pengguna saat ini.
      tags:
        - Notifications
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID relasi penerima Telegram
      responses:
        '200':
          description: Penerima Telegram berhasil dihapus.
  /v1/telegram/webhook:
    post:
      summary: Webhook Receiver Telegram Bot API
      description: Endpoint publik yang dipanggil langsung oleh Telegram Bot API saat ada interaksi pengguna (misal klik Start via Link Koneksi).
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload update dari Telegram Bot API
      responses:
        '200':
          description: Update berhasil diproses.
  /v1/master-units:
    get:
      summary: Daftar Master Unit
      description: Mengambil daftar seluruh master unit (pabrik/organisasi) dengan dukungan pencarian dan pagination.
      tags:
        - Master Units
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Kata kunci pencarian berdasarkan unit_code, unit_name, atau description.
        - name: status
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: Filter status aktif (1) atau non-aktif (0). String "1" / "0" juga didukung.
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
          description: Jumlah item per halaman (jika ingin pagination).
      responses:
        '200':
          description: Daftar master unit berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar master unit berhasil diambil.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        unit_code:
                          type: string
                          example: "UNIT1"
                        unit_name:
                          type: string
                          example: "Unit Produksi Garam 1"
                        description:
                          type: string
                          example: "Pabrik garam unit 1 Manyar Gresik"
                        status:
                          type: integer
                          example: 1
                        warehouses_count:
                          type: integer
                          example: 3
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
    post:
      summary: Buat Master Unit Baru
      description: Menambahkan master unit baru ke dalam sistem.
      tags:
        - Master Units
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - unit_code
                - unit_name
              properties:
                unit_code:
                  type: string
                  maxLength: 50
                  example: "UNIT1"
                unit_name:
                  type: string
                  maxLength: 255
                  example: "Unit Produksi Garam 1"
                description:
                  type: string
                  example: "Pabrik garam unit 1 Manyar Gresik"
                status:
                  type: integer
                  enum: [0, 1]
                  default: 1
                  example: 1
                  description: 1 = Aktif, 0 = Tidak Aktif (Menerima integer 1/0 maupun string "1"/"0").
      responses:
        '201':
          description: Master unit berhasil dibuat.
        '422':
          description: Validasi gagal (misal kode unit duplikat).

  /v1/master-units/{id}:
    get:
      summary: Detail Master Unit
      description: Mengambil informasi detail master unit beserta daftar warehouse yang terhubung.
      tags:
        - Master Units
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID Master Unit.
      responses:
        '200':
          description: Detail master unit berhasil diambil.
        '404':
          description: Master unit tidak ditemukan.
    put:
      summary: Update Master Unit
      description: Memperbarui data master unit.
      tags:
        - Master Units
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID Master Unit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unit_code:
                  type: string
                  maxLength: 50
                  example: "UNIT1"
                unit_name:
                  type: string
                  maxLength: 255
                  example: "Unit Produksi Garam 1 - Revisi"
                description:
                  type: string
                  example: "Updated description"
                status:
                  type: integer
                  enum: [0, 1]
                  example: 1
                  description: 1 = Aktif, 0 = Tidak Aktif (Menerima integer 1/0 maupun string "1"/"0").
      responses:
        '200':
          description: Master unit berhasil diperbarui.
        '404':
          description: Master unit tidak ditemukan.
    delete:
      summary: Hapus Master Unit
      description: Menghapus data master unit dari sistem.
      tags:
        - Master Units
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID Master Unit.
      responses:
        '200':
          description: Master unit berhasil dihapus.
        '404':
          description: Master unit tidak ditemukan.

  /v1/warehouses:
    get:
      summary: Daftar Master Gudang (Warehouse)
      description: Mengambil daftar master warehouse lengkap dengan data relasi master unit yang terhubung.
      tags:
        - Master Warehouses
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Pencarian berdasarkan whs_code, whs_name, unit_code, atau unit_name.
        - name: master_unit_id
          in: query
          required: false
          schema:
            type: string
          description: Filter gudang berdasarkan Unit Code / Unit ID tertentu.
        - name: unit_code
          in: query
          required: false
          schema:
            type: string
          description: Filter gudang berdasarkan unit_code tertentu.
        - name: status
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: Filter status aktif (1) atau non-aktif (0).
      responses:
        '200':
          description: Daftar master gudang berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar master gudang berhasil diambil.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        whs_code:
                          type: string
                          example: "PRD01-01"
                        whs_name:
                          type: string
                          example: "Gudang Produksi Manyar"
                        master_unit_id:
                          type: string
                          nullable: true
                          example: "UNIT1"
                        unit_code:
                          type: string
                          nullable: true
                          example: "UNIT1"
                        unit_name:
                          type: string
                          nullable: true
                          example: "Unit Produksi Garam 1"
                        status:
                          type: integer
                          example: 1
                        unit:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: integer
                              example: 1
                            unit_code:
                              type: string
                              example: "UNIT1"
                            unit_name:
                              type: string
                              example: "Unit Produksi Garam 1"
    post:
      summary: Tambah Master Gudang Manual
      description: Menambahkan master gudang secara manual beserta penentuan unitnya.
      tags:
        - Master Warehouses
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - whs_code
                - whs_name
              properties:
                whs_code:
                  type: string
                  maxLength: 50
                  example: "WHS-NEW-01"
                whs_name:
                  type: string
                  maxLength: 255
                  example: "Gudang Tambahan Baru"
                master_unit_id:
                  type: string
                  nullable: true
                  example: "UNIT1"
                status:
                  type: integer
                  enum: [0, 1]
                  default: 1
                  example: 1
                  description: 1 = Aktif, 0 = Tidak Aktif (Menerima integer 1/0 maupun string "1"/"0").
      responses:
        '201':
          description: Data master gudang berhasil ditambahkan.

  /v1/warehouses/{id}:
    get:
      summary: Detail Master Gudang
      description: Mengambil data detail master gudang beserta objek unit yang terhubung.
      tags:
        - Master Warehouses
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID Master Warehouse.
      responses:
        '200':
          description: Detail master gudang berhasil diambil.
        '404':
          description: Data gudang tidak ditemukan.
    put:
      summary: Edit / Assign Unit Master Gudang
      description: Memperbarui data master gudang termasuk menghubungkan atau mengganti master_unit_id.
      tags:
        - Master Warehouses
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID Master Warehouse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                whs_code:
                  type: string
                  example: "PRD01-01"
                whs_name:
                  type: string
                  example: "Gudang Produksi Manyar Unit 1"
                master_unit_id:
                  type: string
                  nullable: true
                  example: "UNIT1"
                  description: Unit Code (atau ID) dari master unit yang dipilih di form master warehouse.
                status:
                  type: integer
                  enum: [0, 1]
                  example: 1
                  description: 1 = Aktif, 0 = Tidak Aktif (Menerima integer 1/0 maupun string "1"/"0").
      responses:
        '200':
          description: Data master gudang berhasil diperbarui.
        '404':
          description: Data gudang tidak ditemukan.
    delete:
      summary: Hapus Master Gudang
      description: Menghapus data master gudang.
      tags:
        - Master Warehouses
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID Master Warehouse.
      responses:
        '200':
          description: Data master gudang berhasil dihapus.
        '404':
          description: Data gudang tidak ditemukan.

  /v1/warehouses/sync:
    post:
      summary: Sinkronisasi Master Gudang Dari SAP
      description: Mengambil dan menyinkronkan seluruh daftar gudang dari SAP B1. Relasi master_unit_id yang sudah di-assign sebelumnya akan tetap dipertahankan.
      tags:
        - Master Warehouses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Data master gudang berhasil disinkronisasi dari SAP.

  /v1/document-approval/approvals:
    get:
      summary: Get List of Approval Transactions
      description: Mengambil daftar transaksi persetujuan dokumen dengan filter status, tipe dokumen, dan pencarian nomor dokumen SAP / pemohon.
      tags:
        - Dynamic Document Approval (SAP B1)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, REVISED]
          example: "PENDING"
        - name: type_code
          in: query
          required: false
          schema:
            type: string
          example: "PO"
        - name: search
          in: query
          required: false
          schema:
            type: string
          example: "PO-50001"
        - name: page
          in: query
          required: false
          schema:
            type: integer
          example: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
          example: 15
      responses:
        '200':
          description: Berhasil mengambil daftar persetujuan dokumen

  /v1/document-approval/approvals/{id}:
    get:
      summary: Get Dynamic Approval Detail (Mobile & Web)
      description: Mengambil detail dokumen approval lengkap yang telah dinormalisasi secara dinamis (Header, Line Items, Summary Totals, & Riwayat Approval Audit Trail).
      tags:
        - Dynamic Document Approval (SAP B1)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Berhasil mengambil detail dinamis dokumen approval
        '404':
          description: Data approval tidak ditemukan

  /v1/document-approval/approvals/{id}/approve:
    post:
      summary: Approve Document
      description: Menyetujui dokumen ke stage/level persetujuan selanjutnya atau status akhir APPROVED.
      tags:
        - Dynamic Document Approval (SAP B1)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  example: "Disetujui sesuai kuota budget Q3"
      responses:
        '200':
          description: Dokumen berhasil disetujui

  /v1/document-approval/approvals/{id}/reject:
    post:
      summary: Reject Document
      description: Menolak pengajuan dokumen persetujuan (wajib mencantumkan alasan penolakan).
      tags:
        - Dynamic Document Approval (SAP B1)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  example: "Harga satuan melebihi batas toleransi kontrak tahunan."
      responses:
        '200':
          description: Dokumen ditolak

  /v1/document-approval/approvals/{id}/revise:
    post:
      summary: Revise / Return Document
      description: Mengembalikan dokumen ke pemohon (*requester*) untuk direvisi / diperbaiki.
      tags:
        - Dynamic Document Approval (SAP B1)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - notes
              properties:
                notes:
                  type: string
                  example: "Mohon lampirkan Certificate of Analysis (COA) terbaru."
      responses:
        '200':
          description: Dokumen berhasil dikembalikan untuk revisi

  /v1/document-approval/preview/{typeCode}/{docEntry}:
    get:
      summary: Live Preview SAP Document
      description: Menampilkan preview tampilan dinamis dokumen mentah SAP Business One berdasarkan Tipe Dokumen dan DocEntry sebelum diajukan ke approval.
      tags:
        - Dynamic Document Approval (SAP B1)
      parameters:
        - name: typeCode
          in: path
          required: true
          schema:
            type: string
          example: "PO"
        - name: docEntry
          in: path
          required: true
          schema:
            type: integer
          example: 5001
      responses:
        '200':
          description: Preview dokumen berhasil digenerate

  /v1/auth/login:
    post:
      summary: User Login
      description: Login menggunakan username dan password untuk mendapatkan Bearer Token.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: password
      responses:
        '200':
          description: Login sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '422':
          description: Validasi gagal / kredensial salah / user tidak aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/logout:
    post:
      summary: User Logout
      description: Menghapus token aktif yang digunakan untuk request.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/refresh:
    post:
      summary: Refresh Token
      description: Menghapus token lama dan mengeluarkan token baru.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Refresh token sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/change-password:
    post:
      summary: Ubah Password
      description: Mengubah password user yang sedang login dengan memvalidasi password lama.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
                - new_password_confirmation
              properties:
                old_password:
                  type: string
                  example: password
                new_password:
                  type: string
                  example: passwordbaru123
                new_password_confirmation:
                  type: string
                  example: passwordbaru123
      responses:
        '200':
          description: Password berhasil diubah
          content:
