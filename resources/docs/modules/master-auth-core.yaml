  /v1/warehouses/inventory-transfer:
    get:
      summary: Get list of Inventory Transfers (IT) from SAP
      description: Mengambil daftar transaksi pemindahan stok antar gudang (Inventory Transfer) dari SAP.
      tags:
        - Warehouse
      security:
        - BearerAuth: []
      parameters:
        - name: From
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Tanggal mulai filter (YYYY-MM-DD atau YYYY-M-D)
          example: "2026-1-1"
        - name: To
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Tanggal akhir filter (YYYY-MM-DD atau YYYY-M-D)
          example: "2026-12-31"
        - name: WhsCode
          in: query
          required: false
          schema:
            type: string
          description: Kode gudang asal
          example: "VRTR01"
        - name: ToWhsCode
          in: query
          required: false
          schema:
            type: string
          description: Kode gudang tujuan
          example: "FG01"
      responses:
        '200':
          description: Mengambil daftar Inventory Transfer berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Mengambil daftar Inventory Transfer berhasil. (atau 'Data not found.' jika kosong/dummy)
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        DocEntry:
                          type: string
                          example: "20"
                        DocNum:
                          type: string
                          example: "260130001"
                        DocDate:
                          type: string
                          example: "20260102"
                        FromWhsCode:
                          type: string
                          example: "FG03-BM"
                        ToWhsCode:
                          type: string
                          example: "FG03-KR"
                        Comments:
                          type: string
                          example: "MUTASI BM KE KR"
        '400':
          description: Gagal mengambil daftar Inventory Transfer (Error dari SAP B1)
        '401':
          description: Tidak terautentikasi

    post:
      summary: Perform Inventory Transfer (IT) to SAP
      description: Membuat transaksi pemindahan stok antar gudang (Inventory Transfer) di SAP.
      tags:
        - Warehouse
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - DocDate
                - DocDueDate
                - Filler
                - ToWhsCode
                - Lines
              properties:
                DocDate:
                  type: string
                  format: date
                  example: "2026-03-30"
                DocDueDate:
                  type: string
                  format: date
                  example: "2026-03-30"
                Comments:
                  type: string
                  example: test
                Filler:
                  type: string
                  example: FG01
                  description: Gudang Asal
                ToWhsCode:
                  type: string
                  example: FG04
                  description: Gudang Tujuan
                BeratBruto:
                  type: string
                  example: "10640"
                BeratTara:
                  type: string
                  example: "3740"
                Nopol:
                  type: string
                  example: M9573UN
                NamaSupir:
                  type: string
                  example: Subianto
                Lines:
                  type: array
                  items:
                    type: object
                    required:
                      - ItemCode
                      - Quantity
                      - Filler
                      - ToWhsCode
                    properties:
                      ItemCode:
                        type: string
                        example: RM-001
                      Quantity:
                        type: number
                        format: float
                        example: 10000.0
                      UomEntry:
                        type: integer
                        example: 0
                      Filler:
                        type: string
                        example: FG01
                      ToWhsCode:
                        type: string
                        example: FG04
                      UseBaseUn:
                        type: string
                        example: y
                      OcrCode:
                        type: string
                        example: SBY
                      OcrCode2:
                        type: string
                        example: GRM
                      OcrCode3:
                        type: string
                        example: PCG
                      BinActivfrom:
                        type: string
                        example: Y
                      BinActivto:
                        type: string
                        example: Y
                      Lines_BinFROM:
                        type: array
                        items:
                          type: object
                          properties:
                            AbsEntry:
                              type: integer
                              example: 9
                            Quantity:
                              type: number
                              format: float
                              example: 10000.0
                      Lines_BinTO:
                        type: array
                        items:
                          type: object
                          properties:
                            AbsEntry:
                              type: integer
                              example: 5
                            Quantity:
                              type: number
                              format: float
                              example: 100.0
      responses:
        '200':
          description: Proses Inventory Transfer berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Proses Inventory Transfer berhasil.
                  data:
                    type: object
                    nullable: true
                    example: null
        '400':
          description: Gagal memproses Inventory Transfer
        '401':
          description: Tidak terautentikasi

