          description: Membatalkan Inventory Transfer berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Membatalkan Inventory Transfer berhasil.
                  data:
                    type: object
                    nullable: true
