        card_code:
          type: string
          example: C110003074
        po_number:
          type: string
          example: PO1212-ABC
        doc_date:
          type: string
          format: date
          example: "2026-02-25"
        doc_due_date:
          type: string
          format: date
          example: "2026-02-25"
        eta_date:
          type: string
          format: date
          nullable: true
          example: "2026-03-04"
        slp_code:
          type: integer
