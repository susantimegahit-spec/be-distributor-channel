components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AddDoPayload:
      type: object
      description: Payload untuk Add Delivery Order. Semua field bersifat opsional kecuali disebutkan lain.
      properties:
        is_draft:
          type: boolean
          description: Jika true, sistem hanya menyimpan checklist & signature tanpa mengirim DO ke SAP. Status picklist menjadi IN_PROGRESS.
          example: false
        Series:
          type: integer
          description: Nomor Series DO di SAP. Default mengambil dari picklist atau SO.
          example: 75
        NumAtCard:
          type: string
          description: Nomor PO Customer / Order No
          example: "PO-CUST-001"
        DocDate:
          type: string
          format: date-time
          description: Tanggal dokumen
          example: "2026-09-24T00:00:00"
        DocDueDate:
          type: string
          format: date-time
          description: Tanggal jatuh tempo pengiriman
          example: "2026-09-24T00:00:00"
        TaxDate:
          type: string
          format: date-time
          description: Tanggal pajak
          example: "2026-09-24T00:00:00"
        Comments:
          type: string
          description: Catatan pengiriman
          example: "Pengiriman parsial SO tahap 1"
        NoPol:
          type: string
          description: Nomor polisi kendaraan
          example: "B 1234 ABC"
        KodeEkspedisi:
          type: string
          description: Kode ekspedisi
          example: "JNE"
        NamaEkspedisi:
          type: string
          description: Nama vendor ekspedisi
          example: "JNE Trucking"
        Sopir:
          type: string
          description: Nama supir / driver
          example: "Budi Santoso"
        NamaChecker:
          type: string
          description: Nama staf checker gudang. Multi-checker dipisah garis miring (contoh "ROCHIM/NANANG").
          example: "ROCHIM/NANANG"
        Noseal:
          type: string
          description: Nomor segel pengiriman
          example: "12345"
        CardCode:
          type: string
          description: Opsional. Otomatis diambil dari Sales Order asal.
          example: "C20000"
        Lines:
          type: array
          description: Data baris pengiriman. Jika dikosongkan, sistem auto-generate dari picklist items.
          items:
            type: object
            required:
              - BaseEntry
              - BaseLine
              - Quantity
            properties:
              id:
                type: integer
                description: ID baris picklist item (picklist_items.id).
                example: 10
              BaseEntry:
                type: integer
                description: DocEntry dari Sales Order SAP
                example: 1052
              BaseLine:
                type: integer
                description: LineNum dari Sales Order (index mulai dari 0)
                example: 0
              Quantity:
                type: number
                description: Jumlah barang dikirim
                example: 5.0
              checked_qty:
                type: number
                description: Jumlah kuantitas barang yang diverifikasi checker
                example: 5.0
              checked_by_checker:
                type: string
                description: Nama staf checker yang memverifikasi item ini
                example: "ROCHIM"
              start_time:
                type: string
                format: date-time
                description: Waktu mulai pemeriksaan oleh checker (KPI)
                example: "2026-10-14T09:00:00"
              end_time:
                type: string
                format: date-time
                description: Waktu selesai pemeriksaan oleh checker (KPI)
                example: "2026-10-14T09:25:00"
              labels:
                type: array
                description: |
                  Daftar label kemasan produk beserta tanggal produksi untuk item ini.
                  Satu baris item dapat memiliki lebih dari satu batch/tanggal produksi dan lebih dari satu foto label.
                items:
                  type: object
                  properties:
                    production_date:
                      type: string
                      format: date
                      description: Tanggal produksi barang fisik yang tertera pada kemasan/label produk
                      example: "2026-10-10"
                    label_photos:
                      type: array
                      description: Daftar foto label produk / kemasan untuk tanggal produksi ini. Mendukung Base64 Data URI (`data:image/jpeg;base64,...`) atau upload file.
                      items:
                        type: string
                        example: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ..."
              WhsCode:
                type: string
                description: Kode gudang
                example: "01"
              OcrCode:
                type: string
                description: Kode cabang (Cost Center 1)
                example: "SBY"
              OcrCode2:
                type: string
                description: Kode unit (Cost Center 2)
                example: "GRM"
              OcrCode3:
                type: string
                description: Kode departemen (Cost Center 3)
                example: "MKT"
              is_checked:
                type: boolean
                description: |
                  Status centang item ini oleh checker. Digunakan saat `is_draft: true` untuk menandai item mana saja yang sudah diverifikasi.
                  Jika tidak dikirim, default false. Item yang belum is_checked tidak dikirim ke SAP saat finalisasi DO.
                example: true
        signatures:
          type: array
          description: |
            Tanda tangan Checker dan Supir. Dikirim bersamaan di endpoint add-do ini — tidak perlu endpoint POST /signatures terpisah.
            Mendukung format Base64 Data URL (`data:image/png;base64,...`) maupun multipart/form-data file upload.
          items:
            type: object
            required:
              - signer_type
              - signer_name
              - signature
            properties:
              signer_type:
                type: string
                enum: [checker, driver, supervisor]
                description: Tipe penandatangan
                example: "checker"
              signer_role_title:
                type: string
                description: Label jabatan (misal "Checker 1 (Gudang)", "Supir")
                example: "Checker 1 (Gudang)"
              signer_name:
                type: string
                description: Nama penandatangan
                example: "ROCHIM"
              signature:
                type: string
                description: Data gambar tanda tangan dalam format Base64 Data URL
                example: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA..."
              notes:
                type: string
                description: Catatan pemeriksaan opsional
                example: "Barang lengkap dan sesuai fisik"
              signed_at:
                type: string
                format: date-time
                description: Waktu tanda tangan
        workers:
          type: array
          description: |
            Daftar tenaga kerja (worker/kuli bongkar muat) yang mengangkut barang.
            Sistem secara otomatis menghitung tarif lembur (overtime fee) berdasarkan master data loading rates dikalikan berat/qty yang diangkut.
          items:
            type: object
            required:
              - item_code
              - qty
            properties:
              item_code:
                type: string
                description: Kode item produk yang diangkut
                example: "SKU-LOAD-01"
              worker_name:
                type: string
                nullable: true
                description: Nama worker / kuli (opsional)
                example: "Pak Budi"
              qty:
                type: number
                description: Berat atau kuantitas barang yang diangkut
                example: 500
              rate:
                type: number
                nullable: true
                description: Override tarif lembur per satuan (opsional, jika tidak diisi maka diambil otomatis dari master data loading_rates)
                example: 1500
              notes:
                type: string
                nullable: true
                description: Catatan tambahan
