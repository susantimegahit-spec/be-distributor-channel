          type: array
          description: Daftar seluruh foto label kemasan yang diunggah checker untuk item ini
          items:
            $ref: '#/components/schemas/PicklistItemLabelPhoto'

    Picklist:
      type: object
      properties:
        id:
          type: integer
          example: 1
        picklist_no:
          type: string
          example: "PKL-20261014-0001"
        shipping_type:
          type: string
          enum: [internal, external, pickup]
          example: "internal"
        posting_date:
          type: string
          format: date
          example: "2026-10-14"
        due_date:
          type: string
          format: date
          example: "2026-10-14"
        delivery_order_no:
          type: string
          nullable: true
          example: "20260088"
        total_weight_limit:
          type: number
          description: Batas kapasitas berat armada (KG)
          example: 10000.00
        weigh_in_weight:
          type: number
          nullable: true
          description: Berat kosong kendaraan (Tare Weight) dalam KG
          example: 8500.00
        weigh_in_ticket_no:
          type: string
          nullable: true
          example: "TMB-IN-20261014-0012"
        weigh_in_operator_name:
          type: string
          nullable: true
          example: "Bambang Supriyadi"
        weigh_in_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-14T08:45:00.000000Z"
        weigh_in_notes:
          type: string
          nullable: true
          example: "Truk colt diesel kondisi kosong"
        weigh_out_weight:
          type: number
          nullable: true
          description: Berat kotor kendaraan + muatan (Gross Weight) dalam KG
          example: 17500.00
        weigh_out_ticket_no:
          type: string
          nullable: true
          example: "TMB-OUT-20261014-0045"
        weigh_out_operator_name:
          type: string
          nullable: true
          example: "Bambang Supriyadi"
        weigh_out_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-14T10:30:00.000000Z"
        weigh_out_notes:
          type: string
          nullable: true
          example: "Muatan sesuai toleransi, segel terpasang"
        net_weight:
          type: number
          nullable: true
          description: Berat bersih muatan (Gross - Tare) dalam KG
          example: 9000.00
        weight_check_status:
          type: string
          enum: [pending, sesuai, overload]
          example: "sesuai"
        status:
          type: string
          enum: [open, weigh_in, inprogress, weigh_out, complete, canceled]
          example: "complete"
        license_plate:
          type: string
          nullable: true
          example: "L 9123 AB"
        driver_name:
          type: string
          nullable: true
          example: "SLAMET"
        checker_name:
          type: string
          nullable: true
          example: "ROCHIM/NANANG"
        seal_number:
          type: string
          nullable: true
          example: "SEAL-12345"
        do_doc_entry:
          type: string
          nullable: true
          example: "1052"
        do_doc_num:
          type: string
          nullable: true
          example: "20260088"
        items:
          type: array
          items:
            $ref: '#/components/schemas/PicklistItem'



