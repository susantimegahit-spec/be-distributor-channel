      responses:
        '200':
          description: Status verifikasi dokumen berhasil diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Document verification status updated successfully.
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      vendor_id:
                        type: integer
                        example: 1
                      document_type:
                        type: string
                        example: NIB
                      verification_status:
                        type: string
                        example: VALID
                      verified_by:
                        type: integer
                        example: 5
                      verified_at:
                        type: string
                        format: date-time
                        example: "2026-09-09T09:54:00.000000Z"
                      verification_notes:
                        type: string
                        example: NIB berkas terverifikasi asli dan terdaftar di OSS.
                      notes:
                        type: string
                        example: NIB berkas terverifikasi asli dan terdaftar di OSS.
                      file_url:
                        type: string
                        example: https://smesta-dev.susantimegah.com/storage/vendor_documents/VND-202609-0001/nib_oss.pdf
        '404':
          description: Dokumen tidak ditemukan.
        '422':
          description: Validasi input gagal.

  /vendor-management/documents/{documentId}/preview:
    get:
      summary: Preview / Stream Berkas Dokumen Legalitas (Inline PDF / Image)
      description: Menampilkan berkas dokumen legalitas secara streaming inline (PDF atau Image) di tab baru browser atau iframe/modal preview frontend tanpa harus download file.
      tags:
