        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, DRAFT, CLOSED, CANCELLED]
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: Tanggal awal (format YYYY-MM-DD atau YYYYMMDD)
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: Tanggal akhir (format YYYY-MM-DD atau YYYYMMDD)
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Daftar Request for Quotation berhasil diambil.
    post:
      summary: Create Request for Quotation (RFQ)
      description: Membuat Request for Quotation baru dengan memilih item dari Purchase Request yang disetujui, mengenerate RFQ number unik dan public token link.
      tags:
        - Purchasing Request
        - Request for Quotation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                title:
                  type: string
                  example: "Pengadaan Sparepart Kompresor"
                link:
                  type: string
                  nullable: true
                  description: Link halaman penawaran harga publik yang digenerate oleh frontend
                  example: "https://smesta-dev.susantimegah.com/quotation-offer/d7fb79570180453fa657caed290cb91a"
                notes:
                  type: string
                  example: "Kirim penawaran sebelum tanggal 10"
                valid_until:
                  type: string
                  format: date
                  example: "2026-11-15"
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - itemCode
                      - itemName
                      - quantity
                    properties:
                      requestId:
                        type: string
                        example: "261010008"
                      requestNumber:
                        type: string
                        example: "261010008"
                      itemCode:
                        type: string
                        example: "ISP001694"
                      itemName:
                        type: string
                        example: "RUMAH FILTER KOMPRESOR"
                      quantity:
                        type: number
                        example: 1
                      unit:
                        type: string
                        example: "Pcs"
                      warehouse:
                        type: string
                        example: "FG01"
                      requiredDate:
                        type: string
                        format: date
                        example: "2026-10-28"
                      notes:
                        type: string
                        example: "Original equipment part"
      responses:
        '201':
          description: Request for Quotation berhasil dibuat.

