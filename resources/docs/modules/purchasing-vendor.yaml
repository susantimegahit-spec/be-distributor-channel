    post:
      summary: Upload Ulang Berkas Dokumen Revisi oleh Vendor
      description: Mengunggah berkas pengganti untuk dokumen yang diminta revisi (status NEEDS_REVISION) oleh tim legal. File lama akan digantikan, status dokumen di-reset menjadi PENDING, dan riwayat revisi dicatat.
      tags:
        - Vendor Portal
      parameters:
        - name: documentId
          in: path
          required: true
