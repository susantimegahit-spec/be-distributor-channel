                        example: 2500
                      UnitPrice:
                        type: number
                        example: 2500
                      Total:
                        type: number
                        example: 250000
                      LineTotal:
                        type: number
                        example: 250000
                      UnitMsr:
                        type: string
                        example: "Kg"
                      FreeTxt:
                        type: string
                        example: "Krosok Kualitas A"
                      OcrCode:
                        type: string
                        example: "CAB01"
                      OcrCode2:
                        type: string
                        example: "BU01"
                      OcrCode3:
                        type: string
                        example: "DEPT01"
                      TaxCode:
                        type: string
                        example: "PPN11"
                      UomEntry:
                        type: integer
                        example: 1
