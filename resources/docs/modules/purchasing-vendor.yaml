            type: integer
            example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                vendor_code:
                  type: string
                  description: Kode vendor resmi (contoh VND-202609-0001). Wajib jika request dipanggil tanpa Authorization Bearer Token.
                  example: VND-202609-0001
                file:
                  type: string
                  format: binary
                  description: Berkas dokumen pengganti baru (PDF/JPG/PNG, Max 10MB)
                notes:
                  type: string
                  description: Catatan klarifikasi / perbaikan dari pihak vendor
                  example: Berkas scan akta perubahan direksi asli telah diunggah ulang lembar 1-5.
                document_number:
                  type: string
                  description: Nomor identitas dokumen jika ada perubahan
                  example: AHU-001234.AH.01.02.TAHUN 2025
      responses:
        '200':
          description: Dokumen revisi berhasil diunggah ulang dan kembali ke antrean verifikasi legal.
        '403':
          description: Vendor code tidak cocok dengan kepemilikan dokumen.
        '404':
          description: Dokumen tidak ditemukan.
        '422':
          description: Validasi berkas gagal atau vendor sudah disetujui.

  /vendor-portal/login:
    post:
      summary: Otentikasi Login Vendor Portal
      description: Masuk ke vendor portal menggunakan akun vendor yang telah disetujui tim legal.
      tags:
        - Vendor Portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: vendor@transmegah.com
                password:
                  type: string
                  example: secret123
                vendor_type:
                  type: string
                  example: expedition
      responses:
        '200':
          description: Login berhasil dan mengembalikan token akses Sanctum.
        '422':
          description: Kredensial tidak valid atau akun belum disetujui tim legal.

  /vendor-portal/me:
    get:
      summary: Profil Vendor yang Sedang Login beserta Dokumen Legalitas
      description: Mengambil data profil institusi vendor, data user aktif, dan rincian berkas legalitas yang telah diunggah.
      tags:
        - Vendor Portal
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profil vendor dan berkas dokumen legalitas berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Vendor profile and documents retrieved successfully.
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          email:
                            type: string
                          role:
                            type: string
                          must_change_password:
                            type: boolean
                      vendor:
                        $ref: '#/components/schemas/VendorDetail'
                      sap_vendor_code:
                        type: string
                        description: Kode akun vendor di SAP Business One (CardCode)
                        example: V10001
                      documents:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            document_type:
                              type: string
                              example: AKTA
                            document_number:
                              type: string
                            file_name:
                              type: string
                            file_size:
                              type: integer
                            file_mime:
                              type: string
                            file_url:
                              type: string
                            verification_status:
                              type: string
                              example: VALID
                            notes:
                              type: string
                            verification_notes:
                              type: string
                              example: Mohon perbarui dengan akta perubahan modal terbaru.
                            verified_at:
                              type: string
                              format: date-time
        '401':
          description: Unauthenticated.

  /vendor-portal/change-password:
    post:
      summary: Ganti Kata Sandi Akun Vendor
      description: Mengubah kata sandi pengguna vendor portal. Mengharuskan kata sandi lama yang benar dan kata sandi baru minimal 8 karakter.
      tags:
        - Vendor Portal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
                - new_password_confirmation
              properties:
                current_password:
                  type: string
                  format: password
                  example: OldPassword123!
                new_password:
                  type: string
                  format: password
                  example: NewPassword123!
                new_password_confirmation:
                  type: string
                  format: password
                  example: NewPassword123!
      responses:
        '200':
          description: Password changed successfully.
        '401':
          description: Unauthenticated.
        '422':
          description: Validation error or current password does not match.

  /vendor-portal/logout:
    post:
      summary: Logout Vendor Portal
      description: Mencabut token akses sesi vendor.
      tags:
        - Vendor Portal
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Berhasil logout dari vendor portal.

  /vendor-portal/rates/headers:
    get:
      summary: Daftar Header Pengajuan Tarif Vendor (Batch Submissions)
      description: Mengambil daftar ringkasan pengajuan tarif per batch upload/submission (periode valid_from/valid_until, status pengajuan, total rute) untuk tabel utama FE Vendor Portal. Hanya dapat diakses oleh akun mitra Vendor Portal (`VendorUser`). Untuk staf internal SMETSA, gunakan endpoint `/vendor-management/rates/headers`.
      tags:
        - Vendor Portal
      security:
        - BearerAuth: []
      parameters:
        - name: approval_status
          in: query
          description: Filter status persetujuan tarif (PENDING, APPROVED, REJECTED)
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
        - name: search
          in: query
          description: Pencarian kode batch atau catatan
          schema:
            type: string
        - name: date_from
          in: query
          description: Filter tanggal mulai periode (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: Filter tanggal selesai periode (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          description: Jumlah data per halaman
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Rate submission headers retrieved successfully.
        '401':
          description: Unauthenticated access.
        '403':
          description: Unauthorized access or vendor account not approved yet.

  /vendor-portal/rates/headers/{batchId}:
    get:
      summary: Detail Batch Pengajuan Tarif (Header & Rincian Rute)
      description: Mengambil informasi header batch pengajuan tarif beserta array details (daftar rute pengiriman, lead time, tonase, dan tarif) untuk mitra Vendor Portal (`VendorUser`). Untuk staf internal SMETSA, gunakan endpoint `/vendor-management/rates/headers/{batchId}`.
      tags:
        - Vendor Portal
      security:
        - BearerAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          description: ID batch pengajuan tarif (misal BATCH-RATE-20260910-001 atau MANUAL-SUBMIT-...)
          schema:
            type: string
      responses:
        '200':
          description: Rate batch details retrieved successfully.
        '404':
          description: Batch rate data not found.

  /vendor-portal/rates:
    get:
      summary: Daftar Tarif Pengiriman Vendor (Rate Card Items)
      description: Mengambil daftar tarif pengiriman per rute untuk mitra vendor yang login (`VendorUser`). Otomatis terkunci ke vendor miliknya. Untuk staf internal SMETSA, gunakan endpoint `/vendor-management/rates`.
      tags:
        - Vendor Portal
      security:
        - BearerAuth: []
      parameters:
        - name: batch_id
          in: query
          description: Filter berdasarkan ID batch pengajuan tarif
          schema:
            type: string
        - name: approval_status
          in: query
          description: Filter status persetujuan tarif (PENDING, APPROVED, REJECTED)
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
        - name: transport_mode
          in: query
          description: Filter moda transportasi (DARAT, LAUT, UDARA)
          schema:
            type: string
        - name: warehouse_id
          in: query
          description: Filter ID gudang asal
          schema:
            type: integer
        - name: destination_id
          in: query
          description: Filter ID shipto tujuan
          schema:
            type: integer
        - name: search
          in: query
          description: Pencarian nama gudang, nama tujuan, atau catatan
          schema:
            type: string
        - name: per_page
          in: query
          description: Jumlah data per halaman
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Vendor rates retrieved successfully.
        '401':
          description: Unauthenticated access.
        '403':
          description: Unauthorized access or vendor account not approved yet.
        '422':
          description: Vendor is not of type EXPEDITION.
    post:
      summary: Pengajuan Tarif Pengiriman Baru (Manual)
      description: Mengajukan tarif pengiriman baru secara manual melalui form Vendor Portal. Tarif akan berstatus PENDING hingga disetujui tim logistik.
      tags:
        - Vendor Portal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - price
              properties:
                warehouse_id:
                  type: integer
                  example: 1
                origin:
                  type: string
                  example: WHS-GRS-01
                destination_id:
                  type: integer
                  example: 12
                destination:
                  type: string
                  example: CUST-SMG-01
                transport_mode:
                  type: string
                  example: DARAT
                service_type:
                  type: string
                  example: REGULER
                min_tonnage:
                  type: number
                  example: 0
                max_tonnage:
                  type: number
                  example: 15000
                price:
                  type: number
                  example: 4500000
                leadtime:
                  type: integer
                  example: 2
                  description: Estimasi waktu tempuh pengiriman dalam hari (alias eta_days)
                eta_days:
                  type: integer
                  example: 2
                min_shipment_qty:
                  type: number
                  example: 1
                max_shipment_qty:
                  type: number
                  example: 100
                valid_from:
                  type: string
                  format: date
                  example: 2026-09-10
                valid_until:
                  type: string
                  format: date
                  example: 2027-09-10
                periode:
                  type: string
                  example: 2026-09-10
                  description: Input periode tunggal jika valid_from dan valid_until sama
                remarks:
                  type: string
                  example: Pengajuan penyesuaian tarif armada wingbox Q4
      responses:
        '201':
          description: Expedition rate submitted successfully. Pending review by logistics team.
        '401':
          description: Unauthenticated access.
        '403':
          description: Unauthorized access or vendor account not approved yet.
        '422':
          description: Validation error.

  /vendor-portal/rates/upload:
    post:
      summary: Upload Massal Pengajuan Tarif (Excel / CSV) dengan Periode Pop-up
      description: Mengunggah spreadsheet daftar tarif (.xlsx, .xls, .csv). Pengajuan tarif otomatis dikaitkan dengan vendor ekspedisi yang sedang login dan berstatus PENDING. Kolom periode diisi dari form pop-up FE.
      tags:
        - Vendor Portal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File Excel (.xlsx, .xls) atau CSV (Maksimal 10MB) dengan kolom No, Origin Name, Destination, Transport Mode, Min Weight (Kg), Max Weight (Kg), Service Type, Rate, Lead Time.
                valid_from:
                  type: string
                  format: date
                  example: 2026-08-15
                  description: Tanggal mulai periode pengajuan (dari pop-up modal FE)
                valid_until:
                  type: string
                  format: date
                  example: 2027-08-15
                  description: Tanggal selesai periode pengajuan (dari pop-up modal FE)
                periode:
                  type: string
                  example: 2026-08-15
                  description: Input periode tunggal (otomatis mengisi valid_from dan valid_until)
      responses:
        '200':
          description: Rate spreadsheet uploaded and processed successfully. Submitted rates are pending review.
        '401':
          description: Unauthenticated access.
        '403':
          description: Unauthorized access or vendor account not approved yet.
        '422':
          description: Validation error or invalid file type.

  /vendor-portal/rates/template:
    get:
      summary: Download Template CSV Pengajuan Tarif
      description: Mengunduh template CSV resmi (No, Origin Name, Destination, Transport Mode, Min Weight (Kg), Max Weight (Kg), Service Type, Rate, Lead Time) untuk pengajuan tarif pengiriman massal oleh mitra vendor ekspedisi.
      tags:
        - Vendor Portal
      security:
        - BearerAuth: []
      responses:
        '200':
          description: CSV template file download stream.
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /vendor-management/registrations:
    get:
      summary: Daftar Permohonan Registrasi Vendor (Backoffice Legal)
      description: Menampilkan daftar permohonan mitra vendor dengan filter status, tipe vendor, dan pencarian.
      tags:
        - Vendor Management (Legal)
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ALL, PENDING_LEGAL_APPROVAL, REVISION_REQUIRED, APPROVED, REJECTED]
            example: PENDING_LEGAL_APPROVAL
        - name: vendor_type
          in: query
          schema:
            type: string
            enum: [ALL, EXPEDITION, DISTRIBUTOR, RAW_MATERIAL, PACKAGING, GENERAL_SUPPLIER]
            example: EXPEDITION
        - name: search
          in: query
          schema:
            type: string
            example: Trans Megah
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          schema:
            type: integer
            example: 15
      responses:
        '200':
          description: Daftar permohonan vendor berhasil diambil.

  /vendor-management/registrations/{id}:
    get:
      summary: Detail Lengkap Permohonan Vendor & Dokumen Legalitas
      description: Menampilkan informasi institusi vendor, berkas dokumen yang diunggah, riwayat audit approval, dan akun user.
      tags:
        - Vendor Management (Legal)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Detail vendor berhasil diambil beserta dokumen dan nama wilayah administratif.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/VendorDetail'
        '404':
          description: Vendor tidak ditemukan.

  /vendor-management/registrations/{id}/approve:
    post:
      summary: Persetujuan Legal Permohonan Vendor
      description: Menyetujui pendaftaran vendor, meng-generate akun user login di vendor_users, auto-sync ke master ekspedisi jika tipe EXPEDITION, sinkronisasi vendor baru ke SAP B1 via POST /api/addvendor, dan mencatat log dispatch kredensial.
      tags:
        - Vendor Management (Legal)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                legal_notes:
                  type: string
                  example: Berkas legalitas lengkap dan diverifikasi valid.
                sap_vendor_code:
                  type: string
                  example: V10001
                initial_password:
                  type: string
                  example: CustomPassword123!
      responses:
        '200':
          description: Pendaftaran vendor disetujui, disinkronkan ke SAP, dan kredensial akun berhasil digenerate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Vendor registration approved successfully. Login credentials have been generated and dispatched.
                  data:
                    type: object
                    properties:
                      vendor_code:
                        type: string
                        example: VND-202609-0001
                      company_name:
                        type: string
                        example: PT Sumber Makmur Sejahtera
                      registration_status:
                        type: string
                        example: APPROVED
                      legal_approval_status:
                        type: string
                        example: APPROVED
                      sap_vendor_code:
                        type: string
                        example: VN10001
                      sap_sync:
                        type: object
                        properties:
                          success:
                            type: boolean
                            example: true
                          card_code:
                            type: string
                            example: VN10001
                          message:
                            type: string
                            example: "Success - [AddVendor]. CardCode: VN10001"
                      credentials:
                        type: object
                      expedition_linked:
                        type: object
        '404':
          description: Vendor tidak ditemukan.
        '422':
          description: Permohonan gagal diproses (misal vendor sudah di-approve sebelumnya atau sinkronisasi ke SAP gagal/ditolak).

  /vendor-management/registrations/{id}/reject:
    post:
      summary: Penolakan Permohonan Vendor
      description: Menolak permohonan pendaftaran vendor oleh tim legal dengan alasan penolakan wajib. Sistem secara otomatis mengirimkan email resmi pemberitahuan penolakan (beserta alasan penolakan dan kontak klarifikasi) ke alamat email perusahaan vendor.
      tags:
        - Vendor Management (Legal)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rejection_reason
              properties:
                rejection_reason:
                  type: string
                  example: NIB izin usaha tidak sesuai dengan bidang logistik.
      responses:
        '200':
          description: Pendaftaran vendor berhasil ditolak dan notifikasi email resmi telah dikirim ke vendor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Vendor registration rejected successfully.
                  data:
                    type: object
                    properties:
                      vendor_code:
                        type: string
                        example: VND-202609-0001
                      registration_status:
                        type: string
                        example: REJECTED
                      legal_notes:
                        type: string
                        example: NIB izin usaha tidak sesuai dengan bidang logistik.
        '404':
          description: Vendor tidak ditemukan.

  /vendor-management/registrations/{id}/request-revision:
    post:
      summary: Permintaan Revisi Dokumen Legalitas ke Vendor
      description: Mengirim instruksi perbaikan berkas ke calon mitra vendor.
      tags:
        - Vendor Management (Legal)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - revision_notes
              properties:
                revision_notes:
                  type: string
                  example: Mohon lampirkan lembar akta perubahan susunan pengurus terbaru.
                document_types:
                  type: array
                  items:
                    type: string
                  example: [AKTA]
      responses:
        '200':
          description: Instruksi revisi berhasil dikirim ke vendor.
        '404':
          description: Vendor tidak ditemukan.

  /vendor-management/documents/{documentId}/verify:
    post:
      summary: Verifikasi Individual Berkas Dokumen Legalitas (Valid / Needs Revision / Invalid)
      description: Memverifikasi satu berkas dokumen tertentu (Akta, NIB, NPWP, Pendukung) dengan opsi VALID, NEEDS_REVISION, atau INVALID beserta catatan review dari legal.
      tags:
        - Vendor Management (Legal)
      security:
        - BearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
