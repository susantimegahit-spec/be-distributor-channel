openapi: 3.0.3
info:
  title: "SMESTA API - Modul Purchasing (PR, Quotation), Budgeting & Vendor Portal"
  description: |
    Dokumentasi API Modular SMESTA (Bagian dari `resources/docs/openapi.yaml`).
    Edit file ini secara langsung agar ringan di IDE, lalu jalankan `php artisan docs:openapi bundle` untuk menyatukan kembali ke `openapi.yaml`.
  version: 1.0.0
servers:
  - url: https://api-sm-connect.susantimegah.com/api/distributor-channel
    description: Production Server
  - url: http://api-dev.susantimegah.com/api/distributor-channel
    description: Development Server
  - url: http://localhost:8000/api/distributor-channel
    description: Local Server
paths:
  /v1/document-approval/document-types:
    get:
      summary: Get List Master Document Types
      description: Mengambil daftar master Document Types SAP B1 yang aktif beserta relasi skema aktif (mendukung search, filter module, is_active, dan pagination).
      tags:
        - Master Document Types
      parameters:
        - name: module
          in: query
          required: false
          schema:
            type: string
          example: "Purchasing"
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
          example: true
        - name: search
          in: query
          required: false
          schema:
            type: string
          example: "Purchase"
        - name: all
          in: query
          required: false
          schema:
            type: boolean
          example: true
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
          example: 15
      responses:
        '200':
          description: Berhasil mengambil daftar tipe dokumen
    post:
      summary: Create New Document Type (With Upload)
      description: Membuat tipe dokumen baru dengan dukungan upload icon (gambar) dan template attachment / file SOP panduan (PDF/DOCX/XLSX).
      tags:
        - Master Document Types
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - code
                - name
              properties:
                code:
                  type: string
                  example: "AP_INV"
                name:
                  type: string
                  example: "A/P Invoice"
                sap_object_type:
                  type: integer
                  example: 18
                module:
                  type: string
                  example: "Purchasing"
                header_source:
                  type: string
                  example: "OPCH"
                line_source:
                  type: string
                  example: "PCH1"
                description:
                  type: string
                  example: "Faktur Pembelian Hutang Dagang"
                is_active:
                  type: boolean
                  example: true
                icon:
                  type: string
                  format: binary
                  description: File icon dokumen (PNG, JPG, SVG - max 2MB)
                attachment:
                  type: string
                  format: binary
                  description: File template / SOP dokumen (PDF, DOCX, XLSX - max 10MB)
      responses:
        '201':
          description: Document Type berhasil dibuat

  /v1/document-approval/document-types/{idOrCode}:
    get:
      summary: Get Document Type Detail (by ID or Code)
      description: Mengambil detail skema field dan alur workflow untuk tipe dokumen tertentu berdasarkan ID atau Kodenya (misal 1 atau PO).
      tags:
        - Master Document Types
      parameters:
        - name: idOrCode
          in: path
          required: true
          schema:
            type: string
          example: "PO"
      responses:
        '200':
          description: Berhasil mengambil detail tipe dokumen
        '404':
          description: Tipe dokumen tidak ditemukan
    put:
      summary: Update Document Type
      description: Memperbarui data tipe dokumen (bisa ganti icon dan file template lampiran).
      tags:
        - Master Document Types
      parameters:
        - name: idOrCode
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Purchase Order Update"
                module:
                  type: string
                  example: "Purchasing"
                description:
                  type: string
                icon:
                  type: string
                  format: binary
                attachment:
                  type: string
                  format: binary
      responses:
        '200':
          description: Document Type berhasil diperbarui
    delete:
      summary: Delete Document Type
      description: Menghapus tipe dokumen (akan ditolak jika tipe dokumen sudah memiliki transaksi approval).
      tags:
        - Master Document Types
      parameters:
        - name: idOrCode
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Document Type berhasil dihapus
        '422':
          description: Gagal dihapus karena memiliki transaksi approval

  /v1/document-approval/document-types/{id}/toggle-status:
    patch:
      summary: Toggle Document Type Active Status
      description: Mengaktifkan atau menonaktifkan status dokumen.
      tags:
        - Master Document Types
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Status berhasil diubah

  /v1/document-approval/document-types/{id}/attachment:
    post:
      summary: Upload Document Type Attachment / Template SOP
      description: Endpoint khusus untuk upload / update file lampiran template atau SOP (PDF, DOCX, XLSX, max 15MB).
      tags:
        - Master Document Types
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - attachment
              properties:
                attachment:
                  type: string
                  format: binary
      responses:
        '200':
          description: File lampiran berhasil diupload

  /v1/budgeting/master-budgets:
    get:
      summary: Get Master Budget list with filters and pagination
      tags:
        - Budgeting
      security:
        - BearerAuth: []
      parameters:
        - name: department
          in: query
          required: false
          schema:
            type: string
          description: Filter department
        - name: cost_center
          in: query
          required: false
          schema:
            type: string
          description: Filter cost center
        - name: budget_category
          in: query
          required: false
          schema:
            type: string
          description: Filter budget category
        - name: period_year
          in: query
          required: false
          schema:
            type: integer
          description: Filter period year (e.g. 2026)
        - name: period_month
          in: query
          required: false
          schema:
            type: integer
          description: Filter period month (1-12)
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, CLOSED]
          description: Filter status
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search term (budget_code, description, department, cost_center)
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 15
          description: Items per page
        - name: paginate
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Enable or disable pagination
      responses:
        '200':
          description: Data Master Budget berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Data Master Budget berhasil diambil.
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MasterBudget'

    post:
      summary: Create new Master Budget
      tags:
        - Budgeting
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - department
                - budget_amount
                - period_year
                - status
              properties:
                budget_code:
                  type: string
                  nullable: true
                  description: Kode budget. Jika dikosongkan, akan dibuat otomatis oleh sistem (misal BDG-202608-0001).
                  example: BDG-202608-0001
                department:
                  type: string
                  example: FINANCE
                cost_center:
                  type: string
                  nullable: true
                  example: CC-FIN-01
                budget_category:
                  type: string
                  nullable: true
                  example: OPERATIONAL
                budget_amount:
                  type: number
                  example: 50000000
                period_month:
                  type: integer
                  nullable: true
                  example: 8
                period_year:
                  type: integer
                  example: 2026
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE, CLOSED]
                  example: ACTIVE
                description:
                  type: string
                  nullable: true
                  example: Budget Operasional Q3
      responses:
        '201':
          description: Master Budget berhasil dibuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Master Budget berhasil dibuat.
                  data:
                    $ref: '#/components/schemas/MasterBudget'
        '422':
          description: Validation error.

  /v1/budgeting/master-budgets/{id}:
    get:
      summary: Get Master Budget detail
      tags:
        - Budgeting
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Master Budget ID
      responses:
        '200':
          description: Detail Master Budget berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Detail Master Budget berhasil diambil.
                  data:
                    $ref: '#/components/schemas/MasterBudget'
        '404':
          description: Master Budget tidak ditemukan.

    put:
      summary: Update Master Budget
      tags:
        - Budgeting
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Master Budget ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - department
                - budget_amount
                - period_year
                - status
              properties:
                budget_code:
                  type: string
                  nullable: true
                  example: BDG-2026-001
                department:
                  type: string
                  example: FINANCE
                cost_center:
                  type: string
                  nullable: true
                  example: CC-FIN-01
                budget_category:
                  type: string
                  nullable: true
                  example: OPERATIONAL
                budget_amount:
                  type: number
                  example: 60000000
                period_month:
                  type: integer
                  nullable: true
                  example: 8
                period_year:
                  type: integer
                  example: 2026
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE, CLOSED]
                  example: ACTIVE
                description:
                  type: string
                  nullable: true
                  example: Revision Budget Operasional Q3
      responses:
        '200':
          description: Master Budget berhasil diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Master Budget berhasil diperbarui.
                  data:
                    $ref: '#/components/schemas/MasterBudget'
        '404':
          description: Master Budget tidak ditemukan.
        '422':
          description: Validation error.

    delete:
      summary: Delete Master Budget
      tags:
        - Budgeting
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Master Budget ID
      responses:
        '200':
          description: Master Budget berhasil dihapus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Master Budget berhasil dihapus.
                  data:
                    type: object
                    nullable: true
        '404':
          description: Master Budget tidak ditemukan.

  /v1/purchasing-request/series:
    get:
      summary: Get Series Dokumen Purchase Request (SAP B1)
      description: Mengambil daftar penomoran Series dokumen Purchase Request dari SAP Business One (/api/getSeries).
      tags:
        - Purchasing Request
      security:
        - BearerAuth: []
      parameters:
        - name: CustomQuery
          in: query
          required: false
          description: Tanggal format YYYYMMDD untuk filter series aktif (default tanggal hari ini)
          schema:
            type: string
            example: "20251022"
      responses:
        '200':
          description: Daftar series berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar series Purchasing Request berhasil diambil.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Series:
                          type: string
                          example: "4876"
                        SeriesName:
                          type: string
                          example: "BLR25-10"

  /GetDepartment:
    get:
      summary: Get Department SAP B1
      description: Mengambil daftar department dari SAP Business One (/api/GetDepartment).
      tags:
        - Master SAP
      parameters:
        - name: search
          in: query
          required: false
          description: Pencarian nama atau kode departemen
          schema:
            type: string
            example: "PRO"
      responses:
        '200':
          description: Daftar department berhasil diambil dari SAP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ErrorCode:
                    type: integer
                    example: 0
                  Message:
                    type: string
                    example: ""
                  Result:
                    type: array
                    items:
                      type: object
                      properties:
                        Code:
                          type: string
                          example: "-2"
                        Remarks:
                          type: string
                          example: "General Department"
                        Name:
                          type: string
                          example: "General"
    post:
      summary: Get Department SAP B1 (POST)
      description: Mengambil daftar department dari SAP Business One (/api/GetDepartment).
      tags:
        - Master SAP
      responses:
        '200':
          description: Daftar department berhasil diambil dari SAP.

  /v1/purchasing-request/departments:
    get:
      summary: Get Daftar Department SAP B1
      description: Mengambil daftar department dari SAP Business One (/api/GetDepartment).
      tags:
        - Purchasing Request
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Pencarian nama atau kode departemen
          schema:
            type: string
            example: "PRO"
      responses:
        '200':
          description: Daftar department berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar department berhasil diambil.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Code:
                          type: string
                          example: "1"
                        Remarks:
                          type: string
                          example: "Production"
                        Name:
                          type: string
                          example: "PRO"

  /v1/purchasing-request/items:
    get:
      summary: Get Daftar Item untuk Purchase Request (Beserta default UoM)
      description: Mengambil daftar item dari SAP B1 (/api/ListItem) atau master item lokal yang siap digunakan untuk baris Purchase Request.
      tags:
        - Purchasing Request
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Pencarian kode item atau nama item
          schema:
            type: string
            example: "JS000009"
      responses:
        '200':
          description: Daftar item berhasil diambil.

  /v1/purchasing-request/draft-pr:
    post:
      summary: Get Draft Purchase Request dari SAP B1 (/api/GetDraftPR)
      description: |
        Mengambil daftar dokumen draft Purchase Request dari SAP B1 API (`/api/GetDraftPR`) berdasarkan ID Originator, User ID, dan rentang tanggal.
        Jika data tidak ditemukan atau SAP mengembalikan placeholder dummy kosong, endpoint akan mengembalikan respon data not found.
      tags:
        - Purchasing Request
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                CostumQuery:
                  type: string
                  description: ID Originator SAP B1 (contoh "59")
                  example: "59"
                UserId:
                  type: string
                  description: User ID SMESTA
                  example: "admin"
                From:
                  type: string
                  description: Tanggal awal filter (YYYYMMDD atau YYYY-MM-DD)
                  example: "20260901"
                To:
                  type: string
                  description: Tanggal akhir filter (YYYYMMDD atau YYYY-MM-DD)
                  example: "20260930"
                Status:
                  type: string
                  description: Status draft PR
                  example: ""
      responses:
        '200':
          description: Data draft Purchase Request berhasil diambil atau data not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Data draft Purchase Request berhasil diambil."
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        WddCode:
                          type: string
                          example: "12"
                        DocEntry:
                          type: string
                          example: "101"
                        DraftEntry:
                          type: string
                          example: "201"
                        DraftNum:
                          type: string
                          example: "201"
                        DocNum:
                          type: string
                          example: "101"
                        DocTotal:
                          type: string
                          example: "500000.000000"
                        ObjType:
                          type: string
                          example: "1470000113"
                        DocDate:
                          type: string
                          example: "2026-09-15"
                        CurrStep:
                          type: string
                          example: "1"
                        Status:
                          type: string
                          example: "W"
                        StatusCode:
                          type: string
                          example: "W"
                        StatusDescription:
                          type: string
                          example: "Pending Approval"
                        Remarks:
                          type: string
                          example: "Draft PR Urgent"
    get:
      summary: Get Draft Purchase Request dari SAP B1 (Query Params)
      description: Mengambil daftar draft Purchase Request via method GET.
      tags:
        - Purchasing Request
      security:
        - BearerAuth: []
      parameters:
        - name: CostumQuery
          in: query
          description: ID Originator SAP B1
          schema:
            type: string
            example: "59"
        - name: UserId
          in: query
          description: User ID SMESTA
          schema:
            type: string
        - name: From
          in: query
          description: Tanggal awal filter (YYYYMMDD)
          schema:
            type: string
            example: "20260901"
        - name: To
          in: query
          description: Tanggal akhir filter (YYYYMMDD)
          schema:
            type: string
            example: "20260930"
        - name: Status
          in: query
          description: Status draft PR
          schema:
            type: string
      responses:
        '200':
          description: Data draft Purchase Request berhasil diambil.

  /v1/purchasing-request/generated:
    post:
      summary: List Purchase Request Generated dari SAP B1 (/api/GetListPRGenerated)
      description: |
        Mengambil daftar dokumen Purchase Request yang telah di-generate dari SAP B1 API (`/api/GetListPRGenerated`) berdasarkan departemen/query dan rentang tanggal.
        Jika data kosong atau placeholder dummy tidak valid, endpoint mengembalikan respon data not found.
      tags:
        - Purchasing Request
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                CostumQuery:
                  type: string
                  description: Kode departemen atau kata kunci (contoh "IT", "PRO")
                  example: "IT"
                From:
                  type: string
                  description: Tanggal awal filter (YYYYMMDD atau YYYY-MM-DD)
                  example: "20250901"
                To:
                  type: string
                  description: Tanggal akhir filter (YYYYMMDD atau YYYY-MM-DD)
                  example: "20260930"
      responses:
        '200':
          description: Daftar Purchase Request yang telah di-generate berhasil diambil atau data not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Daftar Purchase Request yang telah di-generate berhasil diambil."
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        DocEntry:
                          type: string
                          example: "5339"
                        DocNum:
                          type: string
                          example: "260840020"
                        DocDate:
                          type: string
                          example: "20260810"
                        DocDueDate:
                          type: string
                          example: "20260817"
                        ReqDate:
                          type: string
                          example: "20260817"
                        RequesterName:
                          type: string
                          example: "Produksi, Maintenance & Logistik"
                        Department:
                          type: string
                          example: "1"
                        DocStatus:
                          type: string
                          example: "Closed"
                        Comments:
                          type: string
                          example: "UNTUK CAT POMPA ALL UNIT 2 DAN ALAT BERAT"
    get:
      summary: List Purchase Request Generated dari SAP B1 (Query Params)
      description: Mengambil daftar Purchase Request yang telah di-generate via method GET.
      tags:
        - Purchasing Request
      security:
        - BearerAuth: []
      parameters:
        - name: CostumQuery
          in: query
          description: Kode departemen atau kata kunci (contoh "IT")
          schema:
            type: string
            example: "IT"
        - name: From
          in: query
          description: Tanggal awal filter (YYYYMMDD)
          schema:
            type: string
            example: "20250901"
        - name: To
          in: query
          description: Tanggal akhir filter (YYYYMMDD)
          schema:
            type: string
            example: "20260930"
      responses:
        '200':
          description: Daftar Purchase Request yang telah di-generate berhasil diambil.

  /v1/purchasing-request/detail-pr:
    post:
      summary: Get Detail Purchase Request dari SAP B1 (/api/GetDetailPR)
      description: |
        Mengambil detail dokumen Purchase Request dan baris item dari SAP B1 API (`/api/GetDetailPR`) berdasarkan DocEntry (`CustomQuery`).
        Jika dokumen tidak ditemukan atau SAP mengembalikan placeholder dummy kosong, endpoint mengembalikan respon data not found.
      tags:
        - Purchasing Request
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - CustomQuery
              properties:
                CustomQuery:
                  type: string
                  description: DocEntry dokumen Purchase Request
                  example: "5339"
      responses:
        '200':
          description: Detail Purchase Request berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Detail Purchase Request berhasil diambil."
                  data:
                    type: object
                    properties:
                      Table1:
                        type: array
                        items:
                          type: object
                          properties:
                            DocEntry:
                              type: string
                              example: "5339"
                            DocNum:
                              type: string
                              example: "260840020"
                            Series:
                              type: string
                              example: "6493"
                            SeriesName:
                              type: string
                              example: "GSK26-08"
                            DocDate:
                              type: string
                              example: "20260810"
                            DocDueDate:
                              type: string
                              example: "20260817"
                            ReqDate:
                              type: string
                              example: "20260817"
                            Department:
                              type: string
                              example: "1"
                            DepartmentName:
                              type: string
                              example: "PRO"
                            RequesterName:
                              type: string
                              example: "Produksi, Maintenance & Logistik"
                            Requester:
                              type: string
