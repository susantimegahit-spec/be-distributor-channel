                  type: integer
                  example: 0
                DocDate:
                  type: string
                  format: date
                  example: "2026-11-05"
                DocDueDate:
                  type: string
                  format: date
                  example: "2026-11-12"
                TaxDate:
                  type: string
                  format: date
                  example: "2026-11-05"
                ReqDate:
                  type: string
                  format: date
                  example: "2026-11-10"
                Department:
                  type: integer
                  example: 1
                Branch:
                  type: integer
                  example: 1
                Requester:
                  type: string
                  example: "1"
                RequesterName:
                  type: string
                  example: "John Doe"
                DocType:
                  type: string
                  example: "I"
                Comments:
                  type: string
                  example: "Permintaan Pembelian Bahan Baku"
                Total:
                  type: number
                  example: 250000
                DocTotal:
                  type: number
                  example: 250000
                AddonId:
                  type: string
                  example: "PORTAL_PURCHASING"
                UserId:
                  type: string
                  example: "admin"
                Lines:
                  type: array
                  items:
                    type: object
                    required:
                      - ItemCode
                      - Quantity
                    properties:
                      ItemCode:
                        type: string
                        example: "RM-GARAM-01"
                      Quantity:
                        type: number
                        example: 100
                      WhsCode:
                        type: string
                        example: "WHS-RAW"
                      PQTReqDate:
                        type: string
