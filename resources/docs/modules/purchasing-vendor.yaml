    post:
      summary: Fast Add Purchase Request ke SAP B1 (/api/addpr)
      description: |
        Menambahkan dokumen Purchase Request secara langsung ke SAP B1 (`http://103.18.133.187:3100/api/addpr`)
        dengan pemrosesan in-memory berkecepatan tinggi, tanpa bottleneck query database berulang.
        Pencatatan ke database lokal dilakukan secara non-blocking di latar belakang.
      tags:
        - Purchasing Request
        - Master SAP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
