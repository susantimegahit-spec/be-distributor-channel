  /vendor-portal/register:
    post:
      summary: Pendaftaran Calon Mitra Vendor (Ekspedisi, Distributor, dll)
      description: Mendaftarkan profil perusahaan calon vendor dan mengunggah 4 berkas dokumen legalitas (Akta, NIB, NPWP, Pendukung).
      tags:
        - Vendor Portal
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - vendor_type
                - company_name
                - company_email
                - pic_name
                - pic_phone
                - terms_agreed
              properties:
                vendor_type:
                  type: string
                  example: expedition
                  description: Tipe vendor (expedition, distributor, raw_material, packaging, general_supplier)
                company_name:
                  type: string
                  example: PT Trans Megah Logistik
                company_email:
                  type: string
                  format: email
                  example: vendor@transmegah.com
                company_phone:
                  type: string
                  example: 031-8921122
                company_npwp:
                  type: string
                  description: Nomor Pokok Wajib Pajak (NPWP) Perusahaan (Format 15/16 digit)
                  example: "01.234.567.8-901.000"
                nik:
                  type: string
                  description: 'Nomor Induk Kependudukan (NIK) penanggung jawab / perusahaan (Default: "0000000000000000")'
                  example: "0000000000000000"
                address:
                  type: string
                  description: Alamat jalan domisili perusahaan
                  example: Jl. Rungkut Industri No. 45
                village:
                  type: string
                  description: Desa / Kelurahan
                  example: Rungkut Menanggal
                district:
                  type: string
                  description: Kecamatan
                  example: Gunung Anyar
                city:
                  type: string
                  description: Kota
                  example: Surabaya
                regencies:
                  type: string
                  description: Kabupaten / Kota (juga mendukung alias regency)
                  example: Surabaya
                province:
                  type: string
                  description: Provinsi
                  example: Jawa Timur
                postal_code:
                  type: string
                  description: Kode Pos
                  example: "60293"
                pic_name:
                  type: string
                  example: Budi Prasetyo
                pic_phone:
                  type: string
                  example: "081234567890"
                pic_email:
                  type: string
                  example: budi@transmegah.com
                terms_agreed:
                  type: boolean
                  example: true
                documents:
                  type: array
                  description: Daftar berkas dokumen legalitas dinamis dari form FE.
                  items:
                    type: object
                    properties:
                      document_type:
                        type: string
                        example: akta
                        description: Tipe berkas (akta, sk_akta_pendirian, akta_perubahan, sk_akta_perubahan, nib, npwp, ktp_direktur, sertifikat_halal, pakta_integritas, peraturan_kerjasama, support)
                      file:
                        type: string
                        format: binary
                        description: File binary dokumen (PDF, JPG, PNG, DOC, DOCX - Maks 10MB)
                      notes:
                        type: string
                        example: Keterangan tambahan dokumen
                      document_number:
                        type: string
                        example: AHU-0012345.AH.01.01.2025
                akta:
                  type: string
                  format: binary
                  description: Berkas Akta Pendirian / Perubahan (PDF/JPG/PNG, Max 10MB)
                akta_notes:
                  type: string
                  description: Catatan / keterangan terkait berkas Akta
                  example: Salinan akta perubahan direksi tahun 2025
                nib:
                  type: string
                  format: binary
                  description: Berkas NIB / Izin Usaha (PDF/JPG/PNG, Max 10MB)
                nib_notes:
                  type: string
                  description: Catatan / keterangan terkait berkas NIB
                  example: NIB OSS RBA terbitan BKPM
                npwp:
                  type: string
                  format: binary
                  description: Berkas NPWP Perusahaan (PDF/JPG/PNG, Max 10MB)
                npwp_notes:
                  type: string
                  description: Catatan / keterangan terkait berkas NPWP
                  example: NPWP 16 digit terdaftar di KPP Pratama
                support:
                  type: string
                  format: binary
                  description: Berkas Dokumen Pendukung (PDF/JPG/PNG, Max 10MB)
                support_notes:
                  type: string
                  description: Catatan / keterangan dokumen pendukung
                pakta_integritas:
                  type: string
                  format: binary
                  description: Berkas Pakta Integritas yang telah ditandatangani dan bermeterai (PDF/JPG/PNG, Max 10MB)
                pakta_integritas_notes:
                  type: string
                  description: Catatan pakta integritas
                perjanjian_kerjasama:
                  type: string
                  format: binary
                  description: Berkas Dokumen Perjanjian Kerjasama (PKS) (PDF/JPG/PNG, Max 10MB)
                perjanjian_kerjasama_notes:
                  type: string
                  description: Catatan dokumen perjanjian kerjasama
      responses:
        '201':
          description: Pendaftaran berhasil dikirim dan menunggu verifikasi legal.
        '422':
          description: Validasi form gagal atau email sudah terdaftar.

