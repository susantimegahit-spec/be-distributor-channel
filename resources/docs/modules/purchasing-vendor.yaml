    get:
      summary: Get Request for Quotation (RFQ) list
      description: Mengambil daftar Request for Quotation (RFQ) yang dibuat dari PR yang disetujui, beserta jumlah penawaran vendor yang masuk.
      tags:
        - Purchasing Request
        - Request for Quotation
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
