  /vendor-management/rates:
    get:
      summary: Daftar Tarif Pengiriman Vendor (SMETSA Internal)
      description: Mengambil daftar tarif pengiriman per rute untuk staf internal SMETSA Backoffice. Mendukung filter by vendor_id, expedition_id, batch_id, approval_status, transport_mode, warehouse_id, destination_id, search, dan pagination.
      tags:
        - Vendor Management (Rates)
      security:
        - BearerAuth: []
      parameters:
        - name: vendor_id
          in: query
          required: false
          description: Filter ID master vendor
          schema:
            type: integer
        - name: expedition_id
          in: query
          required: false
          description: Filter ID master ekspedisi
          schema:
            type: integer
        - name: batch_id
          in: query
          description: Filter berdasarkan ID batch pengajuan tarif
          schema:
            type: string
        - name: approval_status
          in: query
          description: Filter status persetujuan tarif (PENDING, APPROVED, REJECTED)
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
        - name: transport_mode
          in: query
          description: Filter moda transportasi (DARAT, LAUT, UDARA)
          schema:
            type: string
        - name: warehouse_id
          in: query
          description: Filter ID gudang asal
          schema:
            type: integer
        - name: destination_id
          in: query
          description: Filter ID customer shipto tujuan
          schema:
            type: integer
        - name: search
          in: query
          description: Pencarian nama gudang, nama tujuan, atau catatan
          schema:
            type: string
        - name: per_page
          in: query
          description: Jumlah data per halaman
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Vendor rates retrieved successfully.
        '401':
          description: Unauthenticated access.
        '403':
          description: Unauthorized access. Only internal users can access this endpoint.


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
