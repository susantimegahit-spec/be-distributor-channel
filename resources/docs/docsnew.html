<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>SMESTA API Documentation (Modern) - PT Susanti Megah</title>
  <link rel="icon" type="image/png" href="/docs/logo-smesta-transparent.png">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --bg-dark: #090d16;
      --surface-dark: #0f172a;
      --border-dark: rgba(255, 255, 255, 0.08);
      --text-dark: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-glow: rgba(2, 132, 199, 0.25);
      --accent-purple: #8b5cf6;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: var(--font-sans);
      background-color: var(--bg-dark);
      color: var(--text-dark);
      overflow-x: hidden;
    }

    /* ============================================================
       Modern Glassmorphic Top Navigation Header
    ============================================================ */
    .smesta-topbar {
      position: sticky;
      top: 0;
      z-index: 9999;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-dark);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo-img {
      height: 42px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(2, 132, 199, 0.3));
    }

    .brand-text-col {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #0284c7, #8b5cf6);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse-glow 2s infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.2); }
    }

    /* ============================================================
       Center Quick Search Button
    ============================================================ */
    .search-btn-trigger {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px 16px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      min-width: 260px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-btn-trigger:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(2, 132, 199, 0.5);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(2, 132, 199, 0.2);
    }

    .search-btn-trigger svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
    }

    .search-kbd {
      margin-left: auto;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: #cbd5e1;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    /* ============================================================
       Actions & Nav Buttons
    ============================================================ */
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .action-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .btn-classic {
      background: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      border-color: rgba(255, 255, 255, 0.1);
    }

    .btn-classic:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-raw {
      background: rgba(2, 132, 199, 0.15);
      color: #38bdf8;
      border-color: rgba(2, 132, 199, 0.3);
    }

    .btn-raw:hover {
      background: rgba(2, 132, 199, 0.25);
      color: #7dd3fc;
      border-color: #0284c7;
    }

    .btn-logout-modern {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.25);
    }

    .btn-logout-modern:hover {
      background: rgba(239, 68, 68, 0.22);
      color: #fca5a5;
      border-color: #ef4444;
    }

    /* Container for Scalar Reference */
    #scalar-reference-wrapper {
      width: 100%;
      min-height: calc(100vh - 64px);
    }

    /* Custom overrides for Scalar Elements to match theme */
    .scalar-api-reference {
      --scalar-font: var(--font-sans) !important;
      --scalar-font-code: var(--font-mono) !important;
      --scalar-background-1: #090d16 !important;
      --scalar-background-2: #0f172a !important;
      --scalar-background-3: #1e293b !important;
      --scalar-border-color: rgba(255, 255, 255, 0.08) !important;
      --scalar-color-1: #f8fafc !important;
      --scalar-color-2: #cbd5e1 !important;
      --scalar-color-3: #94a3b8 !important;
      --scalar-color-accent: #0284c7 !important;
    }
  </style>
</head>

<body>

  <!-- Top Glassmorphism Navigation Bar -->
  <header class="smesta-topbar">
    <div class="brand-section">
      <img src="/docs/logo-smesta-transparent.png" alt="SMESTA Logo" class="brand-logo-img" />
      <div class="brand-text-col">
        <div class="brand-title">
          PT SUSANTI MEGAH
          <span class="brand-badge">Next-Gen Docs</span>
        </div>
        <div class="brand-subtitle">
          <span class="pulse-dot"></span>
          SMESTA Distributor Channel API v1.0.0
        </div>
      </div>
    </div>

    <!-- Live Search Trigger Button (Ctrl + K) -->
    <button class="search-btn-trigger" onclick="openScalarSearch()" title="Cari Endpoint, Tag, Model, atau Deskripsi (Ctrl + K)">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
      </svg>
      <span>Quick Search API...</span>
      <kbd class="search-kbd">Ctrl K</kbd>
    </button>

    <!-- Header Actions -->
    <div class="topbar-actions">
      <!-- Switch to Classic RapiDoc View -->
      <a href="/docs" class="action-link-btn btn-classic" title="Beralih ke tampilan dokumentasi klasik (RapiDoc)">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M14 9l3 3-3 3"/></svg>
        <span>Classic View (/docs)</span>
      </a>

      <!-- Download Raw OpenAPI YAML -->
      <a href="/docs/openapi.yaml" target="_blank" class="action-link-btn btn-raw" title="Download berkas OpenAPI YAML resmi">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>openapi.yaml</span>
      </a>

      <!-- Logout Button -->
      <a href="/docs/logout" class="action-link-btn btn-logout-modern" title="Keluar dari sesi dokumentasi">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span>Logout</span>
      </a>
    </div>
  </header>

  <!-- Scalar Modern API Reference Container -->
  <div id="scalar-reference-wrapper">
    <script
      id="api-reference"
      data-url="/docs/openapi.yaml"
      data-configuration='{
        "theme": "purple",
        "layout": "modern",
        "darkMode": true,
        "showSidebar": true,
        "searchHotKey": "k",
        "metaData": {
          "title": "SMESTA API Docs",
          "description": "Dokumentasi Lengkap API Backend Distributor Channel PT Susanti Megah"
        },
        "hiddenClients": []
      }'
    ></script>
  </div>

  <!-- Scalar Standalone CDN Script -->
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>

  <script>
    // Trigger Scalar's built-in command palette search modal
    function openScalarSearch() {
      // 1. Coba klik langsung tombol search bawaan Scalar di sidebar jika tersedia di DOM
      const scalarSearchButton = document.querySelector('.scalar-api-reference button[aria-label*="Search"], .scalar-api-reference .search-button, [data-testid="search-button"]');
      if (scalarSearchButton) {
        scalarSearchButton.click();
        return;
      }

      // 2. Fallback: Dispatch keyboard event Ctrl+K
      const event = new KeyboardEvent('keydown', {
        key: 'k',
        code: 'KeyK',
        ctrlKey: true,
        metaKey: true,
        bubbles: true,
        cancelable: true
      });
      document.dispatchEvent(event);
    }

    // Tangkap shortcut keyboard Ctrl+K atau Cmd+K dari mana saja di halaman
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        openScalarSearch();
      }
    });
  </script>

</body>

</html>
