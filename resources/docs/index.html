<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>PT Susanti Megah - SMESTA Docs</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- RapiDoc Web Component -->
  <script type="module" src="https://unpkg.com/rapidoc/dist/rapidoc-min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      color: #0f172a;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body.dark-mode {
      background-color: #0f172a;
      color: #f8fafc;
    }

    rapi-doc {
      width: 100%;
      height: calc(100vh - 68px);
    }

    /* ============================================================
       Header Bar (Default Light Theme)
     ============================================================ */
    .header-bar {
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 68px;
      box-sizing: border-box;
      z-index: 10;
      position: relative;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    body.dark-mode .header-bar {
      background-color: #0b1120;
      border-bottom: 1px solid #1e293b;
    }

    .brand-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    body.dark-mode .brand-text h1 {
      color: #f8fafc;
    }

    .brand-text span {
      font-size: 12px;
      color: #0284c7;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    body.dark-mode .brand-text span {
      color: #38bdf8;
    }

    /* ============================================================
       Header Controls & Quick Actions
     ============================================================ */
    .header-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .control-btn {
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .control-btn:hover {
      background-color: #f1f5f9;
      border-color: #94a3b8;
      color: #0f172a;
    }

    body.dark-mode .control-btn {
      background-color: #1e293b;
      border-color: #334155;
      color: #cbd5e1;
    }

    body.dark-mode .control-btn:hover {
      background-color: #334155;
      border-color: #475569;
      color: #f8fafc;
    }

    .control-btn svg {
      stroke: currentColor;
    }

    .control-btn.btn-theme {
      background-color: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    .control-btn.btn-theme:hover {
      background-color: #dbeafe;
      color: #1e40af;
    }

    body.dark-mode .control-btn.btn-theme {
      background-color: #064e3b;
      border-color: #059669;
      color: #6ee7b7;
    }

    body.dark-mode .control-btn.btn-theme:hover {
      background-color: #047857;
      color: #ffffff;
    }

    .control-btn.btn-logout {
      background-color: #fef2f2;
      border-color: #fecaca;
      color: #dc2626;
    }

    .control-btn.btn-logout:hover {
      background-color: #fee2e2;
      border-color: #ef4444;
      color: #b91c1c;
    }

    body.dark-mode .control-btn.btn-logout {
      background-color: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.35);
      color: #f87171;
    }

    body.dark-mode .control-btn.btn-logout:hover {
      background-color: rgba(239, 68, 68, 0.25);
      border-color: #ef4444;
      color: #ffffff;
    }

    /* ============================================================
       Interactive Documentation Pets (3 Walking Pets)
     ============================================================ */
    #smesta-pet-playground {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 110px;
      pointer-events: none;
      z-index: 9999;
      overflow: visible;
    }

    .smesta-pet {
      position: fixed;
      bottom: 6px;
      width: 58px;
      height: 58px;
      pointer-events: auto;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      z-index: 9999;
      filter: drop-shadow(0 4px 6px rgba(15, 23, 42, 0.22));
      transition: filter 0.15s ease;
    }

    .smesta-pet:hover {
      filter: drop-shadow(0 6px 12px rgba(2, 132, 199, 0.45));
    }

    .smesta-pet:active {
      cursor: grabbing;
    }

    .smesta-pet-sprite {
      width: 100%;
      height: 100%;
      transform-origin: center bottom;
      transition: transform 0.12s ease;
    }

    .smesta-pet.walking .smesta-pet-body {
      animation: petWalkBob 0.36s infinite alternate ease-in-out;
    }

    .smesta-pet.walking .pet-leg-a {
      animation: petLegSwingA 0.28s infinite alternate ease-in-out;
      transform-origin: center top;
    }

    .smesta-pet.walking .pet-leg-b {
      animation: petLegSwingB 0.28s infinite alternate ease-in-out;
      transform-origin: center top;
    }

    .smesta-pet .pet-tail {
      animation: petTailWag 0.55s infinite alternate ease-in-out;
      transform-origin: left center;
    }

    @keyframes petWalkBob {
      0% { transform: translateY(0px) rotate(-1.5deg); }
      100% { transform: translateY(-4px) rotate(1.5deg); }
    }

    @keyframes petLegSwingA {
      0% { transform: rotate(-18deg); }
      100% { transform: rotate(18deg); }
    }

    @keyframes petLegSwingB {
      0% { transform: rotate(18deg); }
      100% { transform: rotate(-18deg); }
    }

    @keyframes petTailWag {
      0% { transform: rotate(-14deg); }
      100% { transform: rotate(16deg); }
    }

    .smesta-pet-nametag {
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.78);
      color: #ffffff;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
      letter-spacing: 0.03em;
    }

    body.dark-mode .smesta-pet-nametag {
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .smesta-pet-bubble {
      position: absolute;
      bottom: 64px;
      left: 50%;
      transform: translateX(-50%) scale(0.85);
      background: #ffffff;
      color: #0f172a;
      border: 1.5px solid #0284c7;
      border-radius: 10px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.16);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .smesta-pet-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 5px 0;
      border-style: solid;
      border-color: #0284c7 transparent transparent;
    }

    .smesta-pet-bubble.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    body.dark-mode .smesta-pet-bubble {
      background: #1e293b;
      color: #f8fafc;
      border-color: #38bdf8;
    }

    body.dark-mode .smesta-pet-bubble::after {
      border-color: #38bdf8 transparent transparent;
    }

    .smesta-pet-ball {
      position: fixed;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fde047, #eab308 60%, #ca8a04);
      border: 2px solid #ffffff;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
      z-index: 9998;
      pointer-events: none;
      display: none;
    }

    .pet-heart-particle {
      position: fixed;
      font-size: 14px;
      pointer-events: none;
      z-index: 10000;
      animation: petHeartFloat 0.9s ease-out forwards;
    }

    @keyframes petHeartFloat {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-38px) scale(1.35); }
    }
  </style>
</head>

<body class="light-mode">

  <!-- Header Bar -->
  <div class="header-bar">
    <div class="brand-wrapper">
      <div class="brand-text">
        <h1>PT SUSANTI MEGAH</h1>
        <span>SMESTA API Documentation</span>
      </div>
    </div>
    
    <div class="header-controls">
      <!-- Filter Modul Dropdown (Default: Semua Modul Jadi 1) -->
      <select id="module-selector" class="control-btn" onchange="switchModuleSpec(this.value)" title="Pilih Tampilan Modul Dokumentasi" style="padding: 5px 10px; outline: none;">
        <option value="/docs/openapi.yaml">📚 Semua Modul (Jadi 1 - Full API)</option>
        <option value="/docs/modules/production.yaml">🏭 Modul Production</option>
        <option value="/docs/modules/logistic-ekspedisi.yaml">🚚 Modul Logistic &amp; Ekspedisi</option>
        <option value="/docs/modules/sales-orders.yaml">🛒 Modul Sales Orders &amp; CMO</option>
        <option value="/docs/modules/purchasing-vendor.yaml">📦 Modul Purchasing &amp; Vendor</option>
        <option value="/docs/modules/claims-programs.yaml">🎁 Modul Claims &amp; Programs</option>
        <option value="/docs/modules/hr-recruitment.yaml">👥 Modul HR &amp; Recruitment</option>
        <option value="/docs/modules/task-reporting.yaml">📊 Modul Task &amp; Reporting</option>
        <option value="/docs/modules/master-auth-core.yaml">🔐 Modul Master, Auth &amp; Core</option>
      </select>

      <!-- Expand / Collapse Sidebar -->
      <button class="control-btn" onclick="toggleNavStyle('expanded')" title="Buka Semua Kategori Modul">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        Expand All
      </button>
      <button class="control-btn" onclick="toggleNavStyle('collapsed')" title="Tutup Semua Kategori Modul">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/></svg>
        Collapse All
      </button>

      <!-- Toggle Dark / Light Theme -->
      <button class="control-btn btn-theme" onclick="toggleTheme()" title="Ubah Tema Light / Dark">
        <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <span id="theme-text">Dark Mode</span>
      </button>

      <!-- Interactive Pets Controls -->
      <button class="control-btn" onclick="throwPetBall()" title="Lempar bola untuk dikejar 3 Pet!">
        🎾 Main Bola
      </button>
      <button class="control-btn" id="pet-toggle-btn" onclick="togglePetsVisibility()" title="Tampilkan / Sembunyikan Pet Interaktif">
        🐾 Pets (3)
      </button>

      <!-- Switch to Next-Gen DocsNew -->
      <a href="/docsnew" class="control-btn" style="background: linear-gradient(135deg, #0284c7, #8b5cf6); color: #ffffff; border: none; font-weight: 700; box-shadow: 0 2px 8px rgba(139, 92, 246, 0.35);" title="Buka Dokumentasi Modern (DocsNew)">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        ✨ DocsNew (Modern)
      </a>

      <!-- Download Raw Spec -->
      <a href="/docs/openapi.yaml" target="_blank" class="control-btn" title="Download raw openapi.yaml">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        openapi.yaml
      </a>

      <!-- Logout -->
      <a href="/docs/logout" class="control-btn btn-logout" title="Logout dari Dokumentasi">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Logout
      </a>
    </div>
  </div>

  <!-- RapiDoc Component (Default Light Mode) -->
  <rapi-doc
    id="api-docs"
    spec-url="/docs/openapi.yaml"
    fetch-credentials="same-origin"
    theme="light"
    render-style="focused"
    nav-item-style="collapsed"
    on-nav-tag-click="expand-collapse"
    show-header="false"
    allow-search="true"
    allow-try="true"
    allow-spec-download="true"
    allow-server-selection="true"
    show-components="true"
    schema-style="tree"
    schema-expand-level="2"
    show-method-in-nav-bar="as-colored-block"
    default-schema-tab="schema"
    use-path-in-nav-bar="false"
    regular-font="Inter, sans-serif"
    mono-font="JetBrains Mono, monospace"
    primary-color="#0284c7"
    bg-color="#ffffff"
    text-color="#0f172a"
    nav-bg-color="#f8fafc"
    nav-text-color="#334155"
    nav-hover-bg-color="#e2e8f0"
    nav-hover-text-color="#0284c7"
    nav-accent-color="#0284c7"
    nav-item-spacing="relaxed"
    layout="row"
  > </rapi-doc>

  <script>
    const THEME_STORAGE_KEY = 'smesta-docs-theme-v2';

    // Ganti file spec modul yang ditampilkan (Default: Semua Modul Jadi 1 /docs/openapi.yaml)
    function switchModuleSpec(specUrl) {
      const apiDocs = document.getElementById('api-docs');
      if (apiDocs && specUrl) {
        apiDocs.setAttribute('spec-url', specUrl);
      }
    }

    // Toggle expand/collapse all kategori modul
    function toggleNavStyle(style) {
      const apiDocs = document.getElementById('api-docs');
      if (!apiDocs || !apiDocs.shadowRoot) return;

      const headers = apiDocs.shadowRoot.querySelectorAll('.nav-bar-tag');
      headers.forEach(header => {
        const next = header.nextElementSibling;
        const isExpanded = header.classList.contains('expanded') || (next && next.classList.contains('nav-bar-path'));
        
        if (style === 'expanded' && !isExpanded) {
          header.click();
        } else if (style === 'collapsed' && isExpanded) {
          header.click();
        }
      });
    }

    // Apply specific theme ('light' or 'dark')
    function applyTheme(targetTheme) {
      const apiDocs = document.getElementById('api-docs');
      const themeText = document.getElementById('theme-text');
      const themeIcon = document.getElementById('theme-icon');

      if (!apiDocs) return;

      if (targetTheme === 'dark') {
        document.body.classList.remove('light-mode');
        document.body.classList.add('dark-mode');

        apiDocs.setAttribute('theme', 'dark');
        apiDocs.setAttribute('bg-color', '#0f172a');
        apiDocs.setAttribute('text-color', '#f8fafc');
        apiDocs.setAttribute('nav-bg-color', '#0b1120');
        apiDocs.setAttribute('nav-text-color', '#cbd5e1');
        apiDocs.setAttribute('nav-hover-bg-color', '#1e293b');
        apiDocs.setAttribute('nav-hover-text-color', '#38bdf8');
        apiDocs.setAttribute('nav-accent-color', '#38bdf8');
        apiDocs.setAttribute('primary-color', '#38bdf8');

        // Update LitElement reactive properties directly as well
        apiDocs.theme = 'dark';
        apiDocs.bgColor = '#0f172a';
        apiDocs.textColor = '#f8fafc';
        apiDocs.navBgColor = '#0b1120';
        apiDocs.navTextColor = '#cbd5e1';
        apiDocs.navHoverBgColor = '#1e293b';
        apiDocs.navHoverTextColor = '#38bdf8';
        apiDocs.navAccentColor = '#38bdf8';
        apiDocs.primaryColor = '#38bdf8';

        if (themeText) themeText.innerText = 'Light Mode';
        if (themeIcon) {
          themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
        }
        localStorage.setItem(THEME_STORAGE_KEY, 'dark');
      } else {
        document.body.classList.remove('dark-mode');
        document.body.classList.add('light-mode');

        apiDocs.setAttribute('theme', 'light');
        apiDocs.setAttribute('bg-color', '#ffffff');
        apiDocs.setAttribute('text-color', '#0f172a');
        apiDocs.setAttribute('nav-bg-color', '#f8fafc');
        apiDocs.setAttribute('nav-text-color', '#334155');
        apiDocs.setAttribute('nav-hover-bg-color', '#e2e8f0');
        apiDocs.setAttribute('nav-hover-text-color', '#0284c7');
        apiDocs.setAttribute('nav-accent-color', '#0284c7');
        apiDocs.setAttribute('primary-color', '#0284c7');

        // Update LitElement reactive properties directly as well
        apiDocs.theme = 'light';
        apiDocs.bgColor = '#ffffff';
        apiDocs.textColor = '#0f172a';
        apiDocs.navBgColor = '#f8fafc';
        apiDocs.navTextColor = '#334155';
        apiDocs.navHoverBgColor = '#e2e8f0';
        apiDocs.navHoverTextColor = '#0284c7';
        apiDocs.navAccentColor = '#0284c7';
        apiDocs.primaryColor = '#0284c7';

        if (themeText) themeText.innerText = 'Dark Mode';
        if (themeIcon) {
          themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
        }
        localStorage.setItem(THEME_STORAGE_KEY, 'light');
      }
    }

    // Toggle Dark Mode / Light Mode
    function toggleTheme() {
      const apiDocs = document.getElementById('api-docs');
      if (!apiDocs) return;
      const isCurrentlyDark = document.body.classList.contains('dark-mode') || apiDocs.getAttribute('theme') === 'dark';
      applyTheme(isCurrentlyDark ? 'light' : 'dark');
    }

    window.addEventListener('DOMContentLoaded', function () {
      // Default adalah 'light' (Mode Terang)
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'light';
      applyTheme(savedTheme === 'dark' ? 'dark' : 'light');

      // Pastikan setelah komponen custom element RapiDoc selesai di-upgrade, tema tetap teraplikasi
      if (window.customElements && window.customElements.whenDefined) {
        window.customElements.whenDefined('rapi-doc').then(function () {
          const currentSaved = localStorage.getItem(THEME_STORAGE_KEY) || 'light';
          applyTheme(currentSaved === 'dark' ? 'dark' : 'light');
        });
      }

      const apiDocs = document.getElementById('api-docs');

      // Polling listener untuk search input otomatis expand saat user mengetik
      const attachSearchListener = setInterval(function() {
        if (apiDocs && apiDocs.shadowRoot) {
          const searchInput = apiDocs.shadowRoot.querySelector('#nav-bar-search');
          if (searchInput) {
            clearInterval(attachSearchListener);
            
            searchInput.addEventListener('input', function(e) {
              const query = e.target.value.trim();
              if (query === '') {
                toggleNavStyle('collapsed');
              } else {
                toggleNavStyle('expanded');
              }
            });
          }
        }
      }, 200);

      setTimeout(function() {
        clearInterval(attachSearchListener);
      }, 15000);
    });
  </script>

  <!-- ============================================================

            <circle cx="41.7" cy="25.3" r="0.8" fill="#ffffff"/>

            <polygon points="45,29 43,31.5 47,31.5" fill="#f43f5e"/>
            <!-- Kumis -->
            <line x1="33" y1="29" x2="38" y2="30" stroke="#7c2d12" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="33" y1="32" x2="38" y2="32" stroke="#7c2d12" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="51" y1="30" x2="57" y2="29" stroke="#7c2d12" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Pet 2: Shiba (Anjing Shiba Inu) -->
    <div id="pet-shiba" class="smesta-pet walking" title="Klik atau tarik Shiba!">
      <div class="smesta-pet-bubble" id="bubble-shiba">Guk! Semua Endpoint Ready! 🚀</div>
      <div class="smesta-pet-sprite" id="sprite-shiba">
        <svg viewBox="0 0 64 64" width="58" height="58" xmlns="http://www.w3.org/2000/svg">
          <g class="smesta-pet-body">
            <!-- Ekor Melingkar Shiba -->
            <path class="pet-tail" d="M15 36 C6 28, 10 18, 18 24 C20 26, 17 32, 15 34" fill="none" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
            <!-- Kaki Belakang -->
            <rect class="pet-leg-b" x="17" y="44" width="6.5" height="12" rx="3" fill="#ca8a04"/>

            <ellipse cx="30" cy="39" rx="16" ry="11.5" fill="#facc15"/>

            <!-- Kaki Depan -->
            <rect class="pet-leg-a" x="22" y="45" width="6.5" height="12" rx="3" fill="#facc15"/>
            <rect class="pet-leg-b" x="41" y="45" width="6.5" height="12" rx="3" fill="#facc15"/>
            <!-- Kalung Merah -->
            <path d="M35 31 Q42 36 48 31" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
            <circle cx="43" cy="35" r="2.5" fill="#fde047" stroke="#b45309" stroke-width="1"/>
            <!-- Kepala -->
            <circle cx="44" cy="25" r="12.5" fill="#facc15"/>
            <!-- Pipi Putih Shiba -->
            <ellipse cx="40" cy="29" rx="4.5" ry="4" fill="#fef9c3"/>

            <circle cx="41" cy="21" r="1.5" fill="#fef9c3"/>

            <polygon points="34,17 36,6 43,14" fill="#ca8a04"/>

    <!-- Pet 3: Piko (Dino Emerald) -->
    <div id="pet-piko" class="smesta-pet walking" title="Klik atau tarik Piko!">
      <div class="smesta-pet-bubble" id="bubble-piko">Rawr! 200 OK Selalu! ✨</div>
      <div class="smesta-pet-sprite" id="sprite-piko">
        <svg viewBox="0 0 64 64" width="58" height="58" xmlns="http://www.w3.org/2000/svg">
          <g class="smesta-pet-body">
            <!-- Ekor Dino -->
            <path class="pet-tail" d="M16 41 L5 36 L14 33 Z" fill="#10b981"/>
            <!-- Sirip Punggung -->
            <polygon points="20,29 24,23 27,29" fill="#f59e0b"/>
            <polygon points="27,27 31,20 34,27" fill="#f59e0b"/>
            <polygon points="34,18 39,11 41,19" fill="#f59e0b"/>
            <!-- Kaki Belakang -->
            <rect class="pet-leg-b" x="21" y="44" width="7" height="12" rx="3.5" fill="#059669"/>
            <!-- Badan Dino -->
            <ellipse cx="29" cy="38" rx="14" ry="11" fill="#10b981"/>
            <ellipse cx="33" cy="40" rx="9" ry="7.5" fill="#a7f3d0"/>
            <!-- Kaki Depan -->
            <rect class="pet-leg-a" x="33" y="45" width="7" height="12" rx="3.5" fill="#10b981"/>
            <!-- Tangan Kecil Dino -->
            <path d="M40 35 L47 37" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
            <!-- Kepala Dino -->
            <rect x="34" y="15" width="20" height="16" rx="8" fill="#10b981"/>
            <!-- Mata & Senyum -->
            <circle cx="46" cy="21" r="2.5" fill="#0f172a"/>
            <circle cx="46.8" cy="20.2" r="0.9" fill="#ffffff"/>
            <circle cx="41" cy="25" r="2.2" fill="#fda4af" opacity="0.7"/>
            <path d="M44 26 Q49 29 52 25" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <div class="smesta-pet-nametag">🦖 Piko</div>
    </div>
  </div>

  <script>
    (function() {
      const PET_MESSAGES = {
        oyen: [
          'Meow! Selamat datang di SMESTA Docs! 🐾',
          'Jangan lupa isi Bearer Token ya! 🔐',
          'Meow~ Filter modul ada di atas! 📚',
          'Klik aku kalau butuh semangat! ❤️',
          'Purrr... Response 200 OK! ✨',
          'Coba lempar bola di tombol atas! 🎾'
        ],
        shiba: [
          'Guk! Semua endpoint siap di-test! 🚀',
          'SAP & Database tersinkronisasi! 🔥',
          'Semangat ngoding hari ini! 💻',
          'Woof! Jangan lupa cek schema ya! 📦',
          'Guk guk! Lempar bolanya dong! 🎾',
          'API lancar jaya tanpa error! ✅'
        ],
        piko: [
          'Rawr! 200 OK tanpa kendala! 🦖',
          'Butuh test endpoint? Klik Try! ⚡',
          'Piko siap menemani baca dokumentasi! 🌟',
          'Rawr~ Dokumentasi rapi & cepat! 🚀',
          ' tarik atau klik aku kapan saja! ✨',
          'Yuk main kejar bola! 🎾'
        ]
      };

      const pets = [
        {
          id: 'oyen',
          el: document.getElementById('pet-oyen'),
          sprite: document.getElementById('sprite-oyen'),
          bubble: document.getElementById('bubble-oyen'),
          x: Math.max(60, Math.floor(window.innerWidth * 0.18)),
          y: 6,
          vy: 0,
          vx: 1.45,
          baseSpeed: 1.45,
          dir: 1,
          state: 'walk',
          stateTimer: 260,
          bubbleTimer: 220,
          dragging: false
        },
        {
          id: 'shiba',
          el: document.getElementById('pet-shiba'),
          sprite: document.getElementById('sprite-shiba'),
          bubble: document.getElementById('bubble-shiba'),
          x: Math.max(180, Math.floor(window.innerWidth * 0.48)),
          y: 6,
          vy: 0,
          vx: -1.75,
          baseSpeed: 1.75,
          dir: -1,
          state: 'walk',
          stateTimer: 310,
          bubbleTimer: 260,
          dragging: false
        },
        {
          id: 'piko',
          el: document.getElementById('pet-piko'),
          sprite: document.getElementById('sprite-piko'),
          bubble: document.getElementById('bubble-piko'),
          x: Math.max(300, Math.floor(window.innerWidth * 0.76)),
          y: 6,
          vy: 0,
          vx: 1.25,
          baseSpeed: 1.25,
          dir: 1,
          state: 'walk',
          stateTimer: 290,
          bubbleTimer: 300,
          dragging: false
        }
      ];

      const ball = {
        el: document.getElementById('smesta-pet-ball'),
        active: false,
        x: 0,
        y: 0,
        vx: 0,
        vy: 0
      };

      let petsVisible = true;
      let activeDragPet = null;
      let dragOffsetX = 0;
      let dragOffsetY = 0;
      let dragMoved = false;

      function showBubble(pet, text, durationFrames) {
        if (!pet.bubble) return;
        pet.bubble.textContent = text;
        pet.bubble.classList.add('visible');
        pet.bubbleTimer = durationFrames || 180;
      }

      function spawnHeart(x, bottomY, symbol) {
        const heart = document.createElement('div');
        heart.className = 'pet-heart-particle';
        heart.textContent = symbol || '❤️';
        heart.style.left = (x + 18 + (Math.random() * 20 - 10)) + 'px';
        heart.style.bottom = (bottomY + 48) + 'px';
        document.body.appendChild(heart);
        setTimeout(function() {
          heart.remove();
        }, 900);
      }

      // Pasang event interaksi (klik & drag) untuk ketiga pet
      pets.forEach(function(pet, idx) {
        if (!pet.el) return;

        // Tampilkan sapaan langsung saat awal buka dokumentasi
        setTimeout(function() {
          showBubble(pet, PET_MESSAGES[pet.id][0], 240);
        }, 300 + idx * 450);

        pet.el.addEventListener('mousedown', function(e) {
          e.preventDefault();
          activeDragPet = pet;
          pet.dragging = true;
          dragMoved = false;
          const rect = pet.el.getBoundingClientRect();
          dragOffsetX = e.clientX - rect.left;
          dragOffsetY = window.innerHeight - e.clientY - pet.y;
        });

        pet.el.addEventListener('click', function() {
          if (dragMoved) return;
          // Lompat gembira saat diklik
          pet.vy = 9.5;
          pet.state = 'walk';
          pet.el.classList.add('walking');
          const msgs = PET_MESSAGES[pet.id];
          const randomMsg = msgs[Math.floor(Math.random() * msgs.length)];
          showBubble(pet, randomMsg, 190);
          spawnHeart(pet.x, pet.y, '❤️');
          setTimeout(function() { spawnHeart(pet.x, pet.y, '✨'); }, 140);
        });
      });

      window.addEventListener('mousemove', function(e) {
        if (!activeDragPet) return;
        dragMoved = true;
        const maxX = window.innerWidth - 68;
        activeDragPet.x = Math.max(10, Math.min(maxX, e.clientX - dragOffsetX));
        activeDragPet.y = Math.max(6, Math.min(window.innerHeight - 100, window.innerHeight - e.clientY - 28));
        activeDragPet.vy = 0;
      });

      window.addEventListener('mouseup', function() {
        if (activeDragPet) {
          activeDragPet.dragging = false;
          showBubble(activeDragPet, 'Wheee~! 🐾', 120);
          activeDragPet = null;
        }
      });

      // Fungsi Lempar Bola Interaktif
      window.throwPetBall = function() {
        if (!petsVisible) {
          window.togglePetsVisibility();
        }
        ball.active = true;
        ball.x = Math.floor(window.innerWidth * (0.2 + Math.random() * 0.6));
        ball.y = Math.floor(window.innerHeight * 0.65);
        ball.vx = (Math.random() > 0.5 ? 1 : -1) * (4 + Math.random() * 4);
        ball.vy = 3;
        ball.el.style.display = 'block';

        pets.forEach(function(pet) {
          pet.state = 'walk';
          pet.el.classList.add('walking');
          showBubble(pet, 'Bola!! Kejar! 🎾', 140);
        });
      };

      // Toggle Sembunyikan / Tampilkan Pet
      window.togglePetsVisibility = function() {
        const playground = document.getElementById('smesta-pet-playground');
        const btn = document.getElementById('pet-toggle-btn');
        petsVisible = !petsVisible;
        if (playground) {
          playground.style.display = petsVisible ? 'block' : 'none';
        }
        if (btn) {
          btn.textContent = petsVisible ? '🐾 Pets (3)' : '🐾 Pets (Off)';
          btn.style.opacity = petsVisible ? '1' : '0.6';
        }
      };

      // Main Animation Loop (60fps)
      function animatePets() {
        if (petsVisible) {
          const maxX = Math.max(120, window.innerWidth - 68);

          // Update fisika bola jika aktif
          if (ball.active) {
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.vy -= 0.48; // gravitasi

            if (ball.x <= 12) {
              ball.x = 12;
              ball.vx = Math.abs(ball.vx) * 0.82;
            } else if (ball.x >= maxX) {
              ball.x = maxX;
              ball.vx = -Math.abs(ball.vx) * 0.82;
            }

            if (ball.y <= 8) {
              ball.y = 8;
              ball.vy = Math.abs(ball.vy) * 0.68;
              ball.vx *= 0.94;
              if (Math.abs(ball.vy) < 1.2 && Math.abs(ball.vx) < 0.35) {
                ball.vy = 0;
              }
            }

            ball.el.style.left = ball.x + 'px';
            ball.el.style.bottom = ball.y + 'px';
          }

          // Update setiap pet
          pets.forEach(function(pet) {
            if (!pet.el) return;

            if (!pet.dragging) {
              // Gravitasi saat melompat / dijatuhkan
              if (pet.y > 6 || pet.vy !== 0) {
                pet.y += pet.vy;
                pet.vy -= 0.52;
                if (pet.y <= 6) {
                  pet.y = 6;
                  if (Math.abs(pet.vy) > 3) {
                    pet.vy = Math.abs(pet.vy) * 0.32;
                  } else {
                    pet.vy = 0;
                  }
                }
              }

              // Jika bola aktif, ketiga pet mengejar bola!
              if (ball.active) {
                const dx = ball.x - pet.x;
                if (Math.abs(dx) > 18) {
                  pet.dir = dx > 0 ? 1 : -1;
                  pet.x += pet.dir * (pet.baseSpeed * 1.9);
                  pet.el.classList.add('walking');
                } else if (ball.y < 36) {
                  // Sundul bola!
                  ball.vy = 8 + Math.random() * 4;
                  ball.vx = (Math.random() - 0.5) * 10;
                  pet.vy = 6.5;
                  spawnHeart(pet.x, pet.y, '🎾');
                  showBubble(pet, 'Dapat bolanya! 🏆', 130);
                  setTimeout(function() {
                    ball.active = false;
                    ball.el.style.display = 'none';
                  }, 3200);
                }
              } else {
                // Pergerakan otonom jalan-jalan
                pet.stateTimer--;
                if (pet.stateTimer <= 0) {
                  const rand = Math.random();
                  if (rand < 0.78) {
                    pet.state = 'walk';
                    pet.dir = Math.random() > 0.5 ? 1 : -1;
                    pet.stateTimer = 180 + Math.floor(Math.random() * 260);
                    pet.el.classList.add('walking');
                  } else {
                    pet.state = 'idle';
                    pet.stateTimer = 70 + Math.floor(Math.random() * 90);
                    pet.el.classList.remove('walking');
                  }

                  // Sesekali lompat kecil atau ngobrol sendiri
                  if (Math.random() < 0.28) {
                    const msgs = PET_MESSAGES[pet.id];
                    showBubble(pet, msgs[Math.floor(Math.random() * msgs.length)], 160);
                  }
                }

                if (pet.state === 'walk') {
                  pet.x += pet.dir * pet.baseSpeed;
                  if (pet.x <= 14) {
                    pet.x = 14;
                    pet.dir = 1;
                  } else if (pet.x >= maxX) {
                    pet.x = maxX;
                    pet.dir = -1;
                  }
                }
              }
            }

            // Timer balon kata
            if (pet.bubbleTimer > 0) {
              pet.bubbleTimer--;
              if (pet.bubbleTimer === 0 && pet.bubble) {
                pet.bubble.classList.remove('visible');
              }
            }

            // Render posisi & arah hadap
            pet.el.style.left = Math.round(pet.x) + 'px';
            pet.el.style.bottom = Math.round(pet.y) + 'px';
            if (pet.sprite) {
              pet.sprite.style.transform = 'scaleX(' + (pet.dir >= 0 ? 1 : -1) + ')';
            }
          });
        }

        requestAnimationFrame(animatePets);
      }

      requestAnimationFrame(animatePets);
    })();
  </script>
