<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>PT Susanti Megah - SM Connect Docs</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --scalar-font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      color: #0f172a;
    }

    /* Top Navigation Bar */
    .top-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 20px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      box-sizing: border-box;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-badge {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
      padding: 5px 9px;
      border-radius: 7px;
      letter-spacing: 0.05em;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .spec-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .spec-link-btn:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
      color: #0f172a;
    }

    .logout-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #dc2626;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .logout-btn:hover {
      background-color: #fee2e2;
      border-color: #fca5a5;
    }

    /* Scalar integration styling */
    .scalar-api-reference {
      min-height: calc(100vh - 56px);
    }
  </style>
</head>

<body>

  <!-- Top Navigation Header -->
  <header class="top-navbar">
    <div class="brand-section">
      <div class="brand-logo-badge">SM</div>
      <div>
        <div class="brand-title">PT SUSANTI MEGAH</div>
        <div class="brand-subtitle">SM Connect API Documentation</div>
      </div>
    </div>
    <div class="nav-actions">
      <a href="/docs/openapi.yaml" target="_blank" class="spec-link-btn" title="Download raw OpenAPI Specification">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        openapi.yaml
      </a>
      <a href="/docs/logout" class="logout-btn" title="Logout dari Dokumentasi">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Logout
      </a>
    </div>
  </header>

  <!-- Scalar API Reference Standalone Component -->
  <script
    id="api-reference"
    data-url="./openapi.yaml"
    data-configuration='{
      "theme": "default",
      "layout": "modern",
      "showSidebar": true,
      "searchHotKey": "k",
      "darkMode": false,
      "hideModels": false,
      "withDefaultFonts": false,
      "authentication": {
        "preferredSecurityScheme": "BearerAuth"
      }
    }'
  ></script>

  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>

</body>

</html>
