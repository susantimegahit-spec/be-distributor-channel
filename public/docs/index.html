<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>PT Susanti Megah - SM Connect Docs</title>

  <!-- Import Google Fonts (Inter) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">

  <!-- Import RapiDoc web component -->
  <script type="module" src="https://unpkg.com/rapidoc/dist/rapidoc-min.js"></script>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      overflow: hidden;
    }

    rapi-doc {
      width: 100%;
      height: calc(100vh - 60px);
    }

    /* ============================================================
       Header Bar
     ============================================================ */
    .header-bar {
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      box-sizing: border-box;
    }

    .header-title-wrapper h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 0.05em;
    }

    .header-title-wrapper span {
      font-size: 11px;
      color: #3b82f6;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ============================================================
       Header Controls (Expand / Collapse)
     ============================================================ */
    .header-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .control-btn {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #64748b;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
    }

    .control-btn:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
      color: #0f172a;
    }

    .control-btn svg {
      stroke: currentColor;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header-bar">
    <div class="header-title-wrapper">
      <h1>PT SUSANTI MEGAH</h1>
      <span>IT Department - SM Connect API</span>
    </div>
    <div class="header-controls">
      <button class="control-btn" onclick="toggleNavStyle('expanded')" title="Expand Semua Kategori">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
        </svg>
        Expand All
      </button>
      <button class="control-btn" onclick="toggleNavStyle('collapsed')" title="Collapse Semua Kategori">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7" />
        </svg>
        Collapse All
      </button>
    </div>
  </div>

  <!-- RapiDoc Component with focused style (makes categories/modules collapsible in sidebar) -->
  <rapi-doc id="api-docs" spec-url="./openapi.yaml" theme="light" render-style="focused" nav-item-style="collapsed"
    on-nav-tag-click="expand-collapse" show-header="false" allow-search="true" allow-try="true"
    allow-spec-download="true" regular-font="Inter, sans-serif" primary-color="#3b82f6" nav-bg-color="#ffffff"
    nav-accent-color="#3b82f6" nav-item-spacing="relaxed" layout="row"> </rapi-doc>

  <script>
    function toggleNavStyle(style) {
      const apiDocs = document.getElementById('api-docs');
      if (apiDocs) {
        apiDocs.setAttribute('nav-item-style', style);
      }
    }
  </script>

</body>

</html>
