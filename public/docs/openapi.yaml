openapi: 3.0.3
info:
  title: SM Connect
  description: Dokumentasi API Backend Distributor Channel menggunakan Laravel 12.
  version: 1.0.0
servers:
  - url: http://api-dev.susantimegah.com/api/distributor-channel
    description: Development Server
  - url: http://localhost:8000/api/distributor-channel
    description: Local Server
paths:
  /v1/pi-settings:
    get:
      summary: Get active Proforma Invoice signature configuration
      description: Mendapatkan nama penandatangan, jabatan, dan berkas/URL tanda tangan digital untuk PI.
      tags:
        - PI Settings
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
          description: ID User pemilik tanda tangan.
        - name: document_tag
          in: query
          required: false
          schema:
            type: string
          description: Tag pengelompokan dokumen (misal INVOICE).
      responses:
        '200':
          description: Konfigurasi berhasil diambil.
    post:
      summary: Update Proforma Invoice signature configuration
      description: Memperbarui nama penandatangan dan/atau mengunggah gambar tanda tangan digital.
      tags:
        - PI Settings
      security:
        - BearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - signer_name
                - signer_title
              properties:
                user_id:
                  type: integer
                  description: ID User pemilik tanda tangan.
                  nullable: true
                document_tag:
                  type: string
                  description: Tag pengelompokan dokumen (misal INVOICE).
                  nullable: true
                signer_name:
                  type: string
                  example: Kushan Wijono
                signer_title:
                  type: string
                  example: Branch Manager
                signature_file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Konfigurasi berhasil diperbarui.

  /v1/claims/balance-ledger:
    get:
      summary: Get Claim Balance Ledger Transactions
      description: Mengambil daftar riwayat transaksi saldo reward/klaim (Debit, Kredit, dan Saldo Berjalan) milik customer.
      tags:
        - Balance Ledger
      security:
        - BearerAuth: []
      parameters:
        - name: customer_codes
          in: query
          required: false
          schema:
            type: string
          description: Kode customer (bisa koma-terpisah, misal CUST01,CUST02). Jika distributor, otomatis hanya melihat miliknya.
          example: C110003074
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Tanggal mulai transaksi (YYYY-MM-DD).
          example: "2026-06-01"
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Tanggal akhir transaksi (YYYY-MM-DD).
          example: "2026-06-30"
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [CLAIM, WITHDRAW, CORRECTION]
          description: Filter tipe transaksi ledger.
          example: CLAIM
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 15
          description: Jumlah item per halaman.
          example: 15
      responses:
        '200':
          description: Daftar riwayat transaksi saldo berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar riwayat transaksi saldo berhasil diambil.
                  data:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            customer_code:
                              type: string
                              example: C110003074
                            customer_name:
                              type: string
                              example: PT SUSANTI MEGAH
                            depo:
                              type: string
                              example: DEPO SURABAYA
                            ref_number:
                              type: string
                              example: SO1234
                            transaction_date:
                              type: string
                              format: date
                              example: "2026-07-13"
                            type:
                              type: string
                              example: WITHDRAW
                            debit:
                              type: number
                              example: 0.00
                            credit:
                              type: number
                              example: 150000.00
                            running_balance:
                              type: number
                              example: 850000.00
                            description:
                              type: string
                              example: Penggunaan Reward (Trade Promo) - Batch BATCH-TEST-123 pada SO SO1234
                            created_by:
                              type: string
                              example: admin
                      total:
                        type: integer
                        example: 1

  /v1/claims/balance-ledger/adjustment:
    post:
      summary: Create Manual Balance Adjustment
      description: Membuat penyesuaian/koreksi saldo secara manual (Debit/Kredit) untuk customer.
      tags:
        - Balance Ledger
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_code
                - adjustment_type
                - description
                - type
              properties:
                customer_code:
                  type: string
                  example: C110003074
                adjustment_type:
                  type: string
                  enum: [DEBIT, CREDIT]
                  description: DEBIT untuk menambah saldo, CREDIT untuk memotong saldo.
                  example: DEBIT
                amount:
                  type: number
                  example: 500000.00
                description:
                  type: string
                  example: Koreksi kelebihan klaim
                type:
                  type: string
                  maxLength: 30
                  description: "Tipe transaksi ledger (contoh: CLAIM, TRANSACTION, WITHDRAW, RETURN, CORRECTION, BONUS). Nilai bersifat dinamis dan otomatis dikonversi ke UPPERCASE di backend."
                  example: CORRECTION
                ref_number:
                  type: string
                  description: Nomor referensi kustom (opsional, jika kosong otomatis digenerate ADJ-YYYYMMDD-XXX).
                  example: REF-CUSTOM-123
                start_date:
                  type: string
                  format: date
                  description: Tanggal mulai periode klaim terkait (opsional).
                  example: "2026-07-01"
                end_date:
                  type: string
                  format: date
                  description: Tanggal akhir periode klaim terkait (opsional).
                  example: "2026-07-31"
      responses:
        '201':
          description: Koreksi saldo berhasil dibuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Koreksi saldo berhasil dibuat.
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      customer_code:
                        type: string
                        example: C110003074
                      ref_number:
                        type: string
                        example: ADJ-20260713-001
                      transaction_date:
                        type: string
                        format: date
                        example: "2026-07-13"
                      type:
                        type: string
                        example: CORRECTION
                      debit:
                        type: number
                        example: 500000.00
                      credit:
                        type: number
                        example: 0.00
                      running_balance:
                        type: number
                        example: 1350000.00
                      description:
                        type: string
                        example: Koreksi kelebihan klaim
                      created_by:
                        type: string
                        example: admin

  /v1/claims/balance-ledger/approved-claims:
    get:
      summary: Get Approved Claim Batches
      description: Mendapatkan daftar klaim yang telah disetujui (debit > 0) berdasarkan kode customer dan opsional filter tanggal.
      tags:
        - Balance Ledger
      security:
        - BearerAuth: []
      parameters:
        - name: customer_code
          in: query
          required: false
          schema:
            type: string
          description: Kode customer (jika distributor, otomatis hanya melihat miliknya).
          example: C110003074
        - name: tanggal
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter tanggal transaksi (YYYY-MM-DD).
          example: "2026-07-14"
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Tanggal mulai transaksi (YYYY-MM-DD) untuk rentang filter.
          example: "2026-07-01"
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Tanggal akhir transaksi (YYYY-MM-DD) untuk rentang filter.
          example: "2026-07-31"
      responses:
        '200':
          description: Daftar klaim yang disetujui berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar klaim yang disetujui berhasil diambil.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        batch_id:
                          type: integer
                          example: 1
                          nullable: true
                        batch_no:
                          type: string
                          example: B-001
                          nullable: true
                        debit:
                          type: number
                          example: 150000.00
                        customer_code:
                          type: string
                          example: C110003074
                        customer_name:
                          type: string
                          example: PT SUSANTI MEGAHIT
                        depo:
                          type: string
                          example: DEPO SURABAYA
                        transaction_date:
                          type: string
                          format: date
                          example: "2026-07-14"

  /v1/sales-orders/{id}/pdf:
    get:
      summary: Download Sales Order PI PDF
      description: Mengunduh file PDF Proforma Invoice secara langsung dari backend.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari Sales Order
      responses:
        '200':
          description: File PDF berhasil dikembalikan.
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /v1/sales-orders/{id}/invoices:
    get:
      summary: Get associated invoices from SAP
      description: Mengambil daftar invoice yang berasosiasi dengan Sales Order ini dari SAP Business One.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order lokal.
      responses:
        '200':
          description: List invoice berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: List invoice berhasil diambil.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        DOCENTRY:
                          type: string
                          example: "1209"
                        INVOICENUM:
                          type: string
                          example: "260130002"
                        DOCDATE:
                          type: string
                          example: "20260102"
                        DOCSTATUS:
                          type: string
                          example: "C"
        '500':
          description: Gagal mengambil daftar invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/login:
    post:
      summary: User Login
      description: Login menggunakan username dan password untuk mendapatkan Bearer Token.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: password
      responses:
        '200':
          description: Login sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '422':
          description: Validasi gagal / kredensial salah / user tidak aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/logout:
    post:
      summary: User Logout
      description: Menghapus token aktif yang digunakan untuk request.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/refresh:
    post:
      summary: Refresh Token
      description: Menghapus token lama dan mengeluarkan token baru.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Refresh token sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/change-password:
    post:
      summary: Ubah Password
      description: Mengubah password user yang sedang login dengan memvalidasi password lama.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
                - new_password_confirmation
              properties:
                old_password:
                  type: string
                  example: password
                new_password:
                  type: string
                  example: passwordbaru123
                new_password_confirmation:
                  type: string
                  example: passwordbaru123
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '422':
          description: Validasi gagal (misal password lama salah, atau password baru sama dengan password lama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/master-approvals:
    get:
      summary: List all master approvals
      description: Mendapatkan daftar semua master approval yang ada di sistem secara ascending berdasarkan ID.
      tags:
        - Master Approvals
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar master approval berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar master approval berhasil diambil.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MasterApproval'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/roles:
    get:
      summary: List all roles
      description: Mendapatkan daftar semua role yang ada di sistem.
      tags:
        - Roles
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar role berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new role
      description: Menambahkan role baru ke dalam sistem.
      tags:
        - Roles
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: distributor
                is_active:
                  type: boolean
                  example: true
                approval_id:
                  type: integer
                  nullable: true
                  example: 3
                menu:
                  type: array
                  items:
                    type: object
                  example: []
                accessible_systems:
                  type: array
                  items:
                    type: string
                  example: ["distributor", "ekspedisi"]
      responses:
        '200':
          description: Role berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '422':
          description: Validasi gagal / nama role sudah terpakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/roles/{id}:
    get:
      summary: Get role detail
      description: Mendapatkan detail satu role berdasarkan ID.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      responses:
        '200':
          description: Detail role berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update an existing role
      description: Memperbarui data role (nama atau status aktif) berdasarkan ID.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: distributor_premium
                is_active:
                  type: boolean
                  example: false
                approval_id:
                  type: integer
                  nullable: true
                  example: 3
                menu:
                  type: array
                  items:
                    type: object
                  example: []
                accessible_systems:
                  type: array
                  items:
                    type: string
                  example: ["distributor", "ekspedisi"]
      responses:
        '200':
          description: Role berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '422':
          description: Validasi gagal / nama role sudah terpakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a role
      description: Menghapus data role berdasarkan ID.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      responses:
        '200':
          description: Role berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/roles/{id}/menu:
    get:
      summary: Get menu configuration for a specific role
      description: Mendapatkan data struktur menu (JSON) milik role tertentu berdasarkan ID.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      responses:
        '200':
          description: Menu role berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Menu role berhasil diambil.
                  data:
                    type: object
                    properties:
                      menu:
                        type: array
                        items:
                          type: object
                      approval_id:
                        type: integer
                        nullable: true
                        example: 3
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
 
    put:
      summary: Update menu configuration for a specific role
      description: Memperbarui struktur menu dinamis (JSON) milik role tertentu.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - menu
              properties:
                approval_id:
                  type: integer
                  nullable: true
                  example: 3
                menu:
                  type: array
                  items:
                    type: object
                  example:
                    - id: "charts-maps"
                      title: "Charts-maps"
                      type: "group"
                      children: []
      responses:
        '200':
          description: Menu role berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Menu role berhasil diperbarui.
                  data:
                    type: object
                    properties:
                      menu:
                        type: array
                        items:
                          type: object
                      approval_id:
                        type: integer
                        nullable: true
                        example: 3
        '422':
          description: Validasi gagal (misal field menu kosong atau bukan array)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/users:
    get:
      summary: List all users
      description: Mendapatkan daftar semua user beserta detail role mereka.
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar user berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new user
      description: Menambahkan user baru ke dalam sistem.
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - username
                - email
                - password
                - role_id
              properties:
                name:
                  type: string
                  example: Budi Santoso
                username:
                  type: string
                  example: budis
                email:
                  type: string
                  format: email
                  example: budi@susantimegah.com
                password:
                  type: string
                  format: password
                  example: password123
                role_id:
                  type: integer
                  example: 5
                code_customer:
                  type: string
                  nullable: true
                  example: C110000411
                is_active:
                  type: boolean
                  example: true
      responses:
        '200':
          description: User berhasil dibuat
          content:
            application/json:
              schema:
