      summary: Cek sales order berdasarkan tanggal ETA
      description: Mendapatkan daftar sales order dengan kondisi tanggal ETA lebih cepat dari tanggal request ETA yang dikirimkan.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: customer_code
          in: query
          required: false
          schema:
            type: string
          description: Kode customer (CardCode) untuk memfilter data. Jika kosong, data semua customer akan diambil.
          example: C110003074
        - name: eta_date_request
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Tanggal batas request ETA (YYYY-MM-DD). Data SO yang memiliki eta_date < eta_date_request akan diambil.
          example: "2026-03-06"
      responses:
        '200':
          description: Daftar sales order berdasarkan cek ETA berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderListResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sales-orders:
    get:
      summary: List all sales orders
      description: Mendapatkan daftar semua sales order. Jika diakses oleh user distributor, hanya menampilkan sales order miliknya.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter berdasarkan status order
        - name: card_code
          in: query
          required: false
          schema:
            type: string
          description: Filter berdasarkan kode customer (CardCode)
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter tanggal mulai pembuatan/doc_date (YYYY-MM-DD)
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter tanggal akhir pembuatan/doc_date (YYYY-MM-DD)
      responses:
        '200':
          description: Daftar sales order berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderListResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create Sales Order Draft or Direct Submit
      description: Membuat draft sales order baru. Jika parameter 'action' diisi 'submit', Sales Order akan langsung dibuat dan dikirim ke OM.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderDraftUpdateRequest'
      responses:
        '200':
          description: Sales order berhasil dibuat (sebagai draft atau langsung terkirim)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '403':
          description: Hak akses ditolak (hanya untuk distributor)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validasi input gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

