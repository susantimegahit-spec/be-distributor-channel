components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MasterApproval:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: DRAFT
        label:
          type: string
          example: DRAFT
        action:
          type: string
          example: create draft
        notification_type:
          type: string
          example: none
        created_at:
          type: string
          format: date-time
          example: "2026-06-18T13:45:01+07:00"
        updated_at:
          type: string
          format: date-time
          example: "2026-06-18T13:45:01+07:00"

    SuccessMessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: object
          nullable: true
          example: null

    LoginSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login berhasil.
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Administrator PT Susanti Megah
                username:
                  type: string
                  example: admin
                email:
                  type: string
                  example: admin@susantimegah.com
                role_id:
                  type: integer
                  example: 5
                role_name:
                  type: string
                  example: administrator
                code_customer:
                  type: string
                  example: C110000411
                id_distributor:
                  type: integer
                  nullable: true
                  example: 1
                name_distributor:
                  type: string
                  nullable: true
                  example: PT XYZ
                is_active:
                  type: boolean
                  example: true
                accessible_systems:
                  type: array
                  items:
                    type: string
                  example: ["distributor", "ekspedisi"]
            menu:
              type: array
              items:
                type: object
              example:
                - id: "charts-maps"
                  title: "Charts-maps"
                  type: "group"
                  children:
                    - id: "charts"
                      title: "Charts"
                      type: "collapse"
                      icon: "ph ph-chart-donut"
                      selected: true
                      children:
                        - id: "apex-chart"
                          title: "Apex chart"
                          type: "item"
                          url: "/charts/apex-chart"
                    - id: "map"
                      title: "Map"
                      type: "collapse"
                      icon: "ph ph-map-trifold"
                      children:
                        - id: "google-map"
                          title: "Google map"
                          type: "item"
                          url: "/map/google-map"
            access_token:
              type: string
              example: 1|laravel_sanctum_token_string_here
            token_type:
              type: string
              example: Bearer

    RefreshTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Token berhasil diperbarui.
        data:
          type: object
          properties:
            access_token:
              type: string
              example: 2|new_laravel_sanctum_token_string_here
            token_type:
              type: string
              example: Bearer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        status_code:
          type: integer
          example: 422
        message:
          type: string
          example: Error message description.
        errors:
          type: object
          example: {}

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: distributor
        is_active:
          type: boolean
          example: true
        accessible_systems:
          type: array
          items:
            type: string
          example: ["distributor", "ekspedisi"]
        created_at:
          type: string
          format: date-time
          example: "2026-06-05T08:00:00.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-06-05T08:00:00.000000Z"
        role_menu:
          type: object
          properties:
            id:
              type: integer
              example: 1
            role_id:
              type: integer
              example: 1
            approval_id:
              type: integer
              nullable: true
              example: 3
            menu:
              type: array
              items:
                type: object
              example: []
            is_active:
              type: boolean
              example: true
            created_at:
              type: string
              format: date-time
              example: "2026-06-05T08:00:00.000000Z"
            updated_at:
              type: string
              format: date-time
              example: "2026-06-05T08:00:00.000000Z"

    RoleListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Daftar role berhasil diambil.
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    RoleResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Detail role berhasil diambil.
        data:
          $ref: '#/components/schemas/Role'

    User:
      type: object
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: Budi Santoso
        username:
          type: string
          example: budis
        email:
          type: string
          example: budi@susantimegah.com
        role_id:
          type: integer
          example: 5
        code_customer:
