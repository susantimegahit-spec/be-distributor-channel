openapi: 3.0.3
info:
  title: PT Susanti Megah - Distributor Channel API
  description: Dokumentasi API Backend Distributor Channel menggunakan Laravel 12.
  version: 1.0.0
servers:
  - url: http://api-dev.susantimegah.com/api/distributor-channel
    description: Development Server
  - url: http://localhost:8000/api/distributor-channel
    description: Local Server
paths:
  /v1/auth/login:
    post:
      summary: User Login
      description: Login menggunakan username dan password untuk mendapatkan Bearer Token.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - code_customer
                - password
              properties:
                username:
                  type: string
                  example: admin
                code_customer:
                  type: string
                  example: C110000411
                password:
                  type: string
                  example: password
      responses:
        '200':
          description: Login sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '422':
          description: Validasi gagal / kredensial salah / user tidak aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/logout:
    post:
      summary: User Logout
      description: Menghapus token aktif yang digunakan untuk request.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/refresh:
    post:
      summary: Refresh Token
      description: Menghapus token lama dan mengeluarkan token baru.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Refresh token sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/change-password:
    post:
      summary: Ubah Password
      description: Mengubah password user yang sedang login dengan memvalidasi password lama.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
                - new_password_confirmation
              properties:
                old_password:
                  type: string
                  example: password
                new_password:
                  type: string
                  example: passwordbaru123
                new_password_confirmation:
                  type: string
                  example: passwordbaru123
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '422':
          description: Validasi gagal (misal password lama salah, atau password baru sama dengan password lama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/roles:
    get:
      summary: List all roles
      description: Mendapatkan daftar semua role yang ada di sistem.
      tags:
        - Roles
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar role berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new role
      description: Menambahkan role baru ke dalam sistem.
      tags:
        - Roles
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: distributor
                is_active:
                  type: boolean
                  example: true
                menu:
                  type: array
                  items:
                    type: object
                  example: []
      responses:
        '200':
          description: Role berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '422':
          description: Validasi gagal / nama role sudah terpakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/roles/{id}:
    get:
      summary: Get role detail
      description: Mendapatkan detail satu role berdasarkan ID.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      responses:
        '200':
          description: Detail role berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update an existing role
      description: Memperbarui data role (nama atau status aktif) berdasarkan ID.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: distributor_premium
                is_active:
                  type: boolean
                  example: false
                menu:
                  type: array
                  items:
                    type: object
                  example: []
      responses:
        '200':
          description: Role berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '422':
          description: Validasi gagal / nama role sudah terpakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a role
      description: Menghapus data role berdasarkan ID.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      responses:
        '200':
          description: Role berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/roles/{id}/menu:
    get:
      summary: Get menu configuration for a specific role
      description: Mendapatkan data struktur menu (JSON) milik role tertentu berdasarkan ID.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      responses:
        '200':
          description: Menu role berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Menu role berhasil diambil.
                  data:
                    type: array
                    items:
                      type: object
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update menu configuration for a specific role
      description: Memperbarui struktur menu dinamis (JSON) milik role tertentu.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - menu
              properties:
                menu:
                  type: array
                  items:
                    type: object
                  example:
                    - id: "charts-maps"
                      title: "Charts-maps"
                      type: "group"
                      children: []
      responses:
        '200':
          description: Menu role berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Menu role berhasil diperbarui.
                  data:
                    type: array
                    items:
                      type: object
        '422':
          description: Validasi gagal (misal field menu kosong atau bukan array)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/users:
    get:
      summary: List all users
      description: Mendapatkan daftar semua user beserta detail role mereka.
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar user berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new user
      description: Menambahkan user baru ke dalam sistem.
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - username
                - email
                - password
                - role_id
              properties:
                name:
                  type: string
                  example: Budi Santoso
                username:
                  type: string
                  example: budis
                email:
                  type: string
                  format: email
                  example: budi@susantimegah.com
                password:
                  type: string
                  format: password
                  example: password123
                role_id:
                  type: integer
                  example: 5
                is_active:
                  type: boolean
                  example: true
      responses:
        '200':
          description: User berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validasi gagal (misal email/username sudah terpakai)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/users/{id}:
    get:
      summary: Get user detail
      description: Mendapatkan detail satu user beserta rolenya berdasarkan ID.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari user
      responses:
        '200':
          description: Detail user berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update an existing user
      description: Memperbarui data profil user, status aktif, password, atau role.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Budi Santoso Updated
                username:
                  type: string
                  example: budisu
                email:
                  type: string
                  format: email
                  example: budi.new@susantimegah.com
                password:
                  type: string
                  format: password
                  example: passwordbaru123
                role_id:
                  type: integer
                  example: 2
                is_active:
                  type: boolean
                  example: false
      responses:
        '200':
          description: User berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validasi gagal / email atau username bentrok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a user
      description: Menghapus data user berdasarkan ID.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari user
      responses:
        '200':
          description: User berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '404':
          description: User tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/distributors:
    get:
      summary: List all distributors
      description: Mendapatkan daftar semua distributor yang ada di sistem.
      tags:
        - Distributors
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar distributor berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributorListResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/distributors/sync:
    post:
      summary: Sync distributors from SAP
      description: Melakukan sinkronisasi data master distributor dari SAP ke database lokal.
      tags:
        - Distributors
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sinkronisasi data distributor berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributorListResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/distributors/{id}:
    get:
      summary: Get distributor detail
      description: Mendapatkan detail satu distributor berdasarkan ID.
      tags:
        - Distributors
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari distributor
      responses:
        '200':
          description: Detail distributor berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributorResponse'
        '404':
          description: Distributor tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sales-orders:
    get:
      summary: List all sales orders
      description: Mendapatkan daftar semua sales order. Jika diakses oleh user distributor, hanya menampilkan sales order miliknya.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter berdasarkan status order
      responses:
        '200':
          description: Daftar sales order berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderListResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create sales order draft
      description: Membuat draft sales order baru beserta detail baris itemnya.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSalesOrderRequest'
      responses:
        '200':
          description: Draft sales order berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '403':
          description: Hak akses ditolak (hanya untuk distributor)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validasi input gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sales-orders/{id}:
    get:
      summary: Get sales order detail
      description: Mendapatkan detail satu sales order beserta detail itemnya berdasarkan ID.
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order
      responses:
        '200':
          description: Detail sales order berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '404':
          description: Sales order tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update draft sales order
      description: Memperbarui draft sales order (hanya diperbolehkan jika status order masih DRAFT).
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSalesOrderRequest'
      responses:
        '200':
          description: Draft sales order berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '404':
          description: Sales order tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validasi gagal atau status bukan DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete draft sales order
      description: Menghapus draft sales order (hanya diperbolehkan jika status order masih DRAFT).
      tags:
        - Sales Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari sales order
      responses:
        '200':
          description: Draft sales order berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '404':
          description: Sales order tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Gagal menghapus karena status bukan DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessMessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: object
          nullable: true
          example: null

    LoginSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login berhasil.
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Administrator PT Susanti Megah
                username:
                  type: string
                  example: admin
                email:
                  type: string
                  example: admin@susantimegah.com
                role_id:
                  type: integer
                  example: 5
                role_name:
                  type: string
                  example: administrator
                code_customer:
                  type: string
                  example: C110000411
                is_active:
                  type: boolean
                  example: true
            menu:
              type: array
              items:
                type: object
              example:
                - id: "charts-maps"
                  title: "Charts-maps"
                  type: "group"
                  children:
                    - id: "charts"
                      title: "Charts"
                      type: "collapse"
                      icon: "ph ph-chart-donut"
                      selected: true
                      children:
                        - id: "apex-chart"
                          title: "Apex chart"
                          type: "item"
                          url: "/charts/apex-chart"
                    - id: "map"
                      title: "Map"
                      type: "collapse"
                      icon: "ph ph-map-trifold"
                      children:
                        - id: "google-map"
                          title: "Google map"
                          type: "item"
                          url: "/map/google-map"
            access_token:
              type: string
              example: 1|laravel_sanctum_token_string_here
            token_type:
              type: string
              example: Bearer

    RefreshTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Token berhasil diperbarui.
        data:
          type: object
          properties:
            access_token:
              type: string
              example: 2|new_laravel_sanctum_token_string_here
            token_type:
              type: string
              example: Bearer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        status_code:
          type: integer
