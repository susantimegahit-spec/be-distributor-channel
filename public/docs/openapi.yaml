          description: Sales order berhasil dikirim ke SAP
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Sales order berhasil dikirim ke SAP.
                  data:
                    type: object
                    properties:
                      ErrorCode:
                        type: integer
                        example: 0
                      Message:
                        type: string
                        example: Sales Order added successfully
                      Result:
                        type: array
                        items:
                          type: object
                          properties:
                            DocEntry:
                              type: integer
                              example: 9999
                            DocNum:
                              type: string
                              example: SO9999
        '400':
          description: Gagal mengintegrasikan sales order ke SAP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

