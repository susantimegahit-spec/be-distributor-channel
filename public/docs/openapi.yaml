openapi: 3.0.3
info:
  title: PT Susanti Megah - Distributor Channel API
  description: Dokumentasi API Backend Distributor Channel menggunakan Laravel 12.
  version: 1.0.0
servers:
  - url: http://api-dev.susantimegah.com/api/distributor-channel
    description: Development Server
  - url: http://localhost:8000/api/distributor-channel
    description: Local Server
paths:
  /v1/auth/login:
    post:
      summary: User Login
      description: Login menggunakan username dan password untuk mendapatkan Bearer Token.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: password
      responses:
        '200':
          description: Login sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '422':
          description: Validasi gagal / kredensial salah / user tidak aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/logout:
    post:
      summary: User Logout
      description: Menghapus token aktif yang digunakan untuk request.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/refresh:
    post:
      summary: Refresh Token
      description: Menghapus token lama dan mengeluarkan token baru.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Refresh token sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/change-password:
    post:
      summary: Ubah Password
      description: Mengubah password user yang sedang login dengan memvalidasi password lama.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
                - new_password_confirmation
              properties:
                old_password:
                  type: string
                  example: password
                new_password:
                  type: string
                  example: passwordbaru123
                new_password_confirmation:
                  type: string
                  example: passwordbaru123
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '422':
          description: Validasi gagal (misal password lama salah, atau password baru sama dengan password lama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/roles:
    get:
      summary: List all roles
      description: Mendapatkan daftar semua role yang ada di sistem.
      tags:
        - Roles
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar role berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new role
      description: Menambahkan role baru ke dalam sistem.
      tags:
        - Roles
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: distributor
                is_active:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Role berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '422':
          description: Validasi gagal / nama role sudah terpakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/roles/{id}:
    get:
      summary: Get role detail
      description: Mendapatkan detail satu role berdasarkan ID.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      responses:
        '200':
          description: Detail role berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update an existing role
      description: Memperbarui data role (nama atau status aktif) berdasarkan ID.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: distributor_premium
                is_active:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Role berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '422':
          description: Validasi gagal / nama role sudah terpakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a role
      description: Menghapus data role berdasarkan ID.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      responses:
        '200':
          description: Role berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessMessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: object
          nullable: true
          example: null

    LoginSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login berhasil.
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Administrator PT Susanti Megah
                username:
                  type: string
                  example: admin
                email:
                  type: string
                  example: admin@susantimegah.com
                role_id:
                  type: integer
                  example: 5
                role_name:
                  type: string
                  example: administrator
                is_active:
                  type: boolean
                  example: true
            menu:
              type: array
              items:
                type: object
              example:
                - id: "charts-maps"
                  title: "Charts-maps"
                  type: "group"
                  children:
                    - id: "charts"
                      title: "Charts"
                      type: "collapse"
                      icon: "ph ph-chart-donut"
                      selected: true
                      children:
                        - id: "apex-chart"
                          title: "Apex chart"
                          type: "item"
                          url: "/charts/apex-chart"
                    - id: "map"
                      title: "Map"
                      type: "collapse"
                      icon: "ph ph-map-trifold"
                      children:
                        - id: "google-map"
                          title: "Google map"
                          type: "item"
                          url: "/map/google-map"
            access_token:
              type: string
              example: 1|laravel_sanctum_token_string_here
            token_type:
              type: string
              example: Bearer

    RefreshTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Token berhasil diperbarui.
        data:
          type: object
          properties:
            access_token:
              type: string
              example: 2|new_laravel_sanctum_token_string_here
            token_type:
              type: string
              example: Bearer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        status_code:
          type: integer
          example: 422
        message:
          type: string
          example: Error message description.
        errors:
          type: object
          example: {}

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: distributor
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2026-06-05T08:00:00.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-06-05T08:00:00.000000Z"

    RoleListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Daftar role berhasil diambil.
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    RoleResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Detail role berhasil diambil.
        data:
          $ref: '#/components/schemas/Role'
