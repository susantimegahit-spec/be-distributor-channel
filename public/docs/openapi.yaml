    get:
      summary: Get claim reward balance and summary
      description: Mendapatkan ringkasan saldo klaim reward distributor (total klaim, total terverifikasi, total penarikan, sisa saldo).
      tags:
        - Claims
      security:
        - BearerAuth: []
      parameters:
        - name: customer_code
          in: query
          required: false
          schema:
            type: string
          description: Filter berdasarkan kode customer (opsional jika login sebagai admin/sales).
        - name: customer_codes
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: Filter berdasarkan beberapa kode customer (multiple).
      responses:
        '200':
          description: Summary saldo reward berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_claimed:
                    type: number
                    example: 1500000.00
                  total_verified:
                    type: number
                    example: 1200000.00
                  total_withdrawn:
                    type: number
                    example: 500000.00
                  available_balance:
                    type: number
                    example: 700000.00
        '401':
          description: Tidak terautentikasi

  /v1/claims/withdraws:
    get:
      summary: Get list of withdrawals
      description: Mendapatkan daftar riwayat pengajuan penarikan reward distributor (paginated).
      tags:
        - Claims
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
        - name: customer_code
          in: query
          required: false
          schema:
            type: string
        - name: customer_codes
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: Filter berdasarkan beberapa kode customer (multiple).
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Daftar withdraw berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Withdraw'
                  current_page:
                    type: integer
                  last_page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
        '401':
          description: Tidak terautentikasi

    post:
      summary: Submit a new withdrawal request
      description: Mengajukan penarikan saldo reward baru oleh distributor.
      tags:
        - Claims
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - lines
              properties:
                amount:
                  type: number
                  example: 500000.00
                  description: Total nominal withdraw yang diajukan.
                lines:
                  type: array
                  description: Detail pemotongan nominal per batch.
                  items:
                    type: object
                    required:
                      - batch_id
                      - amount
                    properties:
                      batch_id:
                        type: integer
                        example: 1
                        description: ID batch upload program yang dipilih.
                      amount:
                        type: number
                        example: 200000.00
                        description: Nominal yang ditarik dari batch tersebut.
      responses:
        '201':
          description: Pengajuan withdraw berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Pengajuan withdraw berhasil dibuat.
                  data:
                    $ref: '#/components/schemas/Withdraw'
        '422':
          description: Saldo tidak mencukupi atau nominal tidak valid
        '401':
          description: Tidak terautentikasi

  /v1/claims/withdraws/{id}/status:
