openapi: 3.0.3
info:
  title: PT Susanti Megah - Distributor Channel API
  description: Dokumentasi API Backend Distributor Channel menggunakan Laravel 12.
  version: 1.0.0
servers:
  - url: http://api-dev.susantimegah.com/api/distributor-channel
    description: Development Server
  - url: http://localhost:8000/api/distributor-channel
    description: Local Server
paths:
  /v1/auth/login:
    post:
      summary: User Login
      description: Login menggunakan username dan password untuk mendapatkan Bearer Token.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - code_customer
                - password
              properties:
                username:
                  type: string
                  example: admin
                code_customer:
                  type: string
                  example: C110000411
                password:
                  type: string
                  example: password
      responses:
        '200':
          description: Login sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '422':
          description: Validasi gagal / kredensial salah / user tidak aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/logout:
    post:
      summary: User Logout
      description: Menghapus token aktif yang digunakan untuk request.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/refresh:
    post:
      summary: Refresh Token
      description: Menghapus token lama dan mengeluarkan token baru.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Refresh token sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/change-password:
    post:
      summary: Ubah Password
      description: Mengubah password user yang sedang login dengan memvalidasi password lama.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
                - new_password_confirmation
              properties:
                old_password:
                  type: string
                  example: password
                new_password:
                  type: string
                  example: passwordbaru123
                new_password_confirmation:
                  type: string
                  example: passwordbaru123
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '422':
          description: Validasi gagal (misal password lama salah, atau password baru sama dengan password lama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/roles:
    get:
      summary: List all roles
      description: Mendapatkan daftar semua role yang ada di sistem.
      tags:
        - Roles
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar role berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new role
      description: Menambahkan role baru ke dalam sistem.
      tags:
        - Roles
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: distributor
                is_active:
                  type: boolean
                  example: true
                menu:
                  type: array
                  items:
                    type: object
                  example: []
      responses:
        '200':
          description: Role berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '422':
          description: Validasi gagal / nama role sudah terpakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/roles/{id}:
    get:
      summary: Get role detail
      description: Mendapatkan detail satu role berdasarkan ID.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      responses:
        '200':
          description: Detail role berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update an existing role
      description: Memperbarui data role (nama atau status aktif) berdasarkan ID.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: distributor_premium
                is_active:
                  type: boolean
                  example: false
                menu:
                  type: array
                  items:
                    type: object
                  example: []
      responses:
        '200':
          description: Role berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '422':
          description: Validasi gagal / nama role sudah terpakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a role
      description: Menghapus data role berdasarkan ID.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      responses:
        '200':
          description: Role berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/roles/{id}/menu:
    get:
      summary: Get menu configuration for a specific role
      description: Mendapatkan data struktur menu (JSON) milik role tertentu berdasarkan ID.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      responses:
        '200':
          description: Menu role berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Menu role berhasil diambil.
                  data:
                    type: array
                    items:
                      type: object
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update menu configuration for a specific role
      description: Memperbarui struktur menu dinamis (JSON) milik role tertentu.
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - menu
              properties:
                menu:
                  type: array
                  items:
                    type: object
                  example:
                    - id: "charts-maps"
                      title: "Charts-maps"
                      type: "group"
                      children: []
      responses:
        '200':
          description: Menu role berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Menu role berhasil diperbarui.
                  data:
                    type: array
                    items:
                      type: object
        '422':
          description: Validasi gagal (misal field menu kosong atau bukan array)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/users:
    get:
      summary: List all users
      description: Mendapatkan daftar semua user beserta detail role mereka.
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar user berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new user
      description: Menambahkan user baru ke dalam sistem.
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - username
                - email
                - password
                - role_id
              properties:
                name:
                  type: string
                  example: Budi Santoso
                username:
                  type: string
                  example: budis
                email:
                  type: string
                  format: email
                  example: budi@susantimegah.com
                password:
                  type: string
                  format: password
                  example: password123
                role_id:
                  type: integer
                  example: 5
                code_customer:
                  type: string
                  nullable: true
                  example: C110000411
                is_active:
                  type: boolean
                  example: true
      responses:
        '200':
          description: User berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validasi gagal (misal email/username sudah terpakai)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/users/{id}:
    get:
      summary: Get user detail
      description: Mendapatkan detail satu user beserta rolenya berdasarkan ID.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari user
      responses:
        '200':
          description: Detail user berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update an existing user
      description: Memperbarui data profil user, status aktif, password, atau role.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Budi Santoso Updated
                username:
                  type: string
                  example: budisu
                email:
                  type: string
                  format: email
                  example: budi.new@susantimegah.com
                password:
                  type: string
                  format: password
                  example: passwordbaru123
                role_id:
                  type: integer
                  example: 2
                code_customer:
                  type: string
                  nullable: true
                  example: C110000411
                is_active:
                  type: boolean
                  example: false
      responses:
        '200':
          description: User berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validasi gagal / email atau username bentrok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a user
      description: Menghapus data user berdasarkan ID.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID dari user
      responses:
        '200':
          description: User berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '404':
          description: User tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/discounts/sap:
    post:
      summary: Send UDO Discount to SAP
      description: Mengirim data diskon UDO ke SAP. Kode diskon diambil secara otomatis melalui API GetNumDis.
      tags:
        - Discounts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - CardCode
                - CardName
                - Lines
              properties:
                CardCode:
                  type: string
                  example: C110003074
                CardName:
                  type: string
                  example: LESAFFRE SARI
                Lines:
                  type: array
                  items:
                    type: object
                    required:
                      - TypeDiscount
                      - Persentase
                      - TotalDiskon
                    properties:
                      TypeDiscount:
                        type: string
                        example: Diskon Item
                      Persentase:
                        type: number
                        example: 0
                      TotalDiskon:
                        type: number
                        example: 3000000
                      Remarks:
                        type: string
                        example: DISC SEMARAK AWAL THN
      responses:
        '200':
          description: Diskon UDO berhasil dikirim ke SAP
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Diskon UDO berhasil dikirim ke SAP.
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                        example: "20260314001"
                      sap_response:
                        type: object
        '422':
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Gagal menghubungi API SAP / API SAP mengembalikan error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/discounts/types:
    get:
      summary: List all discount types
      description: Mendapatkan daftar semua tipe diskon dari database lokal (yang telah disinkronkan).
      tags:
        - Discounts
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Keyword pencarian berdasarkan tipe atau deskripsi.
      responses:
        '200':
          description: Daftar tipe diskon berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar tipe diskon berhasil diambil.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        fld_value:
                          type: string
                          example: Cash Diskon
                        descr:
                          type: string
                          example: Cash Diskon
                        status:
                          type: integer
                          example: 1
                        created_at:
                          type: string
                          format: date-time
                          example: "2026-06-10T08:00:00.000000Z"
                        updated_at:
                          type: string
                          format: date-time
                          example: "2026-06-10T08:00:00.000000Z"
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/discounts/types/sync:
    post:
      summary: Sync discount types from SAP
      description: Melakukan sinkronisasi data master tipe diskon dari SAP ke database lokal.
      tags:
        - Discounts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sinkronisasi data tipe diskon berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Data tipe diskon berhasil disinkronisasi dari SAP.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        fld_value:
                          type: string
                          example: Cash Diskon
                        descr:
                          type: string
                          example: Cash Diskon
                        status:
                          type: integer
                          example: 1
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Gagal menghubungi API SAP / API SAP mengembalikan error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/distributors:
    get:
      summary: List all distributors
      description: Mendapatkan daftar semua distributor yang ada di sistem.
      tags:
        - Distributors
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Keyword untuk mencari distributor berdasarkan nama, code, alamat, depo, dll.
      responses:
        '200':
          description: Daftar distributor berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributorListResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/distributors/sync:
    post:
      summary: Sync distributors from SAP
      description: Melakukan sinkronisasi data master distributor dari SAP ke database lokal.
      tags:
        - Distributors
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sinkronisasi data distributor berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributorListResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/distributors/addresses:
    get:
      summary: Get distributor addresses from SAP
      description: Mengambil data alamat distributor secara real-time dari API SAP.
      tags:
        - Distributors
      security:
        - BearerAuth: []
      parameters:
        - name: card_code
          in: query
          required: false
          schema:
            type: string
          description: Kode Customer / CardCode dari SAP (Bisa menggunakan param 'CustomQuery' juga).
          example: C110003175
        - name: CustomQuery
          in: query
          required: false
          schema:
            type: string
          description: Kode Customer / CardCode dari SAP.
          example: C110003175
      responses:
        '200':
          description: Daftar alamat berhasil diambil dari SAP
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar alamat berhasil diambil dari SAP.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        CardCode:
                          type: string
                          example: C110003175
                        Address:
                          type: string
                          example: ALAMAT PENAGIHAN
                        AdresType:
                          type: string
                          example: B
                        Street:
                          type: string
                          example: JL. AMD PERGUDANGAN KARIANGAU SQUARE NO.10 RT.010 KARIANGAU BALIKPAPAN BARAT,
        '422':
          description: Parameter wajib diisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Gagal menghubungi API SAP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/distributors/ocr-codes:
    get:
      summary: Get OCR codes from local database
      description: Mengambil data OcrCode dari database lokal dengan dukungan pencarian dan filter target.
      tags:
        - Distributors
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: ['1', '2', '3']
          description: Nilai filter target (1 untuk Cabang/CABANG, 2 untuk Bisnis Unit/UNIT, 3 untuk Dept/DEPARTEMENT).
          example: "3"
        - name: custom_query
          in: query
          required: false
          schema:
            type: string
            enum: ['1', '2', '3']
          description: Nilai filter target (1 untuk Cabang/CABANG, 2 untuk Bisnis Unit/UNIT, 3 untuk Dept/DEPARTEMENT).
          example: "3"
        - name: CustomQuery
          in: query
          required: false
          schema:
            type: string
            enum: ['1', '2', '3']
          description: Nilai filter target (1 untuk Cabang/CABANG, 2 untuk Bisnis Unit/UNIT, 3 untuk Dept/DEPARTEMENT).
          example: "3"
        - name: search
          in: query
          required: false
          schema:
            type: string
