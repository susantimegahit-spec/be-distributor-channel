name: Deploy Laravel App to cPanel

on:
  push:
    branches:
      - development

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, mysql, pgsql

      - name: Install Composer Dependencies (Production)
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Deploy via SFTP/SSH
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvO --delete"
          SOURCE: "./"
          REMOTE_HOST: "103.89.4.98"
          REMOTE_USER: "susantimegah"
          REMOTE_PORT: "22"
          TARGET: "/home/susantimegah/public_html/api-dev.susantimegah.com"
          EXCLUDE: "/node_modules/, /.git/, /.github/, /tests/, .env, .env.example, phpunit.xml, README.md, /storage/, /.htaccess, /public/.htaccess, /public/storage"
